waypoint:
  name: waypoint
  for: service
  namespace: istio-waypoints
  allowedRoutesFrom: All
  deployment:
    replicas: 2
    resources:
      # 2026-09-22: relax req==limit (user-approved). Spiky; live ~90Mi.
      # 2026-09-23: right-size request to 192Mi on 30d Prometheus baseline
      # (ceil(p50/0.9)); limit stays 256Mi (LIM FLOOR 256, computed 238 below it).
      requests:
        cpu: 100m
        memory: 192Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 128Mi
  podDisruptionBudget:
    minAvailable: 1

name: amazon-eks-pod-identity-webhook
namespace: default

pod-identity-webhook:
  replicaCount: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  mutatingWebhook:
    failurePolicy: Fail
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - pod-identity-webhook
            topologyKey: kubernetes.io/hostname
  resources:
    # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    requests:
      cpu: 10m
      memory: 41Mi
    limits:
      # 2026-10-09: 30d spike ~39.9Mi vs 45Mi limit (88.7% — OOM risk); limit -> 48Mi (ceil(spike*1.2)).
      memory: 48Mi
  config:
    defaultAwsRegion: eu-west-1
    tokenAudience: oidc.siutsin.com

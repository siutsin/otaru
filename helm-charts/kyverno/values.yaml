namespace: kyverno

_shared:
  resources: &resources
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi

_pdb: &pdb
  enabled: true
  minAvailable: 1

# Scrape annotations for each controller's metrics Service (port 8000).
# The Prometheus AuthorizationPolicy for this port already existed
# (templates/authorization-policy.yaml) but nothing set these annotations,
# so the kubernetes-service-endpoints job never picked the services up.
_metricsScrape: &metricsScrape
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"

kyverno:
  # Lets kyverno-policy grant narrow, auditable PolicyExceptions instead of
  # bespoke exclude lists per ClusterPolicy. Restricted to this namespace so
  # an exception can't be self-granted from a workload namespace.
  features:
    policyExceptions:
      enabled: true
      namespace: kyverno
  admissionController:
    # 2026-09-23: split from the shared &resources anchor; sized on its own
    # 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    resources:
      requests:
        cpu: 50m
        memory: 184Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 203Mi
        ephemeral-storage: 64Mi
    podDisruptionBudget: *pdb
    metricsService: *metricsScrape
  backgroundController:
    resources: *resources
    podDisruptionBudget: *pdb
    metricsService: *metricsScrape
  cleanupController:
    resources: *resources
    podDisruptionBudget: *pdb
    metricsService: *metricsScrape
  reportsController:
    # KRR 2026-07-18: CPU 14d peak ~335m vs shared 50m request. Split out of
    # the shared &resources anchor so background/cleanup keep 50m.
    # 2026-09-23: right-size memory on 30d Prometheus baseline
    # (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    # KRR 2026-09-24: CPU 14d peak now ~510m vs 335m request (reports churn
    # during policy audits). Bump 335m -> 600m for ~1.2x headroom.
    resources:
      requests:
        cpu: 600m
        memory: 125Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 152Mi
        ephemeral-storage: 64Mi
    podDisruptionBudget: *pdb
    metricsService: *metricsScrape

namespace: kube-system

istio-cni:
  profile: ambient
  cniBinDir: /var/lib/rancher/k3s/data/cni
  cniConfDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
  resources:
    # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    # 2026-10-08: 30d spike ~87Mi vs 97Mi limit (89.6% — OOM risk); limit -> 105Mi (ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 58Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 105Mi
      ephemeral-storage: 64Mi

# Falco wrapper. All keys pass to the upstream falco subchart.
# Upstream: falco 9.2.0 (app 0.45.0). Alerts flow via Prometheus metrics
# (falcosecurity_falco_rules_matches_total) to the Telegram receiver.
falco:
  # Flush logs at once.
  tty: true
  image:
    registry: dhi.io
    repository: falco
    tag: 0.45.0@sha256:9da930770190c0117855cfb121e251e452f8dc0fff149d0c4a5e636115b027fc
  driver:
    # CO-RE eBPF, no per-kernel build. Fits k3s nodes with BTF.
    kind: modern_ebpf
    modernEbpf:
      # Caps (BPF, SYS_RESOURCE, PERFMON, SYS_PTRACE), not privileged.
      leastPrivileged: true
    loader:
      initContainer:
        resources:
          # 2026-10-09: sane small default, no baseline. Resize after metrics.
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 64Mi
            ephemeral-storage: 64Mi
  # Upstream container-engine defaults already list the k3s socket
  # (/run/k3s/containerd/containerd.sock). No override.
  metrics:
    enabled: true
    service:
      # Stock endpoints job scrapes this Service. No operator in cluster.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8765"
        prometheus.io/path: "/metrics"
  serviceMonitor:
    # No ServiceMonitor CRD in this cluster. True blocks ArgoCD sync.
    create: false
  resources:
    # 2026-10-09: no live baseline yet. Upstream default is req 512Mi /
    # lim 1024Mi. Req==limit per repo policy. Revisit after 30d.
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 128Mi
  falcoctl:
    config:
      artifact:
        install:
          refs: [falco-rules:5, falco-incubating-rules:6, falco-sandbox-rules:6]
        follow:
          refs: [falco-rules:5, falco-incubating-rules:6, falco-sandbox-rules:6]
    artifact:
      install:
        resources:
          # 2026-10-09: sane small default, no baseline. Resize after metrics.
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 64Mi
            ephemeral-storage: 64Mi
      follow:
        resources:
          # 2026-10-09: sane small default, no baseline. Resize after metrics.
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 64Mi
            ephemeral-storage: 64Mi
  # Four high-signal stable rules plus one incubating rule. Upstream
  # incubating defaults are a firehose; disable "*" keeps the rest off.
  falco:
    rules_files:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/falco-incubating_rules.yaml
      - /etc/falco/falco-sandbox_rules.yaml
      - /etc/falco/falco_rules.local.yaml
      - /etc/falco/rules.d
    rules:
      - disable:
          rule: "*"
      - enable:
          rule: Terminal shell in container
      - enable:
          rule: Launch Privileged Container
      - enable:
          rule: Read sensitive file untrusted
      - enable:
          rule: Netcat Remote Code Execution in Container
      - enable:
          rule: Drop and execute new binary in container
      - enable:
          rule: Redirect STDOUT/STDIN to Network Connection in Container
      - enable:
          rule: Search Private Keys or Passwords
      - enable:
          rule: Launch Package Management Process in Container
      - enable:
          rule: Detect crypto miners using the Stratum protocol
  customRules:
    # Narrow exceptions for known-benign package manager launches:
    # cyberchef runs `apk manifest nginx` from its nginx entrypoint on start;
    # the teslamate CNPG verify-pitr job installs curl.
    # Longhorn CSI runs privileged by design; scope to its images.
    rules-exceptions.yaml: |-
      - rule: Launch Package Management Process in Container
        exceptions:
          - name: cyberchef_nginx_entrypoint
            fields: [proc.name, container.image.repository]
            comps: [=, =]
            values:
              - [apk, ghcr.io/gchq/cyberchef]
          - name: teslamate_verify_pitr
            fields: [proc.name, container.name, k8s.ns.name]
            comps: [=, =, =]
            values:
              - [apk, verify-pitr, teslamate]
        override:
          exceptions: append
      - list: longhorn_privileged_images
        items: [longhornio/longhorn-manager, longhornio/csi-node-driver-registrar, longhornio/livenessprobe]
      - macro: user_privileged_containers
        condition: >-
          (k8s.ns.name = "longhorn-system" and container.image.repository in (longhorn_privileged_images))
  falcosidekick:
    # Off. Alerts flow via metrics, not webhooks. No outputs are due.
    enabled: false

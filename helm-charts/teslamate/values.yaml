name: teslamate
namespace: teslamate

# VPA 2026-07-30: onboarded the main teslamate app after a steady-state
# usage check (7d avg/max ~223/230Mi against a 320Mi request, ratio ~1.03,
# no incident history). Deliberately excludes teslamate-grafana, which has
# a documented OOMKill history (128Mi -> 512Mi) and stays on manual KRR.
vpa:
  enabled: true

database:
  host: teslamate-20260412-0619-rw.teslamate
  name: app
  port: "5432"
  appSecretName: &databaseAppSecretName teslamate-20260412-0619-app

deployment:
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: teslamate
            topologyKey: kubernetes.io/hostname
  image:
    # Pull from GHCR (ghcr.io/teslamate-org/teslamate), not Docker Hub.
    # Temporary hotfix for Tesla Owner API 403 after v4.0.0 (teslamate-org/teslamate#5399).
    # Stay on `main` until the next upstream release (4.3.0), then switch to
    # its Docker Hub release tag. GHCR publishes only the floating `main` tag,
    # so the pin tracks a `main` digest. Renovate refreshes it without the
    # release-age delay (see renovate.json5).
    # Recurring failure mode: upstream rebuilds `main` and garbage-collects
    # the old digest, so the pinned digest becomes NotFound at ghcr.io. On
    # a rollout restart the new pod then hits ImagePullBackOff while the old
    # pod keeps serving, so no outage but the Application goes Degraded.
    # Occurrences with a digest bump each time: 2026-08-05, 2026-08-12,
    # 2026-08-21, 2026-09-03, 2026-09-06, 2026-09-10, 2026-09-19 (9th; digest
    # 0d32891a gone).
    repository: ghcr.io/teslamate-org/teslamate
    # Multi-arch main digest (linux/amd64 + arm64).
    tag: main@sha256:a5dd5577d68f81c83e255736c6028f4cb933f0abcd0d7d9e6e8a3b0f4d6d7033
  envFrom:
    - secretRef:
        name: teslamate
  env:
    - name: DISABLE_MQTT
      value: "true"
    - name: TZ
      value: Europe/London
    - name: LOCALE
      value: en
    - name: DATABASE_HOST
      value: &databaseHost teslamate-20260412-0619-rw.teslamate
    - name: DATABASE_NAME
      value: &databaseName app
    - name: DATABASE_PORT
      value: &databasePort "5432"
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: *databaseAppSecretName
          key: username
    - name: DATABASE_PASS
      valueFrom:
        secretKeyRef:
          name: *databaseAppSecretName
          key: password

service:
  containerPort: 4000
  port: 4000

grafana:
  testFramework:
    # Helm test hooks are not run under Argo CD and leave orphaned resources that degrade app health.
    enabled: false
  # 2026-07-25: no PDB existed, found during a repo-wide audit after the
  # same gap caused real outages for umami, home-assistant, and
  # prometheus-server the same day (see documentation/gotcha.md).
  podDisruptionBudget:
    minAvailable: 1
  resources:
    # 128Mi -> 512Mi: TeslaMate dashboard usage pushed Grafana against the 128Mi limit and caused OOMKills.
    # Not following the repo convention (memory request = limit): deliberate exception for a spiky workload, same as blocky.
    # 2026-09-19: OOMKilled (exit 137) at the 512Mi limit while searching trips ran slow dashboard queries (~28s).
    # Spiky like blocky: 14d steady state per pod is p50 ~220-340Mi and p99 ~260-390Mi, with rare bursts to 456Mi and 512Mi (the kill).
    # The 512Mi peak was capped by the old limit, so the real burst is unknown. The request drops 512Mi -> 384Mi (about the
    # steady-state p99) and the limit rises 512Mi -> 2Gi. An unused limit reserves nothing. Watch the node: raspberrypi-00 had ~1.5Gi
    # available at its worst in 7d, so a full 2Gi burst would squeeze it.
    requests:
      cpu: 50m
      memory: 384Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 2Gi
      ephemeral-storage: 128Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: teslamate
                app.kubernetes.io/name: grafana
            topologyKey: kubernetes.io/hostname
  annotations:
    reloader.stakater.com/auto: "true"
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 10
  image:
    registry: ghcr.io
    repository: teslamate-org/teslamate/grafana
    # Same recurring garbage-collection failure mode as the main teslamate
    # image (see the deployment.image comment above). Digest bumps:
    # 2026-08-13, 2026-09-06 (digest fe24cb24 gone).
    tag: main@sha256:ea46abd2a643cb5a356feb1946f2e384134df62ec6b92fd6203ee040dba43f1f
  database:
    secretName: *databaseAppSecretName
  envValueFrom:
    DATABASE_HOST:
      secretKeyRef:
        name: *databaseAppSecretName
        key: host
    DATABASE_NAME:
      secretKeyRef:
        name: *databaseAppSecretName
        key: dbname
    DATABASE_USER:
      secretKeyRef:
        name: *databaseAppSecretName
        key: username
    DATABASE_PASS:
      secretKeyRef:
        name: *databaseAppSecretName
        key: password
  admin:
    existingSecret: teslamate-grafana

backup:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
      ephemeral-storage: 2Gi
    limits:
      memory: 256Mi
      ephemeral-storage: 2Gi
  schedule: "0 10 * * *"
  verify:
    schedule: "0 12 * * *"
    verificationQuery: "SELECT count(*) FROM positions;"
  verifyPitr:
    schedule: "0 14 * * *"
    activeDeadlineSeconds: 28800 # 8 hours
    timeoutSeconds: 21600 # 6 hours
    verificationQuery: "SELECT count(*) FROM positions;"
    restore:
      storage:
        size: 5Gi
        storageClass: longhorn-crypto-global
  ttlSecondsAfterFinished: 600 # 10 minutes
  backoffLimit: 4
  concurrencyPolicy: Forbid
  database:
    imageName: ghcr.io/cloudnative-pg/postgresql:17.4
    secretName: *databaseAppSecretName
    postgresVersion: "17"

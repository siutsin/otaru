name: teslamate
namespace: teslamate

# VPA 2026-07-30: onboarded the main teslamate app after a steady-state
# usage check (7d avg/max ~223/230Mi against a 320Mi request, ratio ~1.03,
# no incident history). Deliberately excludes teslamate-grafana, which has
# a documented OOMKill history (128Mi -> 512Mi) and stays on manual KRR.
vpa:
  enabled: true

database:
  host: teslamate-20260412-0619-rw.teslamate
  name: app
  port: "5432"
  appSecretName: &databaseAppSecretName teslamate-20260412-0619-app

deployment:
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: teslamate
            topologyKey: kubernetes.io/hostname
  image:
    # Pull from GHCR (ghcr.io/teslamate-org/teslamate), not Docker Hub.
    # Temporary hotfix for Tesla Owner API 403 after v4.0.0 (teslamate-org/teslamate#5399).
    # Pin to a stable GHCR release tag once 4.0.1+ is published. Upstream
    # publishes no semver tags today, only the floating `main` tag, so the
    # pin has to track a `main` digest.
    # Recurring failure mode: upstream rebuilds `main` and garbage-collects
    # the old digest, so the pinned digest becomes NotFound at ghcr.io. On
    # a rollout restart the new pod then hits ImagePullBackOff while the old
    # pod keeps serving, so no outage but the Application goes Degraded.
    # Occurrences with a digest bump each time: 2026-08-05, 2026-08-12,
    # 2026-08-21, 2026-09-03, 2026-09-06, 2026-09-10 (8th; digest
    # 4682b927 gone).
    repository: ghcr.io/teslamate-org/teslamate
    # Multi-arch main digest (linux/amd64 + arm64).
    tag: main@sha256:0d32891a6c3072ffa338fa5d6b4ff104900411666007ed85e9b1fccabd13a453
  envFrom:
    - secretRef:
        name: teslamate
  env:
    - name: DISABLE_MQTT
      value: "true"
    - name: TZ
      value: Europe/London
    - name: LOCALE
      value: en
    - name: DATABASE_HOST
      value: &databaseHost teslamate-20260412-0619-rw.teslamate
    - name: DATABASE_NAME
      value: &databaseName app
    - name: DATABASE_PORT
      value: &databasePort "5432"
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: *databaseAppSecretName
          key: username
    - name: DATABASE_PASS
      valueFrom:
        secretKeyRef:
          name: *databaseAppSecretName
          key: password

service:
  containerPort: 4000
  port: 4000

grafana:
  testFramework:
    # Helm test hooks are not run under Argo CD and leave orphaned resources that degrade app health.
    enabled: false
  # 2026-07-25: no PDB existed, found during a repo-wide audit after the
  # same gap caused real outages for umami, home-assistant, and
  # prometheus-server the same day (see documentation/gotcha.md).
  podDisruptionBudget:
    minAvailable: 1
  resources:
    # Keep memory at 512Mi: TeslaMate dashboard usage pushed Grafana against the 128Mi limit and caused OOMKills.
    requests:
      cpu: 50m
      memory: 512Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 128Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: teslamate
                app.kubernetes.io/name: grafana
            topologyKey: kubernetes.io/hostname
  annotations:
    reloader.stakater.com/auto: "true"
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 10
  image:
    registry: ghcr.io
    repository: teslamate-org/teslamate/grafana
    # Same recurring garbage-collection failure mode as the main teslamate
    # image (see the deployment.image comment above). Digest bumps:
    # 2026-08-13, 2026-09-06 (digest fe24cb24 gone).
    tag: main@sha256:b75980232cb175d303ef5e722b2bd266893857845b0bbef9fbd2ab757358d2b4
  database:
    secretName: *databaseAppSecretName
  envValueFrom:
    DATABASE_HOST:
      secretKeyRef:
        name: *databaseAppSecretName
        key: host
    DATABASE_NAME:
      secretKeyRef:
        name: *databaseAppSecretName
        key: dbname
    DATABASE_USER:
      secretKeyRef:
        name: *databaseAppSecretName
        key: username
    DATABASE_PASS:
      secretKeyRef:
        name: *databaseAppSecretName
        key: password
  admin:
    existingSecret: teslamate-grafana

backup:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
      ephemeral-storage: 2Gi
    limits:
      memory: 256Mi
      ephemeral-storage: 2Gi
  schedule: "0 10 * * *"
  verify:
    schedule: "0 12 * * *"
    verificationQuery: "SELECT count(*) FROM positions;"
  verifyPitr:
    schedule: "0 14 * * *"
    activeDeadlineSeconds: 28800 # 8 hours
    timeoutSeconds: 21600 # 6 hours
    verificationQuery: "SELECT count(*) FROM positions;"
    restore:
      storage:
        size: 5Gi
        storageClass: longhorn-crypto-global
  ttlSecondsAfterFinished: 600 # 10 minutes
  backoffLimit: 4
  concurrencyPolicy: Forbid
  database:
    imageName: ghcr.io/cloudnative-pg/postgresql:17.4
    secretName: *databaseAppSecretName
    postgresVersion: "17"

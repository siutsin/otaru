name: teslamate
namespace: teslamate

# VPA 2026-07-30: onboarded the main teslamate app after a steady-state
# usage check (7d avg/max ~223/230Mi against a 320Mi request, ratio ~1.03,
# no incident history). Deliberately excludes teslamate-grafana, which has
# a documented OOMKill history (128Mi -> 512Mi) and stays on manual KRR.
vpa:
  enabled: true

database:
  host: teslamate-20260412-0619-rw.teslamate
  name: app
  port: "5432"
  appSecretName: &databaseAppSecretName teslamate-20260412-0619-app

deployment:
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: teslamate
            topologyKey: kubernetes.io/hostname
  image:
    # Pull from GHCR (ghcr.io/teslamate-org/teslamate), not Docker Hub.
    # Temporary hotfix for Tesla Owner API 403 after v4.0.0 (teslamate-org/teslamate#5399).
    # Pin to a stable GHCR release tag once 4.0.1+ is published.
    # 2026-08-12: the previous main@5e4a1b91 digest (itself a 2026-08-05
    # replacement for a garbage-collected digest) was garbage-collected
    # upstream in turn -- third occurrence of this recurring failure mode
    # for any floating-tag digest pin here. Bumped to the current main
    # digest again.
    repository: ghcr.io/teslamate-org/teslamate
    # 2026-08-21: previous main@ed3d6109 digest was garbage-collected
    # upstream in turn -- fifth occurrence of this recurring failure mode
    # (ImagePullBackOff, confirmed NotFound against the registry).
    # Bumped to the current main digest again.
    # 2026-09-03: previous main@3751c1eb digest was garbage-collected
    # upstream in turn -- sixth occurrence. teslamate Deployment could not
    # roll a restart (new pod ImagePullBackOff, NotFound against ghcr.io);
    # old pod kept serving so no outage, but the Application went Degraded.
    # Bumped to the current multi-arch main digest (linux/amd64 + arm64).
    tag: main@sha256:50dea666c3a360318c005e458077f6321f67aec87ec06b943746a9f3071351c8
  envFrom:
    - secretRef:
        name: teslamate
  env:
    - name: DISABLE_MQTT
      value: "true"
    - name: TZ
      value: Europe/London
    - name: LOCALE
      value: en
    - name: DATABASE_HOST
      value: &databaseHost teslamate-20260412-0619-rw.teslamate
    - name: DATABASE_NAME
      value: &databaseName app
    - name: DATABASE_PORT
      value: &databasePort "5432"
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: *databaseAppSecretName
          key: username
    - name: DATABASE_PASS
      valueFrom:
        secretKeyRef:
          name: *databaseAppSecretName
          key: password

service:
  containerPort: 4000
  port: 4000

grafana:
  testFramework:
    # Helm test hooks are not run under Argo CD and leave orphaned resources that degrade app health.
    enabled: false
  # 2026-07-25: no PDB existed, found during a repo-wide audit after the
  # same gap caused real outages for umami, home-assistant, and
  # prometheus-server the same day (see documentation/gotcha.md).
  podDisruptionBudget:
    minAvailable: 1
  resources:
    # Keep memory at 512Mi: TeslaMate dashboard usage pushed Grafana against the 128Mi limit and caused OOMKills.
    requests:
      cpu: 50m
      memory: 512Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 128Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: teslamate
                app.kubernetes.io/name: grafana
            topologyKey: kubernetes.io/hostname
  annotations:
    reloader.stakater.com/auto: "true"
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 10
  image:
    registry: ghcr.io
    repository: teslamate-org/teslamate/grafana
    # 2026-08-13: the previous main@afb325ae digest was garbage-collected
    # upstream -- same recurring failure mode as the main teslamate image
    # (see the deployment.image comment above). Bumped to the current main
    # digest again.
    tag: main@sha256:fe24cb24d8543cb9742cbcb662aeb00ac10aeeab9a53d4c8af5cf329d20cef0b
  database:
    secretName: *databaseAppSecretName
  envValueFrom:
    DATABASE_HOST:
      secretKeyRef:
        name: *databaseAppSecretName
        key: host
    DATABASE_NAME:
      secretKeyRef:
        name: *databaseAppSecretName
        key: dbname
    DATABASE_USER:
      secretKeyRef:
        name: *databaseAppSecretName
        key: username
    DATABASE_PASS:
      secretKeyRef:
        name: *databaseAppSecretName
        key: password
  admin:
    existingSecret: teslamate-grafana

backup:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
      ephemeral-storage: 2Gi
    limits:
      memory: 256Mi
      ephemeral-storage: 2Gi
  schedule: "0 10 * * *"
  verify:
    schedule: "0 12 * * *"
    verificationQuery: "SELECT count(*) FROM positions;"
  verifyPitr:
    schedule: "0 14 * * *"
    activeDeadlineSeconds: 28800 # 8 hours
    timeoutSeconds: 21600 # 6 hours
    verificationQuery: "SELECT count(*) FROM positions;"
    restore:
      storage:
        size: 5Gi
        storageClass: longhorn-crypto-global
  ttlSecondsAfterFinished: 600 # 10 minutes
  backoffLimit: 4
  concurrencyPolicy: Forbid
  database:
    imageName: ghcr.io/cloudnative-pg/postgresql:17.4
    secretName: *databaseAppSecretName
    postgresVersion: "17"

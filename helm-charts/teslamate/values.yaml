name: teslamate
namespace: teslamate

# VPA 2026-07-30: onboarded the main teslamate app after a steady-state
# usage check (7d avg/max ~223/230Mi against a 320Mi request, ratio ~1.03,
# no incident history). Deliberately excludes teslamate-grafana, which has
# a documented OOMKill history (128Mi -> 512Mi) and stays on manual KRR.
vpa:
  enabled: true

database:
  host: teslamate-20260412-0619-rw.teslamate
  name: app
  port: "5432"
  appSecretName: &databaseAppSecretName teslamate-20260412-0619-app

deployment:
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: teslamate
            topologyKey: kubernetes.io/hostname
  image:
    # Pull from GHCR, not Docker Hub: temporary hotfix for Tesla Owner API
    # 403 after v4.0.0 (teslamate-org/teslamate#5399). Stay on `main` until
    # 4.3.0, then switch to its Docker Hub release tag. GHCR publishes only
    # the floating `main` tag, so the pin tracks a `main` digest; Renovate
    # refreshes it without the release-age delay (see renovate.json5).
    # Recurring failure mode: upstream rebuilds `main` and garbage-collects
    # the old digest, so the pinned digest becomes NotFound at ghcr.io and
    # new pods hit ImagePullBackOff on restart (old pod keeps serving, no
    # outage, but the Application goes Degraded). Digest bumps: 2026-08-05,
    # 2026-08-12, 2026-08-21, 2026-09-03, 2026-09-06, 2026-09-10, 2026-09-19
    # (9th; digest 0d32891a gone).
    repository: ghcr.io/teslamate-org/teslamate
    # Multi-arch main digest (linux/amd64 + arm64).
    tag: main@sha256:8c38fcef5e5748247b9f08c34db23127cd24e14583c11f07b39c81e46e3abd1f
  envFrom:
    - secretRef:
        name: teslamate
  env:
    - name: DISABLE_MQTT
      value: "true"
    - name: TZ
      value: Europe/London
    - name: LOCALE
      value: en
    - name: DATABASE_HOST
      value: &databaseHost teslamate-20260412-0619-rw.teslamate
    - name: DATABASE_NAME
      value: &databaseName app
    - name: DATABASE_PORT
      value: &databasePort "5432"
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: *databaseAppSecretName
          key: username
    - name: DATABASE_PASS
      valueFrom:
        secretKeyRef:
          name: *databaseAppSecretName
          key: password

service:
  containerPort: 4000
  port: 4000

grafana:
  testFramework:
    # Helm test hooks are not run under Argo CD and leave orphaned resources that degrade app health.
    enabled: false
  # 2026-07-25: no PDB existed, found during a repo-wide audit after the
  # same gap caused real outages for umami, home-assistant, and
  # prometheus-server the same day (see documentation/gotcha.md).
  podDisruptionBudget:
    minAvailable: 1
  resources:
    # 128Mi -> 512Mi: dashboard use pushed Grafana against the 128Mi limit and caused OOMKills.
    # Deliberate exception to the repo's request=limit convention for a spiky workload (same as blocky).
    # 2026-09-19: OOMKilled (exit 137) at the 512Mi limit -- slow dashboard queries (~28s) on trips search.
    # 14d steady state: p50 ~220-340Mi, p99 ~260-390Mi; rare bursts to 456Mi and 512Mi (the kill). The 512Mi peak
    # was capped by the old limit, so the real burst is unknown. Request 512Mi -> 384Mi (~steady-state p99);
    # limit 512Mi -> 2Gi. An unused limit reserves nothing. Watch the node: raspberrypi-00 had ~1.5Gi available
    # at its worst in 7d, so a full 2Gi burst would squeeze it.
    # 2026-09-23: retro sizing from 30d usage; request 384Mi -> 483Mi.
    # KRR 2026-09-24: CPU WARNING -- 14d peak needs ~105m against the 50m request; bump cpu 50m -> 150m.
    # Memory untouched (the 512Mi OOM guardrail above still rules that axis).
    requests:
      cpu: 150m
      memory: 483Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 2Gi
      ephemeral-storage: 128Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: teslamate
                app.kubernetes.io/name: grafana
            topologyKey: kubernetes.io/hostname
  annotations:
    reloader.stakater.com/auto: "true"
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 10
  image:
    registry: ghcr.io
    repository: teslamate-org/teslamate/grafana
    # Same recurring garbage-collection failure mode as the main teslamate
    # image (see deployment.image comment). Digest bumps: 2026-08-13,
    # 2026-09-06 (digest fe24cb24 gone).
    tag: main@sha256:3c0a2b1d74fbb0e26b56f3b5653baa2404406a093a46c67f622ab436a792b129
  database:
    secretName: *databaseAppSecretName
  envValueFrom:
    DATABASE_HOST:
      secretKeyRef:
        name: *databaseAppSecretName
        key: host
    DATABASE_NAME:
      secretKeyRef:
        name: *databaseAppSecretName
        key: dbname
    DATABASE_USER:
      secretKeyRef:
        name: *databaseAppSecretName
        key: username
    DATABASE_PASS:
      secretKeyRef:
        name: *databaseAppSecretName
        key: password
  admin:
    existingSecret: teslamate-grafana

backup:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
      ephemeral-storage: 2Gi
    limits:
      memory: 256Mi
      ephemeral-storage: 2Gi
  schedule: "0 10 * * *"
  verify:
    schedule: "0 12 * * *"
    verificationQuery: "SELECT count(*) FROM positions;"
  verifyPitr:
    schedule: "0 14 * * *"
    activeDeadlineSeconds: 28800 # 8 hours
    timeoutSeconds: 21600 # 6 hours
    verificationQuery: "SELECT count(*) FROM positions;"
    restore:
      storage:
        size: 5Gi
        storageClass: longhorn-crypto-global
  ttlSecondsAfterFinished: 600 # 10 minutes
  backoffLimit: 4
  concurrencyPolicy: Forbid
  database:
    imageName: ghcr.io/cloudnative-pg/postgresql:17.4
    secretName: *databaseAppSecretName
    postgresVersion: "17"

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  # 2026-07-24: no PDB, so the descheduler could evict the sole replica for
  # HighNodeUtilization -- found auditing all single-replica app charts after
  # the same gap caused outages for umami (#2917) and home-assistant (#2918).
  # Matches the single-replica PDB pattern those charts already use.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}

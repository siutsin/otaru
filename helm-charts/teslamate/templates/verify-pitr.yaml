apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}-verify-pitr
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.name }}-verify-pitr
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - persistentvolumeclaims
      - secrets
    verbs:
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.name }}-verify-pitr
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.name }}-verify-pitr
subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-verify-pitr
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-verify-pitr
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.backup.verifyPitr.schedule | quote }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.backup.ttlSecondsAfterFinished }}
      backoffLimit: {{ .Values.backup.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.backup.verifyPitr.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: teslamate-verify-pitr
        spec:
          serviceAccountName: {{ .Values.name }}-verify-pitr
          containers:
            - name: verify-pitr
              image: alpine/kubectl:1.37.1@sha256:b568e8beb6a79aee269c142343078a278b85e7710f1c0e7d8d6b21d1eb566a48
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e -o pipefail

                  apk add --no-cache aws-cli curl

                  VERIFY_CLUSTER="${VERIFY_JOB_NAME:-{{ .Values.name }}-verify-pitr-$(date +%s)}"
                  VERIFY_NAMESPACE="{{ .Values.namespace }}"
                  VERIFY_SOURCE_CLUSTER="{{ trimSuffix "-app" .Values.backup.database.secretName }}"
                  VERIFY_DATABASE="{{ .Values.database.name }}"
                  VERIFY_OWNER="{{ .Values.database.name }}"
                  VERIFY_TIMEOUT_SECONDS={{ .Values.backup.verifyPitr.timeoutSeconds }}
                  VERIFY_QUERY='{{ .Values.backup.verifyPitr.verificationQuery }}'

                  cleanup() {
                    echo "Cleaning up ${VERIFY_CLUSTER}..."
                    kubectl delete cluster "${VERIFY_CLUSTER}" -n "${VERIFY_NAMESPACE}" --ignore-not-found=true --wait=false || true

                    for _ in $(seq 1 60); do
                      if ! kubectl get cluster "${VERIFY_CLUSTER}" -n "${VERIFY_NAMESPACE}" >/dev/null 2>&1; then
                        break
                      fi
                      sleep 5
                    done

                    kubectl delete pvc -n "${VERIFY_NAMESPACE}" -l cnpg.io/cluster="${VERIFY_CLUSTER}" --ignore-not-found=true || true
                    kubectl delete secret -n "${VERIFY_NAMESPACE}" -l cnpg.io/cluster="${VERIFY_CLUSTER}" --ignore-not-found=true || true
                    kubectl delete secret -n "${VERIFY_NAMESPACE}" \
                      "${VERIFY_CLUSTER}-app" \
                      "${VERIFY_CLUSTER}-ca" \
                      "${VERIFY_CLUSTER}-replication" \
                      "${VERIFY_CLUSTER}-server" \
                      --ignore-not-found=true || true
                  }

                  trap cleanup EXIT INT TERM
                  cleanup

                  VERIFY_SOURCE_PRIMARY=$(kubectl get cluster "${VERIFY_SOURCE_CLUSTER}" -n "${VERIFY_NAMESPACE}" -o jsonpath='{.status.currentPrimary}')
                  VERIFY_CLUSTER_TIMELINE=$(kubectl get cluster "${VERIFY_SOURCE_CLUSTER}" -n "${VERIFY_NAMESPACE}" -o jsonpath='{.status.timelineID}')
                  VERIFY_BACKUP_JSONPATH='{range .items[*]}{.spec.cluster.name}{"|"}'
                  VERIFY_BACKUP_JSONPATH="${VERIFY_BACKUP_JSONPATH}{.status.stoppedAt}{\"|\"}"
                  VERIFY_BACKUP_JSONPATH="${VERIFY_BACKUP_JSONPATH}{.status.backupId}{\"|\"}{.status.phase}{\"|\"}"
                  VERIFY_BACKUP_JSONPATH="${VERIFY_BACKUP_JSONPATH}{.status.pluginMetadata.timeline}{\"\\n\"}{end}"
                  VERIFY_BACKUP_META=$(
                    kubectl get backups.postgresql.cnpg.io \
                      -n "${VERIFY_NAMESPACE}" \
                      -o "jsonpath=${VERIFY_BACKUP_JSONPATH}" |
                      awk -F'|' -v cluster="${VERIFY_SOURCE_CLUSTER}" '$1 == cluster && $4 == "completed" { print $2 "|" $3 "|" $5 }' |
                      sort |
                      tail -n1
                  )
                  VERIFY_BACKUP_STOPPED_AT=$(echo "${VERIFY_BACKUP_META}" | cut -d'|' -f1)
                  VERIFY_BACKUP_ID=$(echo "${VERIFY_BACKUP_META}" | cut -d'|' -f2)
                  VERIFY_BACKUP_TIMELINE=$(echo "${VERIFY_BACKUP_META}" | cut -d'|' -f4)
                  if [ -z "${VERIFY_SOURCE_PRIMARY}" ] || [ -z "${VERIFY_BACKUP_ID}" ] || [ -z "${VERIFY_BACKUP_STOPPED_AT}" ]; then
                    echo "Error: failed to derive PITR inputs."
                    echo "VERIFY_SOURCE_PRIMARY=${VERIFY_SOURCE_PRIMARY}"
                    echo "VERIFY_BACKUP_ID=${VERIFY_BACKUP_ID}"
                    echo "VERIFY_BACKUP_STOPPED_AT=${VERIFY_BACKUP_STOPPED_AT}"
                    exit 1
                  fi

                  VERIFY_ARCHIVER_STATS=$(kubectl exec -i -n "${VERIFY_NAMESPACE}" "${VERIFY_SOURCE_PRIMARY}" -- \
                    psql -d postgres -Atq -c "SELECT failed_count, COALESCE(last_failed_wal, ''), COALESCE(last_archived_time::text, '') FROM pg_stat_archiver")
                  VERIFY_ARCHIVER_FAILED_COUNT=$(echo "${VERIFY_ARCHIVER_STATS}" | cut -d'|' -f1)
                  VERIFY_ARCHIVER_LAST_FAILED_WAL=$(echo "${VERIFY_ARCHIVER_STATS}" | cut -d'|' -f2)
                  VERIFY_ARCHIVER_LAST_ARCHIVED_TIME=$(echo "${VERIFY_ARCHIVER_STATS}" | cut -d'|' -f3)
                  if [ -n "${VERIFY_BACKUP_TIMELINE}" ] && [ -n "${VERIFY_CLUSTER_TIMELINE}" ] && [ "${VERIFY_BACKUP_TIMELINE}" != "${VERIFY_CLUSTER_TIMELINE}" ]; then
                    if [ "${VERIFY_ARCHIVER_FAILED_COUNT}" != "0" ] && echo "${VERIFY_ARCHIVER_LAST_FAILED_WAL}" | grep -q '\.history$'; then
                      echo "Error: WAL archiver has a failed timeline history upload (${VERIFY_ARCHIVER_LAST_FAILED_WAL})."
                      echo "PITR across timeline promotions is unsafe until archiving is healthy."
                      exit 1
                    fi
                  fi

                  # Recover to a WAL LSN, not a wall-clock time. TeslaMate's
                  # source DB is often idle (nothing logged while the car is
                  # away), and recovery_target_time matches transaction commit
                  # timestamps -- with no commits after the base backup a time
                  # target is never reached and Postgres aborts ("recovery
                  # ended before configured recovery target was reached"). An
                  # LSN always advances: the logical message below writes a
                  # real WAL record past the backup and returns its LSN.
                  VERIFY_TARGET_LSN=$(kubectl exec -i -n "${VERIFY_NAMESPACE}" "${VERIFY_SOURCE_PRIMARY}" -- \
                    psql -d postgres -Atq -c "SELECT pg_logical_emit_message(false, 'teslamate_verify_pitr', 'recovery target marker')")
                  VERIFY_TARGET_WAL=$(kubectl exec -i -n "${VERIFY_NAMESPACE}" "${VERIFY_SOURCE_PRIMARY}" -- \
                    psql -d postgres -Atq -c "SELECT pg_walfile_name('${VERIFY_TARGET_LSN}'::pg_lsn)")
                  if [ -z "${VERIFY_TARGET_LSN}" ] || [ -z "${VERIFY_TARGET_WAL}" ]; then
                    echo "Error: failed to emit or locate the recovery target LSN."
                    exit 1
                  fi

                  echo "Forcing WAL switch so target LSN ${VERIFY_TARGET_LSN} is archived in ${VERIFY_TARGET_WAL}"
                  kubectl exec -i -n "${VERIFY_NAMESPACE}" "${VERIFY_SOURCE_PRIMARY}" -- \
                    psql -d postgres -Atq -c "SELECT pg_switch_wal()" >/dev/null

                  VERIFY_WAL_ARCHIVE_DEADLINE=$(( $(date +%s) + 300 ))
                  while true; do
                    VERIFY_LAST_ARCHIVED_WAL=$(kubectl exec -i -n "${VERIFY_NAMESPACE}" "${VERIFY_SOURCE_PRIMARY}" -- \
                      psql -d postgres -Atq -c "SELECT COALESCE(last_archived_wal, '') FROM pg_stat_archiver")

                    if [ "${VERIFY_LAST_ARCHIVED_WAL}" \> "${VERIFY_TARGET_WAL}" ] || [ "${VERIFY_LAST_ARCHIVED_WAL}" = "${VERIFY_TARGET_WAL}" ]; then
                      echo "Archived WAL ${VERIFY_LAST_ARCHIVED_WAL}; target WAL ${VERIFY_TARGET_WAL} is available."
                      break
                    fi

                    if [ "$(date +%s)" -ge "${VERIFY_WAL_ARCHIVE_DEADLINE}" ]; then
                      echo "Error: timed out waiting for WAL ${VERIFY_TARGET_WAL} to be archived."
                      echo "Last archived WAL: ${VERIFY_LAST_ARCHIVED_WAL:-<none>}"
                      exit 1
                    fi

                    sleep 5
                  done

                  echo "Using source primary ${VERIFY_SOURCE_PRIMARY}"
                  echo "Using backupID ${VERIFY_BACKUP_ID} (timeline ${VERIFY_BACKUP_TIMELINE:-unknown}, stoppedAt ${VERIFY_BACKUP_STOPPED_AT})"
                  echo "Using cluster timeline ${VERIFY_CLUSTER_TIMELINE:-unknown}"
                  echo "Using targetLSN ${VERIFY_TARGET_LSN}"

                  cat <<EOF | kubectl apply -f -
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: ${VERIFY_CLUSTER}
                    namespace: ${VERIFY_NAMESPACE}
                    labels:
                      app.kubernetes.io/managed-by: teslamate-verify-pitr
                  spec:
                    instances: 1
                    imageName: {{ .Values.backup.database.imageName }}
                    inheritedMetadata:
                      # 2026-10-04: CNPG inherits this onto every generated Service.
                      # Each verify run creates unique -r/-ro/-rw Service names, so no
                      # static AuthorizationPolicy can target them. The annotation opts
                      # them out of require-mesh-authorization-policy as non-ambient
                      # endpoints (the job is a per-run test of backup recovery).
                      annotations:
                        mesh.otaru.io/non-ambient-endpoints: "true"
                      labels:
                        # 2026-07-07: CNPG operator scrapes instance status over direct
                        # pod HTTPS. Without this label the ephemeral recovery pod sits
                        # on the ambient Istio dataplane and the operator cannot reach
                        # it, leaving the cluster stuck in "Instance Status Extraction
                        # Error". Production clusters get this label via
                        # cloudnative-pg-clusters' inheritedMetadata default.
                        istio.io/dataplane-mode: none
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                        ephemeral-storage: 512Mi
                      limits:
                        memory: 512Mi
                        ephemeral-storage: 512Mi
                    storage:
                      size: {{ .Values.backup.verifyPitr.restore.storage.size }}
                      storageClass: {{ .Values.backup.verifyPitr.restore.storage.storageClass }}
                    plugins:
                      - enabled: true
                        isWALArchiver: false
                        name: barman-cloud.cloudnative-pg.io
                        parameters:
                          barmanObjectName: b2-backup
                    postgresql:
                      parameters:
                        archive_mode: "off"
                        dynamic_shared_memory_type: posix
                        full_page_writes: "on"
                        wal_keep_size: 512MB
                        wal_level: logical
                        wal_log_hints: "on"
                        wal_receiver_timeout: 5s
                        wal_sender_timeout: 5s
                      pg_hba:
                        - hostssl all all 0.0.0.0/0 scram-sha-256
                        - hostssl all all ::0/0 scram-sha-256
                    bootstrap:
                      recovery:
                        source: verify-pitr-source
                        database: ${VERIFY_DATABASE}
                        owner: ${VERIFY_OWNER}
                        recoveryTarget:
                          backupID: "${VERIFY_BACKUP_ID}"
                          targetLSN: "${VERIFY_TARGET_LSN}"
                    externalClusters:
                      - name: verify-pitr-source
                        plugin:
                          enabled: true
                          isWALArchiver: false
                          name: barman-cloud.cloudnative-pg.io
                          parameters:
                            barmanObjectName: b2-backup
                            serverName: {{ .Values.backup.database.serverName }}
                  EOF

                  START_TIME=$(date +%s)
                  VERIFY_RECOVERY_JOB="${VERIFY_CLUSTER}-1-full-recovery"
                  while true; do
                    PHASE=$(kubectl get cluster "${VERIFY_CLUSTER}" -n "${VERIFY_NAMESPACE}" -o jsonpath='{.status.phase}' 2>/dev/null || true)
                    READY=$(kubectl get cluster "${VERIFY_CLUSTER}" -n "${VERIFY_NAMESPACE}" -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)
                    PRIMARY=$(kubectl get cluster "${VERIFY_CLUSTER}" -n "${VERIFY_NAMESPACE}" -o jsonpath='{.status.currentPrimary}' 2>/dev/null || true)

                    if [ "${PHASE}" = "Cluster in healthy state" ] && [ "${READY}" = "1" ] && [ -n "${PRIMARY}" ]; then
                      echo "PITR restore cluster ${VERIFY_CLUSTER} is ready."
                      break
                    fi

                    if kubectl get job "${VERIFY_RECOVERY_JOB}" -n "${VERIFY_NAMESPACE}" >/dev/null 2>&1; then
                      VERIFY_RECOVERY_FAILED=$(kubectl get job "${VERIFY_RECOVERY_JOB}" -n "${VERIFY_NAMESPACE}" -o jsonpath='{.status.failed}' 2>/dev/null || true)
                      VERIFY_RECOVERY_ACTIVE=$(kubectl get job "${VERIFY_RECOVERY_JOB}" -n "${VERIFY_NAMESPACE}" -o jsonpath='{.status.active}' 2>/dev/null || true)
                      if [ -n "${VERIFY_RECOVERY_FAILED}" ] && [ "${VERIFY_RECOVERY_FAILED}" != "0" ] && [ -z "${VERIFY_RECOVERY_ACTIVE}" ]; then
                        echo "Error: CNPG full-recovery job ${VERIFY_RECOVERY_JOB} failed."
                        kubectl get pods -n "${VERIFY_NAMESPACE}" -l cnpg.io/cluster="${VERIFY_CLUSTER}" -o wide || true
                        kubectl logs -n "${VERIFY_NAMESPACE}" -l cnpg.io/cluster="${VERIFY_CLUSTER}" --tail=40 || true
                        exit 1
                      fi
                    fi

                    if [ $(( $(date +%s) - START_TIME )) -ge "${VERIFY_TIMEOUT_SECONDS}" ]; then
                      echo "Error: Timed out waiting for PITR restore cluster ${VERIFY_CLUSTER}."
                      kubectl get cluster "${VERIFY_CLUSTER}" -n "${VERIFY_NAMESPACE}" -o yaml || true
                      kubectl get pods -n "${VERIFY_NAMESPACE}" -l cnpg.io/cluster="${VERIFY_CLUSTER}" -o wide || true
                      exit 1
                    fi

                    sleep 10
                  done

                  PRIMARY=$(kubectl get cluster "${VERIFY_CLUSTER}" -n "${VERIFY_NAMESPACE}" -o jsonpath='{.status.currentPrimary}')

                  echo "Verifying PITR with query: ${VERIFY_QUERY}"
                  VERIFY_COUNT=$(kubectl exec -n "${VERIFY_NAMESPACE}" "${PRIMARY}" -- psql -d "${VERIFY_DATABASE}" -tAc "${VERIFY_QUERY}")
                  # 2026-10-24: fail when the count is not a positive number; it means the newest backups hold an emptied database.
                  case "${VERIFY_COUNT}" in
                    ''|*[!0-9]*|0)
                      echo "Error: PITR restore has no content (count '${VERIFY_COUNT}')."
                      exit 1
                      ;;
                  esac
                  echo "PITR verification successful!"

                  # 2026-10-24: pin the verified backup set under cnpg-floor/, outside
                  # the 30-day CNPG retention. A set is the base backup plus the WAL
                  # span from backup.info; backup.info is copied last as the
                  # completeness marker, so a failed pin is retried by the next run.
                  FLOOR_BUCKET="{{ .Values.backup.floor.bucket }}"
                  FLOOR_EP="--endpoint-url https://{{ .Values.backup.floor.endpoint }}"
                  FLOOR_SERVER="{{ .Values.backup.database.serverName }}"
                  FLOOR_SET="${FLOOR_SERVER}-${VERIFY_BACKUP_ID}"
                  FLOOR_SRC="s3://${FLOOR_BUCKET}/cnpg-backups/${FLOOR_SERVER}"
                  FLOOR_DST="s3://${FLOOR_BUCKET}/cnpg-floor/${FLOOR_SET}"
                  if [ -n "$(aws ${FLOOR_EP} s3 ls "${FLOOR_DST}/base/${VERIFY_BACKUP_ID}/backup.info" 2>/dev/null)" ]; then
                    echo "Floor: ${FLOOR_SET} is already pinned."
                  else
                    BACKUP_INFO=$(aws ${FLOOR_EP} s3 cp "${FLOOR_SRC}/base/${VERIFY_BACKUP_ID}/backup.info" -)
                    BEGIN_WAL=$(echo "${BACKUP_INFO}" | sed -n 's/^begin_wal=//p')
                    END_WAL=$(echo "${BACKUP_INFO}" | sed -n 's/^end_wal=//p')
                    TIMELINE=$(echo "${BACKUP_INFO}" | sed -n 's/^timeline=//p')
                    if [ -z "${BEGIN_WAL}" ] || [ -z "${END_WAL}" ] || [ -z "${TIMELINE}" ]; then
                      echo "Error: backup.info for ${VERIFY_BACKUP_ID} lacks begin_wal, end_wal or timeline; refusing to pin."
                      exit 1
                    fi
                    aws ${FLOOR_EP} s3 sync --exclude "backup.info" "${FLOOR_SRC}/base/${VERIFY_BACKUP_ID}/" "${FLOOR_DST}/base/${VERIFY_BACKUP_ID}/"
                    BEGIN_DIR=$(echo "${BEGIN_WAL}" | cut -c1-16)
                    END_DIR=$(echo "${END_WAL}" | cut -c1-16)
                    COPIED_BEGIN=""
                    COPIED_END=""
                    WAL_DIRS=$(aws ${FLOOR_EP} s3 ls "${FLOOR_SRC}/wals/" | awk '{print $2}' | tr -d /)
                    for WAL_DIR in ${WAL_DIRS}; do
                      case "${WAL_DIR}" in
                        ''|*[!0-9A-F]*) continue ;;
                      esac
                      if [ "${WAL_DIR}" \< "${BEGIN_DIR}" ] || [ "${WAL_DIR}" \> "${END_DIR}" ]; then
                        continue
                      fi
                      WAL_FILES=$(aws ${FLOOR_EP} s3 ls "${FLOOR_SRC}/wals/${WAL_DIR}/" | awk '{print $4}')
                      for WAL_FILE in ${WAL_FILES}; do
                        case "${WAL_FILE}" in
                          ''|*.backup) continue ;;
                        esac
                        if [ "${WAL_FILE}" \< "${BEGIN_WAL}" ] || [ "${WAL_FILE}" \> "${END_WAL}" ]; then
                          continue
                        fi
                        aws ${FLOOR_EP} s3 cp "${FLOOR_SRC}/wals/${WAL_DIR}/${WAL_FILE}" "${FLOOR_DST}/wals/${WAL_DIR}/${WAL_FILE}"
                        if [ "${WAL_FILE}" = "${BEGIN_WAL}" ]; then
                          COPIED_BEGIN=1
                        fi
                        if [ "${WAL_FILE}" = "${END_WAL}" ]; then
                          COPIED_END=1
                        fi
                      done
                    done
                    if [ -z "${COPIED_BEGIN}" ] || [ -z "${COPIED_END}" ]; then
                      echo "Error: WAL span ${BEGIN_WAL} to ${END_WAL} did not copy in full; refusing to pin."
                      exit 1
                    fi
                    if [ "${TIMELINE}" -gt 1 ]; then
                      HISTORY_FILE=$(printf '%08d.history' "${TIMELINE}")
                      aws ${FLOOR_EP} s3 cp "${FLOOR_SRC}/wals/${HISTORY_FILE}" "${FLOOR_DST}/wals/${HISTORY_FILE}"
                    fi
                    aws ${FLOOR_EP} s3 cp "${FLOOR_SRC}/base/${VERIFY_BACKUP_ID}/backup.info" "${FLOOR_DST}/base/${VERIFY_BACKUP_ID}/backup.info"
                    echo "Floor: pinned ${FLOOR_SET} (WAL ${BEGIN_WAL} to ${END_WAL})."
                  fi
                  FLOOR_LS=$(aws ${FLOOR_EP} s3 ls "s3://${FLOOR_BUCKET}/cnpg-floor/")
                  FLOOR_SETS=""
                  for FLOOR_SET_NAME in $(echo "${FLOOR_LS}" | awk '{print $2}' | grep "^${FLOOR_SERVER}-" || true); do
                    FLOOR_SET_NAME="${FLOOR_SET_NAME%/}"
                    SET_BACKUP_ID="${FLOOR_SET_NAME#${FLOOR_SERVER}-}"
                    if [ -n "$(aws ${FLOOR_EP} s3 ls "s3://${FLOOR_BUCKET}/cnpg-floor/${FLOOR_SET_NAME}/base/${SET_BACKUP_ID}/backup.info" 2>/dev/null)" ]; then
                      FLOOR_SETS="${FLOOR_SETS} ${FLOOR_SET_NAME}"
                    else
                      echo "Floor: deleting incomplete set ${FLOOR_SET_NAME} (no backup.info marker)."
                      aws ${FLOOR_EP} s3 rm "s3://${FLOOR_BUCKET}/cnpg-floor/${FLOOR_SET_NAME}" --recursive
                    fi
                  done
                  FLOOR_TOTAL=$(echo "${FLOOR_SETS}" | wc -w)
                  if [ "${FLOOR_TOTAL}" -gt {{ .Values.backup.floor.keepLast }} ]; then
                    FLOOR_DELETE=$((FLOOR_TOTAL - {{ .Values.backup.floor.keepLast }}))
                    FLOOR_PRUNED=0
                    for OLD_SET in $(echo "${FLOOR_SETS}" | tr ' ' '\n' | sort); do
                      if [ "${FLOOR_PRUNED}" -ge "${FLOOR_DELETE}" ]; then
                        break
                      fi
                      echo "Floor: pruning old set ${OLD_SET}"
                      aws ${FLOOR_EP} s3 rm "s3://${FLOOR_BUCKET}/cnpg-floor/${OLD_SET}" --recursive
                      FLOOR_PRUNED=$((FLOOR_PRUNED + 1))
                    done
                  fi

                  if [ -n "${VERIFY_PITR_HEARTBEAT:-}" ]; then
                    echo "Sending heartbeat to ${VERIFY_PITR_HEARTBEAT}..."
                    RESPONSE=$(curl -m 10 --retry 5 -sS "${VERIFY_PITR_HEARTBEAT}")
                    echo "Response body: ${RESPONSE}"
                  fi
              envFrom:
                - secretRef:
                    name: {{ .Values.name }}-heartbeat
                - secretRef:
                    name: b2-backup-credentials
              env:
                - name: VERIFY_JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              # KRR 2026-08-26: 14d peak ~208m CPU against a 50m request (~4x
              # under). This container polls the CNPG cluster/psql in a tight
              # loop during restore, so real usage is above the original
              # guess.
              # 2026-10-24: memory 128Mi -> 256Mi for the Python aws-cli.
              # Ephemeral storage 128Mi -> 512Mi: its apk install exceeds
              # 128Mi, and kubelet killed the first live runs with exit 137.
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                  ephemeral-storage: 512Mi
                limits:
                  memory: 256Mi
                  ephemeral-storage: 512Mi
          restartPolicy: OnFailure

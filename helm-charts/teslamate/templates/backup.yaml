apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.backup.ttlSecondsAfterFinished }}
      backoffLimit: {{ .Values.backup.backoffLimit }}
      template:
        spec:
          containers:
            - name: {{ .Values.name }}-backup
              image: postgres:{{ .Values.backup.database.postgresVersion }}-alpine
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e -o pipefail

                  apk add -q --no-cache aws-cli curl

                  # 2026-10-24: refuse to dump an emptied DB; an empty dump rotates out the last good dumps.
                  CONTENT_COUNT=$(psql -tAc "SELECT count(*) FROM positions")
                  case "${CONTENT_COUNT}" in
                    ''|*[!0-9]*|0)
                      echo "Error: positions count is '${CONTENT_COUNT}'; refusing to dump."
                      exit 1
                      ;;
                  esac
                  echo "Positions count: ${CONTENT_COUNT}"

                  BACKUP_FILE_NAME="${PGDATABASE}-$(date +%F-%H_%M_%S).sql.gz"
                  S3_URI="s3://${BUCKET}/${S3_PATH}/${BACKUP_FILE_NAME}"

                  echo "Dumping cluster to ${BACKUP_FILE_NAME}..."
                  pg_dumpall --clean --if-exists | gzip > "/tmp/${BACKUP_FILE_NAME}"
                  DUMP_SIZE=$(wc -c < "/tmp/${BACKUP_FILE_NAME}")
                  echo "Dump file size: ${DUMP_SIZE} bytes"

                  echo "Uploading to ${S3_URI}..."
                  UPLOAD_START=$(date +%s)
                  aws --endpoint-url https://${ENDPOINT} s3 cp "/tmp/${BACKUP_FILE_NAME}" "${S3_URI}" --no-progress
                  UPLOAD_SECONDS=$(( $(date +%s) - UPLOAD_START ))
                  echo "Upload took ${UPLOAD_SECONDS}s."
                  echo "Upload successful."
                  echo "Summary: ${BACKUP_FILE_NAME}, positions ${CONTENT_COUNT}, size ${DUMP_SIZE} bytes, upload ${UPLOAD_SECONDS}s."

                  if [ -n "$BACKUP_HEARTBEAT" ]; then
                    echo "Sending heartbeat to $BACKUP_HEARTBEAT..."
                    RESPONSE=$(curl -m 10 --retry 5 -sS "$BACKUP_HEARTBEAT")
                    echo "Response body: $RESPONSE"
                  fi

                  rm "/tmp/${BACKUP_FILE_NAME}"
              envFrom:
                - secretRef:
                    name: {{ .Values.name }}-backup
                - secretRef:
                    name: {{ .Values.name }}-heartbeat
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.database.secretName }}
                      key: host
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.database.secretName }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.database.secretName }}
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.database.secretName }}
                      key: dbname
              resources: {{ toYaml .Values.backup.resources | nindent 16 }}
          restartPolicy: OnFailure

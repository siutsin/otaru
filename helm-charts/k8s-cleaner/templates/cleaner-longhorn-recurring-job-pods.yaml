{{- range .Values.longhornRecurringJobPods.jobs }}
apiVersion: apps.projectsveltos.io/v1alpha1
kind: Cleaner
metadata:
  name: longhorn-{{ . }}-pods
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "*/5 * * * *"
  resourcePolicySet:
    resourceSelectors:
      - kind: Pod
        group: ""
        version: v1
        namespace: {{ $.Values.longhornRecurringJobPods.namespace }}
        labelFilters:
          - key: recurring-job.longhorn.io
            operation: Equal
            value: {{ . }}
        evaluate: |
          function convertTimestamp(ts)
            -- No trailing Z in the pattern: finishedAt can carry fractional seconds.
            local y, mon, d, h, mi, s = ts:match(
              "(%d+)-(%d+)-(%d+)T(%d+):(%d+):(%d+)"
            )
            if y == nil then
              return nil
            end
            return os.time({
              year = tonumber(y),
              month = tonumber(mon),
              day = tonumber(d),
              hour = tonumber(h),
              min = tonumber(mi),
              sec = tonumber(s),
            })
          end

          function evaluate()
            local result = {}
            result.matching = false

            if obj.status == nil then
              return result
            end

            if obj.status.phase == "Succeeded" then
              result.matching = true
            end

            if obj.status.phase == "Failed" then
              local finishedAt = obj.metadata.creationTimestamp
              if obj.status.containerStatuses ~= nil then
                for _, cs in ipairs(obj.status.containerStatuses) do
                  if cs.state ~= nil and cs.state.terminated ~= nil
                    and cs.state.terminated.finishedAt ~= nil then
                    finishedAt = cs.state.terminated.finishedAt
                  end
                end
              end
              if finishedAt ~= nil then
                local finished = convertTimestamp(finishedAt)
                if finished ~= nil then
                  local age = os.difftime(os.time(), finished)
                  if age > {{ $.Values.longhornRecurringJobPods.failedPodMaxAgeSeconds }} then
                    result.matching = true
                  end
                end
              end
            end

            return result
          end
  action: Delete
---
{{- end }}

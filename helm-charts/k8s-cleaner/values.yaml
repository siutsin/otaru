name: k8s-cleaner
namespace: k8s-cleaner

vpa:
  enabled: true

excludeNamespaces: &excludeNamespaces
  - envoy-gateway-system
  - gateway
  - istio-system
  - kube-system
  - longhorn-system
  - metallb-system

repave:
  maxAgeSeconds: 259200
  excludeNamespaces: *excludeNamespaces

failedPods:
  excludeNamespaces: *excludeNamespaces

longhornRecurringJobPods:
  namespace: longhorn-system
  # Failed pods are kept this long after they finish, so their logs survive
  # for investigation. Succeeded pods are still deleted at once.
  failedPodMaxAgeSeconds: 604800
  jobs:
    - backup
    - trim

kyvernoHookJobs:
  namespace: kyverno

k8s-cleaner:
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 64Mi
        ephemeral-storage: 64Mi
  affinity:

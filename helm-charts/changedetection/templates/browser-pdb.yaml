apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.browser.name }}
  namespace: {{ .Values.namespace }}
spec:
  # 2026-07-25: repo-wide PDB audit found the sidecar browser Deployment had
  # no PDB (main Deployment already had one in templates/pdb.yaml); a
  # missing-PDB eviction storm caused real outages for umami,
  # home-assistant, and prometheus-server the same day.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.browser.name }}

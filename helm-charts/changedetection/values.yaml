name: changedetection
namespace: changedetection

onepassword:
  key: changedetection
  property: config.yaml

deployment:
  env:
    ALLOW_IANA_RESTRICTED_ADDRESSES: "true"
    DISABLE_VERSION_CHECK: "true"
    FETCH_WORKERS: "1"
    HIDE_REFERER: "true"
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    MINIMUM_SECONDS_RECHECK_TIME: "60"
    PLAYWRIGHT_DRIVER_URL: "ws://changedetection-browser.changedetection.svc.cluster.local:3000?--user-data-dir=/profile/chromium&headful=true&\
      --user-agent=Mozilla/5.0%20%28Windows%20NT%2010.0%3B%20Win64%3B%20x64%29%20AppleWebKit/537.36%20%28KHTML%2C%20like%20Gecko%29%20Chrome/119.0.0.0%20Safari/537.36"
    TZ: Europe/London
    USE_X_SETTINGS: "true"
  image:
    repository: ghcr.io/dgtlmoon/changedetection.io
    # Pin to a specific version, not the mutable `latest` tag. An uncontrolled
    # `latest` bump can ship a datastore migration that resets watches on
    # restart. 0.55.7 resolves to the same digest `latest` currently points to,
    # so this pin is a no-op for the running pod. See documentation/gotcha.md.
    tag: 0.55.7@sha256:736331d2787f94d3201b64aa641e090f67e28577ba505bd7ba5d7c1841e1e0ca
    pullPolicy: IfNotPresent
  # Keep at 1Gi: browser-backed watches stitch screenshots in this app process;
  # 256Mi caused OOMKilled exit 137 while processing an Amazon watch.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
      ephemeral-storage: 100Mi
    limits:
      memory: 1Gi
      ephemeral-storage: 100Mi

browser:
  name: changedetection-browser
  image:
    repository: dgtlmoon/sockpuppetbrowser
    digest: sha256:7116c61ef9cfce3d48a7efd9355d2fbe19f593ea3cfb52a5ded40ecbcb0a3f9d
    pullPolicy: IfNotPresent
  port: 3000
  statsPort: 8080
  tmpSizeLimit: 1Gi
  profile:
    mountPath: /profile
    claimName: changedetection-browser-profile-pvc
    fsGroup: 1000
  cleanup:
    intervalSeconds: 3600
    minAgeMinutes: 60
    image:
      repository: busybox
      # 2026-07-14: the previous digest (sha256:8f2ffdcb...) was the
      # arm64-only child manifest, not the multi-arch index. It worked by
      # accident while the pod only landed on arm64 nodes, then hit "exec
      # format error" the first time descheduler's PodLifeTime repave put
      # it on amd64 nuc-00. This digest is the real multi-arch index
      # (verified via registry API and nuc-00's containerd image list).
      tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
      pullPolicy: IfNotPresent
    resources:
      # KRR 2026-07-05: profile cleanup sidecar peaked at ~100Mi during
      # hourly prune runs.
      # ephemeral-storage 2026-07-07: container_limit_percentage hit 100%
      # at 16Mi (shared /profile/chromium volume usage counted against
      # this container's limit); pod-level peak is only ~20Mi. Bumped to
      # 64Mi for headroom.
      requests:
        cpu: 10m
        memory: 128Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 128Mi
        ephemeral-storage: 64Mi
  env:
    SCREEN_WIDTH: "1920"
    SCREEN_HEIGHT: "1024"
    SCREEN_DEPTH: "16"
    MAX_CONCURRENT_CHROME_PROCESSES: "1"
  resources:
    # KRR 2026-07-05: Playwright browser peaked ~1.08Gi on Amazon watch
    # fetches; 1Gi left ~6Mi headroom.
    # KRR 2026-07-09: 14d peak grew to ~1.28Gi, over the 1152Mi limit;
    # bumped to 1408Mi for headroom.
    # KRR 2026-07-18: CPU CRITICAL, 14d peak ~1189m vs 50m request
    # (memory unaffected, still GOOD at 1408Mi).
    # 2026-07-18 hotfix: the full 1189m request left the pod Pending -- no
    # node had 1199m free CPU + 1536Mi free memory at once (concurrent CPU
    # upsizes in the same rollout). Reduced to 700m, fits raspberrypi-03
    # with ~155m spare; full KRR target deferred.
    # KRR 2026-07-30: completed the deferred upsize to 1189m; the pod runs
    # on raspberrypi-00 (~71% CPU requested), so the 489m bump fits without
    # touching memory.
    # 2026-07-30 (overcommit): exception to the repo's "memory request
    # equal to limit" convention. 7d working set across 5 pod instances:
    # steady-state 47-270Mi, recurring peaks 764-1365Mi on Amazon
    # watch/screenshot-stitching bursts. Request 350Mi, limit 1536Mi for
    # headroom above the 1365Mi peak. Frees ~1058Mi reserved-but-idle per
    # replica; the node was at 99% memory requested.
    requests:
      cpu: 1189m
      # 2026-09-23: sized from 30-day p50 / 0.9 policy (was 350Mi).
      memory: 303Mi
      ephemeral-storage: 1Gi
    limits:
      # LIM FLOOR 1536Mi: headroom above 1365Mi peak.
      memory: 1536Mi
      ephemeral-storage: 1Gi

service:
  port: 5000
  targetPort: 5000

route:
  timeouts:
    request: 120s
    backendRequest: 120s

persistence:
  claimName: changedetection-pvc
  mountPath: /datastore

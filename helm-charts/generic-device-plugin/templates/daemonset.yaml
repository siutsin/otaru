{{- $dirs := list -}}
{{- range .Values.devices }}{{ range .groups }}{{ range .paths }}
{{- $dirs = append $dirs (dir .path) -}}
{{- end }}{{ end }}{{ end }}
{{- $dirs = $dirs | uniq | sortAlpha -}}
{{- $version := regexReplaceAll "@sha256:.*$" .Values.image.tag "" -}}
# Registers node devices with the kubelet, so a pod can request them without privileges.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/version: {{ $version | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/version: {{ $version | quote }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: device-plugin
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args:
            - --domain
            - {{ .Values.domain }}
            {{- range .Values.devices }}
            - --device
            - |
              {{- toYaml . | nindent 14 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The kubelet device-plugins directory is root-owned.
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              # The 32Mi floor.
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              memory: 32Mi
              ephemeral-storage: 16Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            {{- range $i, $dir := $dirs }}
            - name: dev-{{ $i }}
              mountPath: {{ $dir }}
              readOnly: true
            {{- end }}
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
        {{- range $i, $dir := $dirs }}
        - name: dev-{{ $i }}
          hostPath:
            path: {{ $dir }}
        {{- end }}

name: generic-device-plugin
namespace: generic-device-plugin

image:
  # Estate rebuild of the same upstream commit: the upstream image carries
  # critical and high-severity flaws in its 2023 Go build, with no fixed
  # upstream image of this source.
  repository: ghcr.io/siutsin/images/generic-device-plugin
  tag: 2a30fdce45cd8abe4cf8d705b656824fd9dd3a0f@sha256:d5a8149d9e050ba132054b1c571e03759231944d3db57a8e1dd8cece2afeb5a8

nodeSelector:
  otaru.io/ai: "true"

# Resources are named <domain>/<device name>. Pods request them in resources.limits.
domain: devic.es

# Each device path must sit in a subdirectory, such as /dev/dri/renderD128. The chart mounts the
# parent directory read-only, so a path directly under /dev would mount all of /dev.
devices:
  - name: dri
    groups:
      - count: 1
        paths:
          - path: /dev/dri/renderD128

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-hub
  namespace: trivy-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-secret-store
  target:
    name: docker-hub
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        # Same Docker account as the node registry auth in
        # ansible/playbooks/k3s/003-registries.yaml. Scan jobs use it
        # via operator.privateRegistryScanSecretsNames in values.yaml.
        .dockerconfigjson: |
          {
            "auths": {
              "https://index.docker.io/v1/": {"auth": "{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"},
              "dhi.io": {"auth": "{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"}
            }
          }}
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        key: Docker
        metadataPolicy: None
        property: username
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        key: Docker
        metadataPolicy: None
        property: credential

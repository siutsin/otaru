# Trivy Operator wrapper, light mode for Pi nodes.
# Scanners on: vuln and config audit (upstream defaults). The rest stay
# off: no secrets, SBOM, RBAC, infra, or compliance jobs.
trivy-operator:
  operator:
    exposedSecretScannerEnabled: false
    sbomGenerationEnabled: false
    rbacAssessmentScannerEnabled: false
    infraAssessmentScannerEnabled: false
    clusterComplianceEnabled: false
    # Weekly reports, one scan at a time. Upstream is 24h and 10 concurrent.
    scannerReportTTL: "168h"
    scanJobsConcurrentLimit: 1
  trivy:
    # No outbound Maven calls from scans.
    offlineScan: true
    resources:
      # 2026-10-09: sane small default, no baseline. Resize after metrics.
      # Upstream chart maps camelCase ephemeralStorage to the scan-job
      # ConfigMap key (hyphen form here is silently dropped). The 500m
      # CPU limit is the vendored default and is left as is.
      requests:
        cpu: 100m
        memory: 500Mi
        ephemeralStorage: 2Gi
      limits:
        memory: 500Mi
        ephemeralStorage: 2Gi
  resources:
    # 2026-10-09: OOMKilled at 256Mi on first sync (exit 137). Raise to
    # 512Mi. Resize after metrics.
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 128Mi
  service:
    # Same annotated-scrape pattern as Falco. No ServiceMonitor CRD here.
    # Port names the container port: endpoints scrape hits pod IPs direct.
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"

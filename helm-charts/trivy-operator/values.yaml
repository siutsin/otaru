# Trivy Operator wrapper, light mode for Pi nodes.
# Scanners on: vuln and config audit (upstream defaults). The rest stay
# off: no secrets, SBOM, RBAC, infra, or compliance jobs.
trivy-operator:
  operator:
    exposedSecretScannerEnabled: false
    sbomGenerationEnabled: false
    rbacAssessmentScannerEnabled: false
    infraAssessmentScannerEnabled: false
    clusterComplianceEnabled: false
    # Daily reports, one scan at a time. Upstream runs 10 concurrent.
    scannerReportTTL: "24h"
    scanJobsConcurrentLimit: 1
    # 2026-10-18: standalone scan pods run one Trivy process per workload
    # container over one shared BoltDB cache; the lock timeouts fail scan
    # jobs (BackoffLimitExceeded). The built-in server ends the sharing:
    # scan jobs become its clients and share no cache.
    builtInTrivyServer: true
    # Scan jobs have no imagePullSecrets to inherit: node pulls use the
    # containerd registry config instead. Point the operator at the
    # dockerconfigjson secret from templates/external-secret.yaml,
    # keyed by the namespace the secret lives in.
    privateRegistryScanSecretsNames: { "trivy-operator": "docker-hub" }
  trivy:
    # No outbound Maven calls from scans.
    offlineScan: true
    resources:
      # 2026-10-09: sane small default, no baseline. Resize after metrics.
      # Upstream chart maps camelCase ephemeralStorage to the scan-job
      # ConfigMap key (hyphen form here is silently dropped). The 500m
      # CPU limit is the vendored default and is left as is.
      # 2026-10-18: one scan pod was evicted at the 2Gi limit and its job
      # hit BackoffLimitExceeded. Limit raised to 4Gi, request stays 2Gi.
      requests:
        cpu: 100m
        memory: 500Mi
        ephemeralStorage: 2Gi
      limits:
        memory: 500Mi
        ephemeralStorage: 4Gi
    server:
      # 2026-10-18: new workload, starts at the upstream sizes with
      # ephemeral-storage added because Kyverno require-workload-resources
      # demands it. The database and cache live on the PVC, so ephemeral
      # storage covers temp files only. Resize after metrics. The wrapper
      # sets only these five fields; the subchart default's cpu limit is
      # removed by a null override in the trivy-operator Application values.
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
          ephemeral-storage: 512Mi
        limits:
          memory: 1Gi
          ephemeral-storage: 1Gi
      # 2026-10-18: Kyverno require-container-hardening demands
      # allowPrivilegeEscalation: false and drop ALL; the upstream
      # defaults omit both. The block is set in full.
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  resources:
    # 2026-10-09: OOMKilled at 256Mi on first sync (exit 137). Raise to
    # 512Mi. Resize after metrics.
    # KRR 2026-10-11: 30d spike ~498.0Mi vs 512Mi limit (97.3% — OOM risk); limit -> 598Mi (ceil(spike*1.2)). Request stays 512Mi.
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 598Mi
      ephemeral-storage: 128Mi
  service:
    # Same annotated-scrape pattern as Falco. No ServiceMonitor CRD here.
    # Port names the container port: endpoints scrape hits pod IPs direct.
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"

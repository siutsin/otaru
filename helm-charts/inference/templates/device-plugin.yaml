# Registers the GPU render node with the kubelet, so a pod can request it without privileges.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.name }}-device-plugin
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-device-plugin
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        otaru.io/ai: "true"
      containers:
        - name: device-plugin
          image: {{ .Values.devicePlugin.image.repository }}:{{ .Values.devicePlugin.image.tag }}
          args:
            - --domain
            - devic.es
            - --device
            - |
              name: dri
              groups:
                - count: 1
                  paths:
                    - path: {{ .Values.devicePlugin.devicePath }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The kubelet device-plugins directory is root-owned.
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              # The 32Mi floor.
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              memory: 32Mi
              ephemeral-storage: 16Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: dri
              mountPath: /dev/dri
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dri
          hostPath:
            path: /dev/dri

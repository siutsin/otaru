{{- $version := regexReplaceAll "@sha256:.*$" .Values.deployment.image.tag "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/version: {{ $version | quote }}
spec:
  replicas: 1
  # RWO: a second pod cannot mount the claim.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/version: {{ $version | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.targetPort | quote }}
        prometheus.io/path: /metrics
        # Roll the pod when the script changes.
        checksum/slot-cache: {{ .Files.Get "files/slot-cache.sh" | sha256sum }}
    spec:
      # preStop waits up to 240s for a running periodic save, then saves two slots, each capped at 120s.
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      nodeSelector:
        otaru.io/ai: "true"
      initContainers:
        - name: init-slots
          image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
          # The server refuses to start if the slot save path is missing.
          command: ["mkdir", "-p", {{ .Values.slotCache.path | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              # mkdir only. 32Mi is the floor.
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              memory: 32Mi
              ephemeral-storage: 16Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
          env:
            {{- include "inference.serverEnv" . | nindent 12 }}
          # Slot save and restore files, used by the lifecycle hooks.
          args:
            - --slot-save-path
            - {{ .Values.slotCache.path | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # Restore the slot KV cache once the server is healthy, and save it before the pod stops.
          # kubelet starts no probes until postStart ends, so no request arrives before the restore.
          lifecycle:
            postStart:
              exec:
                command: ["sh", "/scripts/slot-cache.sh", "restore"]
            preStop:
              exec:
                command: ["sh", "/scripts/slot-cache.sh", "prestop"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # /health returns 503 until the model loads. Allow 3h for a large first download.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "2"
              # Weights and KV cache sit in GPU memory. The server process measured 0.4GiB RSS after load.
              # Load maps the 19.6GB model file once, and those clean pages are reclaimable.
              memory: 4Gi
              ephemeral-storage: 1Gi
            limits:
              # The earlier OOMKill guardrail (64Gi, 2026-10-09) came from CPU mode, with weights and KV cache in RAM.
              # They are on the GPU now. Trim after watching a full load.
              memory: 24Gi
              ephemeral-storage: 2Gi
              # One GPU, served by the device plugin below.
              devic.es/dri: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: slot-cache
              mountPath: /scripts
              readOnly: true
        # Saves the KV cache when a request finished and the slots are idle, so a crash loses little. A save blocks the server while it writes.
        - name: slot-saver
          image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
          command: ["sh", "/scripts/slot-cache.sh", "loop"]
          env:
            {{- include "inference.serverEnv" . | nindent 12 }}
            - name: SAVE_INTERVAL
              value: {{ .Values.slotCache.saveIntervalSeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              # A shell loop with curl, started with the 32Mi floor. No usage data yet.
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              memory: 32Mi
              ephemeral-storage: 16Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: slot-cache
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: inference-pvc
        - name: slot-cache
          configMap:
            name: {{ .Values.name }}-slot-cache

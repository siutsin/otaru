{{- $version := regexReplaceAll "@sha256:.*$" .Values.deployment.image.tag "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/version: {{ $version | quote }}
spec:
  replicas: 1
  # RWO: a second pod cannot mount the claim.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/version: {{ $version | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.targetPort | quote }}
        prometheus.io/path: /metrics
        # Roll the pod when the script changes.
        checksum/slot-cache: {{ .Files.Get "files/slot-cache.sh" | sha256sum }}
    spec:
      # Allow the preStop hook to save both slots, each capped at 120s.
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      nodeSelector:
        otaru.io/ai: "true"
      initContainers:
        - name: fetch-drafter
          image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
          command:
            - sh
            - -c
            - |
              set -e
              # The server refuses to start if the slot save path is missing.
              mkdir -p "$SLOT_PATH"
              [ -s "$DRAFT_PATH" ] && exit 0
              mkdir -p "$(dirname "$DRAFT_PATH")"
              curl -fL --retry 3 --connect-timeout 30 --max-time 3600 -o "$DRAFT_PATH.tmp" "$DRAFT_URL"
              mv "$DRAFT_PATH.tmp" "$DRAFT_PATH"
          env:
            - name: DRAFT_URL
              value: {{ .Values.drafter.url | quote }}
            - name: DRAFT_PATH
              value: {{ .Values.drafter.path | quote }}
            - name: SLOT_PATH
              value: {{ .Values.slotCache.path | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              # curl writes a 1.6GB file. Dirty page cache counts toward the cgroup, so keep headroom.
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
          env:
            - name: LLAMA_ARG_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: LLAMA_ARG_SPEC_DRAFT_MODEL
              value: {{ .Values.drafter.path | quote }}
            - name: SLOT_PATH
              value: {{ .Values.slotCache.path | quote }}
            {{- range $name, $value := .Values.deployment.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          # Slot save and restore files, used by the lifecycle hooks.
          args:
            - --slot-save-path
            - {{ .Values.slotCache.path | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # Restore the slot KV cache once the server is healthy, and save it before the pod stops.
          # kubelet starts no probes until postStart ends, so no request arrives before the restore.
          lifecycle:
            postStart:
              exec:
                command: ["sh", "/scripts/slot-cache.sh", "restore"]
            preStop:
              exec:
                command: ["sh", "/scripts/slot-cache.sh", "prestop"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # /health returns 503 until the model loads. Allow 3h for a large first download.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "2"
              # Q4 weights are 18.3GiB. Two 131072 slots with a full-size SWA cache and the drafter showed a 60.8GiB working set after a restore.
              # That figure includes the mapped weights, so 64Gi leaves little headroom.
              memory: 64Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 64Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: slot-cache
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: inference-pvc
        - name: slot-cache
          configMap:
            name: {{ .Values.name }}-slot-cache

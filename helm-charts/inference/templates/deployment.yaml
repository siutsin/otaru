{{- $version := regexReplaceAll "@sha256:.*$" .Values.deployment.image.tag "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/version: {{ $version | quote }}
spec:
  replicas: 1
  # RWO: a second pod cannot mount the claim.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/version: {{ $version | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        otaru.io/ai: "true"
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
          args:
            # Listen on every interface so the Service can connect.
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -hf
            - meta-models/Muse-Glimmer-30B-GGUF
            # Pin the higher-quality official file. Without this, the server selects Q4_K_M.
            - --hf-file
            - Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf
            # The repo has a vision projector. Do not download it.
            - --no-mmproj
            # 131072 is the model maximum.
            - -c
            - "131072"
            # One slot. More slots would split the 131072 context.
            - --parallel
            - "1"
            # Extra threads wait on memory.
            - -t
            - "8"
          env:
            - name: LLAMA_CACHE
              value: /models
            - name: XDG_CACHE_HOME
              value: /models
            - name: HF_HOME
              value: /models
            - name: TMPDIR
              value: /models
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: "2"
              # Q4 weights are 18.3GiB. 64Gi covers those weights plus one 131072 context.
              memory: 64Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 64Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: inference-pvc

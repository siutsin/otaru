name: inference
namespace: inference

route:
  hostname: inference.internal.siutsin.com

deployment:
  # preStop waits up to 240s for a periodic save, then saves two slots at up to 120s each.
  terminationGracePeriodSeconds: 600
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    # Vulkan build. It needs the node's GPU, served by the generic-device-plugin chart.
    tag: server-vulkan-b11706@sha256:5096299bac58e2b24f0371221c83eac786b206165bf8235dabc83d3ed514eb48
  env:
    LLAMA_ARG_HF_REPO: meta-models/Muse-Glimmer-30B-GGUF
    # Pin the higher-quality official file. Without this, the server selects Q4_K_M.
    LLAMA_ARG_HF_FILE: Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf
    # Load the vision projector from the model repo, so image input works.
    LLAMA_ARG_MMPROJ_AUTO: "1"
    # The context is split across slots. 262144 gives each of the 2 slots the 131072 model maximum.
    LLAMA_ARG_CTX_SIZE: "262144"
    # Two slots let a second client run while the first is busy.
    LLAMA_ARG_N_PARALLEL: "2"
    # Offload every layer to the GPU. In llama-bench this gave 2.3x faster decode and 6x faster prompts than 10 CPU threads.
    LLAMA_ARG_N_GPU_LAYERS: "99"
    # Flash attention gave +11% decode, and a 1024 micro-batch a little faster prompts, in llama-bench on the GPU.
    LLAMA_ARG_FLASH_ATTN: "on"
    LLAMA_ARG_UBATCH: "1024"
    # Threads only feed the GPU now.
    LLAMA_ARG_THREADS: "10"
    LLAMA_ARG_ENDPOINT_METRICS: "1"
    # A full-size SWA cache lets a restored slot reuse its prompt. It adds about 10GiB of KV memory.
    LLAMA_ARG_SWA_FULL: "1"
    LLAMA_CACHE: /models
    XDG_CACHE_HOME: /models
    HF_HOME: /models
    TMPDIR: /models

# In-cluster callers allowed to reach the server, besides the gateway.
clientPrincipals:
  - cluster.local/ns/changedetection/sa/changedetection
  - cluster.local/ns/hermes/sa/hermes

monitoring:
  namespace: monitoring
  prometheusServiceAccount: monitoring-prometheus-server

slotCache:
  path: /models/slots
  # How often the sidecar checks whether to save.
  saveIntervalSeconds: 300

service:
  port: 9931
  targetPort: 9931

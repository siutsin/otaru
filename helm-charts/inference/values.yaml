name: inference
namespace: inference

route:
  hostname: inference.internal.siutsin.com

deployment:
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server-b11434@sha256:af8c29600d1de84945de13fa7f126d06fdae16c4b19dc7db1c69c74287eae257
  env:
    LLAMA_ARG_HF_REPO: meta-models/Muse-Glimmer-30B-GGUF
    # Pin the higher-quality official file. Without this, the server selects Q4_K_M.
    LLAMA_ARG_HF_FILE: Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf
    # The repo has a vision projector. Do not download it.
    LLAMA_ARG_NO_MMPROJ: "1"
    # The context is split across slots. 262144 gives each of the 2 slots the 131072 model maximum.
    LLAMA_ARG_CTX_SIZE: "262144"
    # Two slots let a second client run while the first is busy.
    LLAMA_ARG_N_PARALLEL: "2"
    # One thread per vCPU. On 12 vCPUs, 12 threads cut generation to 5.2 tokens/s from 7.2.
    # On 10 vCPUs, 10 threads gave 8.3 tokens/s against 7.8 with 8. Leave batch threads at the default.
    LLAMA_ARG_THREADS: "10"
    LLAMA_ARG_ENDPOINT_METRICS: "1"
    # Experiment: a restored slot matched the prompt (similarity 1.0) but the server processed all 2708 tokens again.
    # Test whether a full-size SWA cache lets a restored slot be reused, and look for why the cache is discarded.
    # The full-size cache adds about 10GiB of KV memory, so expect about 58GiB against the 64Gi limit. Remove both lines to roll back.
    LLAMA_ARG_SWA_FULL: "1"
    LLAMA_ARG_LOG_VERBOSITY: "4"
    # The drafter proposes blocks of tokens and the main model verifies them, so decode is faster.
    LLAMA_ARG_SPEC_TYPE: draft-dflash
    LLAMA_CACHE: /models
    XDG_CACHE_HOME: /models
    HF_HOME: /models
    TMPDIR: /models

# In-cluster callers allowed to reach the server, besides the gateway.
clientPrincipals:
  - cluster.local/ns/changedetection/sa/changedetection
  - cluster.local/ns/hermes/sa/hermes

monitoring:
  namespace: monitoring
  prometheusServiceAccount: monitoring-prometheus-server

# The init container downloads the drafter once, pinned to the model commit. It stays on the volume.
drafter:
  url: https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF/resolve/70bf1b61ac09f91b24d39038091b41c582bc5d7a/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
  path: /models/dflash/dflash-Muse-Glimmer-30B-Q4_K_M.gguf

slotCache:
  path: /models/slots

service:
  port: 9931
  targetPort: 9931

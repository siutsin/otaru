namespace: istio-system

ztunnel:
  profile: ambient
  resources:
    # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 69Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 78Mi
      ephemeral-storage: 64Mi

namespace: istio-system

ztunnel:
  profile: ambient
  resources:
    # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    # 2026-10-08: ai-00 ztunnel OOMKilled (exit 137, 7 Oct 10:50 UTC, 2 restarts).
    # It idles at 56Mi on the busier node against the 78Mi limit, so a connection
    # spike exceeded it. Other nodes use 11-27Mi. Raised the limit to 128Mi.
    requests:
      cpu: 50m
      memory: 69Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi

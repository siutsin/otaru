apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  # 2026-07-24: no PDB, so the descheduler had free rein to evict the sole
  # replica for HighNodeUtilization -- the reason this PDB exists. Added while
  # auditing all single-replica charts the day those outages hit umami (#2917)
  # and home-assistant (#2918). Matches their single-replica PDB pattern.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}

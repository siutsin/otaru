apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  # 2026-07-24: no PDB; added while auditing all single-replica charts after
  # the same gap caused outages for umami (#2917) and home-assistant (#2918)
  # the same day. Matches their single-replica PDB pattern.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}

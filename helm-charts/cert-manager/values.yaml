_shared:
  preferredPodAntiAffinity: &preferredPodAntiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

cert-manager:
  affinity:
    <<: *preferredPodAntiAffinity
  resources:
    # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 52Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 114Mi
      ephemeral-storage: 64Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  cainjector:
    affinity:
      <<: *preferredPodAntiAffinity
    resources:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 96Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 122Mi
        ephemeral-storage: 64Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  webhook:
    affinity:
      <<: *preferredPodAntiAffinity
    resources:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 37Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 75Mi
        ephemeral-storage: 64Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  startupapicheck:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 64Mi
        ephemeral-storage: 64Mi
  enableCertificateOwnerRef: true
  installCRDs: true

_shared:
  preferredPodAntiAffinity: &preferredPodAntiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

cert-manager:
  affinity:
    <<: *preferredPodAntiAffinity
  resources:
    # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 52Mi
      ephemeral-storage: 64Mi
    limits:
      # 2026-10-10: 30d spike ~104.9Mi vs 114Mi limit (92.0% - OOM risk); limit -> 126Mi (ceil(spike*1.2)).
      memory: 126Mi
      ephemeral-storage: 64Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  cainjector:
    affinity:
      <<: *preferredPodAntiAffinity
    resources:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      # 2026-10-08: 30d spike ~122Mi vs 122Mi limit (99.8% — OOM risk); limit -> 147Mi (ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 96Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 147Mi
        ephemeral-storage: 64Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  webhook:
    affinity:
      <<: *preferredPodAntiAffinity
    resources:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 37Mi
        ephemeral-storage: 64Mi
      limits:
        # 2026-10-10: 30d spike ~66.3Mi vs 75Mi limit (88.4% - OOM risk); limit -> 80Mi (ceil(spike*1.2)).
        memory: 80Mi
        ephemeral-storage: 64Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  startupapicheck:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 64Mi
        ephemeral-storage: 64Mi
  enableCertificateOwnerRef: true
  installCRDs: true

{{- $gateway := .Values.gateway | default dict -}}
{{- $gatewayName := $gateway.name | default "gateway" -}}
{{- $gatewayNamespace := $gateway.namespace | default "gateway" -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  action: ALLOW
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.name }}
    # The headless Service selects the same pod, and Istio applies
    # this policy to the workload either way.
    - group: ""
      kind: Service
      name: {{ .Values.name }}-headless
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $gatewayNamespace }}/sa/{{ $gatewayName }}
      to:
        - operation:
            methods:
              - GET
              - HEAD
            paths:
              - /v2
              - /v2/*
            ports:
              - {{ .Values.port | quote }}
---
# Prometheus scrapes the pod IP, which targetRefs policies do not cover.
# A selector policy makes ztunnel enforce L4 authorization on the pod for
# ALL traffic, so the gateway and the waypoint are re-allowed here.
# L7 rules would not apply at ztunnel.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}-workload
  namespace: {{ .Values.namespace }}
spec:
  action: ALLOW
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $gatewayNamespace }}/sa/{{ $gatewayName }}
              - cluster.local/ns/monitoring/sa/monitoring-prometheus-server
              - cluster.local/ns/istio-waypoints/sa/waypoint
      to:
        - operation:
            ports:
              - {{ .Values.port | quote }}

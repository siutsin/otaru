apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.syncCredentials.secretName }}
  namespace: {{ .Values.namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-secret-store
  target:
    name: {{ .Values.syncCredentials.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        # One identity covers both hosts: dhi.io is Docker's hardened
        # registry and docker.io syncs through the registry endpoint.
        credentials.json: |
          {
            "registry-1.docker.io": {"username": "{{ `{{ .username }}` }}", "password": "{{ `{{ .password }}` }}"},
            "dhi.io": {"username": "{{ `{{ .username }}` }}", "password": "{{ `{{ .password }}` }}"}
          }
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        key: {{ .Values.syncCredentials.item }}
        metadataPolicy: None
        property: username
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        key: {{ .Values.syncCredentials.item }}
        metadataPolicy: None
        property: credential

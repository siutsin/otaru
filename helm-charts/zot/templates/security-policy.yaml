{{- $cidrs := .Files.Get "cidrs.json" | fromJson -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Values.name }}-node-sources
  namespace: {{ .Values.namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.name }}-internal
  # No JWT rule: containerd presents no token, so this route is the one
  # deliberate exception to the JWT policy (see the Kyverno
  # PolicyException). The source list is the rule: one /32 per node
  # from cidrs.json, plus the one local exception below.
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-node-sources
        action: Allow
        principal:
          clientCIDRs:
            {{- range $cidrs.nodes }}
            - {{ .cidr }}
            {{- end }}
      # Node traffic served by the gateway pod on its own node arrives
      # SNATed to the ambient host address, not the node /32. Ordinary
      # pod traffic keeps its pod IP, so pods stay denied.
      - name: allow-local-ztunnel
        action: Allow
        principal:
          clientCIDRs:
            - 169.254.7.127/32

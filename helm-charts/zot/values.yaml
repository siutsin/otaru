name: zot
namespace: zot

gateway:
  name: gateway
  namespace: gateway

port: 5000

syncCredentials:
  # Reused, not a dedicated item: the existing Docker item.
  item: Docker
  secretName: zot-sync-credentials

# The chart paths zot caches. Hand-maintained: add a path here when
# a chart starts to come through zot.
chartRepositories:
  - /charts.longhorn.io/longhorn
  - /docker.io/envoyproxy/gateway-helm
  - /ghcr.io/1password/connect
  - /ghcr.io/aquasecurity/helm-charts/trivy-operator
  - /ghcr.io/argoproj/argo-helm/argo-cd
  - /ghcr.io/cloudnative-pg/charts/cloudnative-pg
  - /ghcr.io/containers/charts/kubernetes-mcp-server
  - /ghcr.io/external-secrets/charts/external-secrets
  - /ghcr.io/falcosecurity/charts/falco
  - /ghcr.io/fluent/helm-charts/fluent-bit
  - /ghcr.io/gianlucam76/charts/k8s-cleaner
  - /ghcr.io/grafana-community/helm-charts/grafana
  - /ghcr.io/grafana-community/helm-charts/tempo
  - /ghcr.io/grafana/helm-charts/loki
  - /ghcr.io/istio/release/charts/base
  - /ghcr.io/istio/release/charts/cni
  - /ghcr.io/istio/release/charts/istiod
  - /ghcr.io/istio/release/charts/ztunnel
  - /ghcr.io/jkroepke/helm-charts/amazon-eks-pod-identity-webhook
  - /ghcr.io/kyverno/charts/kyverno
  - /ghcr.io/prometheus-community/charts/prometheus
  - /ghcr.io/prometheus-community/charts/prometheus-blackbox-exporter
  - /ghcr.io/prometheus-community/charts/prometheus-yet-another-cloudwatch-exporter
  - /ghcr.io/stakater/charts/reloader
  - /grafana.github.io/helm-charts/alloy
  - /jmcgrath207.github.io/k8s-ephemeral-storage-metrics/chart/k8s-ephemeral-storage-metrics
  - /k8s.ory.com/helm/charts/hydra
  - /kedacore.github.io/charts/keda
  - /kiali.org/helm-charts/kiali-server
  - /kubernetes-sigs.github.io/descheduler/descheduler
  - /kubernetes-sigs.github.io/metrics-server/metrics-server
  - /kubernetes.github.io/autoscaler/vertical-pod-autoscaler
  - /pkgs.tailscale.com/helmcharts/tailscale-operator
  - /quay.io/jetstack/charts/cert-manager
  - /quay.io/metallb/chart/metallb

zot:
  namespace: zot
  replicaCount: 1
  image:
    repository: ghcr.io/project-zot/zot
    tag: v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
  # The wrapper owns the ServiceAccount so the token automount is off;
  # the upstream chart renders no pod-level automount field.
  serviceAccount:
    create: false
    name: zot
  # The wrapper owns the PodDisruptionBudget: the upstream selector
  # also matches the instance label, which the Kyverno mandate forbids.
  podDisruptionBudget:
    enabled: false
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  podAnnotations: {}
  # The upstream StatefulSet renders its serviceName only with the
  # headless Service on.
  serviceHeadless:
    enabled: true
  persistence: true
  pvc:
    create: true
    accessModes:
      - ReadWriteOnce
    # 50 GiB flat: the measured pinned set stays under 25 GiB, so the
    # two-times rule for measured sets does not trigger. The dhi.io
    # pins are unmeasured.
    storage: 50Gi
    storageClassName: longhorn-crypto-global
  # 2026-10-20: starting size. Field reports put zot at 512 MiB to
  # 1 GiB of memory; the sizing rule adjusts from Prometheus data
  # later. No CPU limit, per house rule.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
      ephemeral-storage: 512Mi
    limits:
      memory: 1Gi
      ephemeral-storage: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  externalSecrets:
    - secretName: zot-sync-credentials
      mountPath: /etc/zot/sync-credentials
  extraVolumes:
    - name: config
      secret:
        secretName: zot-config
  extraVolumeMounts:
    - name: config
      mountPath: /etc/zot

# The upstream chart cannot drop its sample config.json from a parent
# values file, so the wrapper renders the config Secret itself and
# mounts it through the upstream chart's extra volume hooks.
config:
  distSpecVersion: 1.1.1
  storage:
    # The upstream chart mounts the volume at this path.
    rootDirectory: /var/lib/registry
    dedupe: true
    gc: true
    gcDelay: 1h
    gcInterval: 24h
    retention:
      dryRun: false
      policies:
        - repositories:
            - "**"
          deleteUntagged: true
          keepTags:
            - patterns:
                - ".*"
              pulledWithin: 2160h
  http:
    address: 0.0.0.0
    port: "5000"
    # Verified on v2.1.22: this flag alone gives digest-exact
    # pulls. preserveDigest changes nothing and stays unset.
    compat:
      - docker2s2
    # No auth or access control: the gateway and the mesh decide who may call.
  log:
    level: info
  extensions:
    metrics:
      enable: true
      prometheus:
        path: /metrics
    scrub:
      enable: true
      interval: 24h
    search:
      enable: false
    ui:
      enable: false
    sync:
      enable: true
      credentialsFile: /etc/zot/sync-credentials/credentials.json
      # One on-demand entry per upstream host. dhi.io checks its
      # manifests every 24h because it needs credentials. The other
      # hosts check every 1h.
      registries:
        - urls:
            - https://registry-1.docker.io
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /docker.io
              stripPrefix: false
        - urls:
            - https://dhi.io
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 24h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /dhi.io
              stripPrefix: false
        - urls:
            - https://ghcr.io
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /ghcr.io
              stripPrefix: false
        - urls:
            - https://quay.io
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /quay.io
              stripPrefix: false
        - urls:
            - https://registry.k8s.io
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /registry.k8s.io
              stripPrefix: false
        - urls:
            - https://public.ecr.aws
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /public.ecr.aws
              stripPrefix: false
        - urls:
            - https://ecr-public.aws.com
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /ecr-public.aws.com
              stripPrefix: false
        - urls:
            - https://mirror.gcr.io
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /mirror.gcr.io
              stripPrefix: false
        - urls:
            - https://registry.istio.io
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /registry.istio.io
              stripPrefix: false
        - urls:
            - https://cr.fluentbit.io
          onDemand: true
          tlsVerify: true
          syncTimeout: 60s
          manifestCheckInterval: 1h
          syncLegacyCosignTags: false
          content:
            - prefix: "**"
              destination: /cr.fluentbit.io

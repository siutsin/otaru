apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
  minReplicas: {{ .Values.app.autoscaling.min }}
  maxReplicas: {{ .Values.app.autoscaling.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        # 2026-07-30: fixed AverageValue instead of Utilization (% of request)
        # so the memory-only VPA can adjust the request without moving this
        # trigger point. 60Mi keeps the old 60%-of-100Mi absolute trigger.
        target:
          type: AverageValue
          averageValue: 60Mi

name: httpbin
namespace: httpbin

# 2026-07-30: VPA onboarded memory-only after a 7d steady-state check
# (avg/max ~62/63Mi against a 100Mi request, no incidents); CPU stays with
# the HPA. HPA memory trigger moved from Utilization to AverageValue
# (templates/hpa.yaml) so VPA request changes do not shift the trigger.
vpa:
  enabled: true

app:
  image:
    repository: dhi.io/httpbin
    tag: 0.2.3@sha256:3f9ccb7e96f176c10cecbe770248547c0da3c6d0a3668d8a39b80d5252a1cc46
  autoscaling:
    min: 2
    max: 6

# CEL migration of the legacy PolicyExceptions in this file. CEL
# exceptions apply to a whole policy, not named rules; each of these
# excepted the single rule of require-workload-resources, so the
# whole-policy scope is exact.
#
# Kubernetes and Kyverno manage these platform namespaces. Their workloads are
# not fully owned by this repository, so resource requirements cannot be
# corrected here. Keep the namespace scope explicit and auditable.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: platform-workload-policy-exceptions
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: require-workload-resources
      kind: ValidatingPolicy
  matchConditions:
    - name: platform-namespaces
      expression: >-
        object.metadata.namespace in ['kube-node-lease', 'kube-public', 'kube-system', 'kyverno']
---
# amazon-eks-pod-identity-webhook cannot set resources.limits.ephemeral-storage:
# the upstream chart's values.schema.json rejects that key. The workload cannot
# meet require-workload-resources. User-accepted exception, 2026-08-23.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: amazon-eks-pod-identity-webhook-ephemeral-storage
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: require-workload-resources
      kind: ValidatingPolicy
  matchConditions:
    - name: default-namespace
      expression: object.metadata.namespace == 'default'
    - name: webhook-name-prefix
      expression: object.metadata.name.startsWith('amazon-eks-pod-identity-webhook')
---
# Longhorn Manager creates these workload types after Helm applies this chart.
# Longhorn 1.12.1 has no resource template for them. The resource policy cannot
# be met without changing storage control-plane Pods at runtime. Keep this
# exception limited to generated component labels and stable names. Longhorn
# Manager and CSI resources remain in helm-charts/longhorn/values.yaml.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: longhorn-generated-workload-resources
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: require-workload-resources
      kind: ValidatingPolicy
  matchConditions:
    - name: longhorn-namespace
      expression: object.metadata.namespace == 'longhorn-system'
    - name: generated-workloads
      expression: >-
        object.metadata.?labels.orValue({})[?'longhorn.io/component'].orValue('') == 'engine-image' ||
        object.metadata.?labels.orValue({})[?'longhorn.io/component'].orValue('') == 'instance-manager' ||
        object.metadata.?labels.orValue({})[?'app'].orValue('') == 'longhorn-manager' ||
        object.metadata.?labels.orValue({})[?'app'].orValue('') == 'longhorn-ui' ||
        object.metadata.name.startsWith('longhorn-driver-deployer') ||
        object.metadata.?labels.orValue({})[?'recurring-job.longhorn.io'].orValue('') == 'backup'

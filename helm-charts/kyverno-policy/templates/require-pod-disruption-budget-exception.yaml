# CEL migration of the legacy PolicyException in this file.
#
# Longhorn and Kubernetes control-plane workloads are dynamically generated,
# so this repository cannot safely attach PDBs to all of them.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: platform-pod-disruption-budget-exceptions
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: require-pod-disruption-budget
      kind: ValidatingPolicy
  matchConditions:
    - name: platform-namespaces
      expression: >-
        object.metadata.namespace in ['kube-node-lease', 'kube-public', 'kube-system', 'kyverno', 'longhorn-system']

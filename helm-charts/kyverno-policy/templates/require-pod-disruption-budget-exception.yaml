# Longhorn and Kubernetes control-plane workloads are dynamically generated,
# so this repository cannot safely attach PDBs to all of them.
#
# The tailscale gateway StatefulSet has a working PDB (gateway-vip,
# minAvailable 1), but the require-pdb policy only detects PDBs via the
# app.kubernetes.io/name, app, or gateway.networking.k8s.io/gateway-name
# labels, and the operator labels pods with tailscale.com/parent-resource.
# Excepted here instead of relabelling operator-managed pods.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: platform-pod-disruption-budget-exceptions
  namespace: {{ .Values.namespace }}
spec:
  exceptions:
    - policyName: require-pod-disruption-budget
      ruleNames:
        - require-pdb-for-deployment
  match:
    any:
      - resources:
          kinds:
            - Deployment
            - StatefulSet
          namespaces:
            - kube-node-lease
            - kube-public
            - kube-system
            - kyverno
            - longhorn-system
      - resources:
          kinds:
            - StatefulSet
          namespaces:
            - tailscale
          selector:
            matchLabels:
              tailscale.com/parent-resource: gateway-vip
              tailscale.com/parent-resource-type: connector

{{- if .Values.requireImageTagPolicy.enabled }}
# CEL migration of the legacy ClusterPolicy require-image-tag. Its two
# rules become two ValidatingPolicies because the firecrawl exception
# covers only the latest-tag rule: CEL exceptions apply to a whole
# policy, so keeping both rules in one policy would widen that exception
# to the tag-presence rule too. Background stays off: both legacy rules
# set skipBackgroundRequests.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-tag
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - statefulsets
        - cronjobs
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  variables:
    - name: allContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.allContainers.all(c, c.image.contains(':'))
      message: Containers must use an explicit image tag rather than an implicit latest.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-image-tag
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - statefulsets
        - cronjobs
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  variables:
    - name: allContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.allContainers.all(c, !c.image.endsWith(':latest'))
      message: Containers must not use the mutable latest image tag.
{{- end }}

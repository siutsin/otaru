{{- if .Values.tailscaleProxySecretScopeRbac.enabled }}
# Lets the kyverno controllers update the tailscale `proxies` Role with the
# narrowed rules from the tailscale-proxy-secret-scope ClusterPolicy. The
# narrowed rules grant secrets get/update/patch/delete/create and events
# get/create/patch; the API server rejects the Role update unless the
# updater holds those verbs itself. Scoped to the tailscale namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-tailscale-proxy-role-narrowing
  namespace: {{ .Values.tailscaleProxySecretScopeRbac.namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - update
      - patch
      - delete
      - create
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-tailscale-proxy-role-narrowing
  namespace: {{ .Values.tailscaleProxySecretScopeRbac.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-tailscale-proxy-role-narrowing
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: {{ .Values.namespace }}
{{- end }}

# CEL migration of the legacy ClusterPolicy
# restrict-onepassword-properties-argocd-openclaw, which was applied
# directly to the cluster on 2026-05-25 and never lived in git. It
# becomes a GitOps-managed ValidatingPolicy here. The legacy live object
# needs a one-time manual delete after this replacement syncs: Argo CD
# cannot prune it because it was never tracked by the app.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-onepassword-properties-argocd-openclaw
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - external-secrets.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - externalsecrets
  matchConditions:
    - name: in-scope-namespace
      expression: object.metadata.namespace == 'argocd'
  variables:
    - name: topLevelStore
      expression: >-
        object.spec.?secretStoreRef.?kind.orValue('') == 'ClusterSecretStore' &&
        object.spec.?secretStoreRef.?name.orValue('') == 'onepassword-secret-store'
  validations:
    - expression: >-
        !variables.topLevelStore ||
        object.spec.?data.orValue([]).all(entry,
        !(entry.?sourceRef.?storeRef.?name.orValue('') == '' &&
        entry.?remoteRef.?key.orValue('') == 'openclaw') ||
        entry.?remoteRef.?property.orValue('') in ['OPENCLAW_CONTROL_UI_HOSTNAME'])
      message: ExternalSecret data entries using this 1Password item must read approved properties.
    - expression: >-
        !variables.topLevelStore ||
        object.spec.?dataFrom.orValue([]).all(entry,
        !(entry.?sourceRef.?storeRef.?name.orValue('') == '' &&
        entry.?extract.?key.orValue('') == 'openclaw'))
      message: ExternalSecret dataFrom entries may not extract property-scoped 1Password items.
    - expression: >-
        object.spec.?data.orValue([]).all(entry,
        !(entry.?sourceRef.?storeRef.?kind.orValue('') == 'ClusterSecretStore' &&
        entry.?sourceRef.?storeRef.?name.orValue('') == 'onepassword-secret-store' &&
        entry.?remoteRef.?key.orValue('') == 'openclaw') ||
        entry.?remoteRef.?property.orValue('') in ['OPENCLAW_CONTROL_UI_HOSTNAME'])
      message: ExternalSecret data entries using this 1Password item must read approved properties.
    - expression: >-
        object.spec.?dataFrom.orValue([]).all(entry,
        !(entry.?sourceRef.?storeRef.?kind.orValue('') == 'ClusterSecretStore' &&
        entry.?sourceRef.?storeRef.?name.orValue('') == 'onepassword-secret-store' &&
        entry.?extract.?key.orValue('') == 'openclaw'))
      message: ExternalSecret dataFrom entries may not extract property-scoped 1Password items.

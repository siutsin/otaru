# These pre-existing routes are explicitly grandfathered until each gains its
# own Envoy Gateway SecurityPolicy. New routes cannot use an annotation bypass.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: grandfathered-httproutes-without-security-policy
  namespace: {{ .Values.namespace }}
spec:
  exceptions:
    - policyName: require-security-policy
      ruleNames:
        - require-security-policy-for-httproutes
  match:
    any:
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - argocd
          names:
            - argocd-internal
            - argocd-public
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - blocky
          names:
            - blocky-internal-doh
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - changedetection
          names:
            - changedetection-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - cyberchef
          names:
            - cyberchef-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - excalidraw
          names:
            - excalidraw-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - gateway
          names:
            - kiali-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - home-assistant
          names:
            - home-assistant-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - httpbin
          names:
            - httpbin-public
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - hydra
          names:
            - hydra-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - jellyfin
          names:
            - jellyfin-internal
            - jellyfin-sftpgo-internal-http
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - jsoncrack
          names:
            - jsoncrack-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - jung2bot
          names:
            - jung2bot-public
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - jung2bot-dev
          names:
            - jung2bot-public
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - longhorn-system
          names:
            - longhorn-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - monitoring
          names:
            - monitoring-grafana-internal
            - monitoring-loki-internal
            - monitoring-prometheus-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - openclaw
          names:
            - openclaw-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - teslamate
          names:
            - teslamate-grafana-internal
            - teslamate-internal
      - resources:
          kinds:
            - HTTPRoute
          namespaces:
            - umami
          names:
            - umami-collect
            - umami-internal

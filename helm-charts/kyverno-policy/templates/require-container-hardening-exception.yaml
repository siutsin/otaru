# These workloads are platform-managed or require privileges incompatible with
# the generic hardening policy. Keep the exception bounded to their namespaces.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: platform-container-hardening-exceptions
  namespace: {{ .Values.namespace }}
spec:
  exceptions:
    - policyName: require-container-hardening
      ruleNames:
        - require-allow-privilege-escalation-false
        - autogen-require-allow-privilege-escalation-false
        - autogen-cronjob-require-allow-privilege-escalation-false
        - require-drop-all-capabilities
        - autogen-require-drop-all-capabilities
        - autogen-cronjob-require-drop-all-capabilities
  match:
    any:
      - resources:
          kinds:
            - Pod
            - DaemonSet
            - Deployment
            - Job
            - ReplicaSet
            - ReplicationController
            - StatefulSet
            - CronJob
          namespaces:
            - istio-system
            - kube-system
            - longhorn-system
            - metallb-system
---
# Node exporter needs host-level access for node telemetry and cannot meet the
# generic container-hardening policy. Limit this exception to its exact label.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: prometheus-node-exporter-container-hardening
  namespace: {{ .Values.namespace }}
spec:
  exceptions:
    - policyName: require-container-hardening
      ruleNames:
        - require-allow-privilege-escalation-false
        - autogen-require-allow-privilege-escalation-false
        - autogen-cronjob-require-allow-privilege-escalation-false
        - require-drop-all-capabilities
        - autogen-require-drop-all-capabilities
        - autogen-cronjob-require-drop-all-capabilities
  match:
    any:
      - resources:
          kinds:
            - Pod
            - DaemonSet
          namespaces:
            - monitoring
          selector:
            matchLabels:
              app.kubernetes.io/name: prometheus-node-exporter
---
# The tailscale gateway is a subnet router and exit node. It needs NET_ADMIN
# and root to configure nftables and interfaces, so it cannot drop ALL
# capabilities or forbid privilege escalation. Hardening it would break the
# VPN. Limit this exception to the operator-managed gateway pods.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: tailscale-gateway-container-hardening
  namespace: {{ .Values.namespace }}
spec:
  exceptions:
    - policyName: require-container-hardening
      ruleNames:
        - require-allow-privilege-escalation-false
        - autogen-require-allow-privilege-escalation-false
        - autogen-cronjob-require-allow-privilege-escalation-false
        - require-drop-all-capabilities
        - autogen-require-drop-all-capabilities
        - autogen-cronjob-require-drop-all-capabilities
  match:
    any:
      - resources:
          kinds:
            - Pod
            - StatefulSet
          namespaces:
            - tailscale
          selector:
            matchLabels:
              tailscale.com/parent-resource: gateway-vip
              tailscale.com/parent-resource-type: connector

# CEL migration of the legacy PolicyExceptions in this file. CEL
# exceptions apply to a whole policy, not named rules; these four
# excepted both rules of require-container-hardening, so the whole-policy
# scope is exact. Each exception stays in the kyverno namespace: the
# chart sets features.policyExceptions.namespace to kyverno, so only
# exceptions in that namespace are honoured. The namespace and label
# conditions below carry the scoping the legacy match block held.
#
# These workloads are platform-managed or require privileges incompatible with
# the generic hardening policy. Keep the exception bounded to their namespaces.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: platform-container-hardening-exceptions
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: require-container-hardening
      kind: ValidatingPolicy
  matchConditions:
    - name: platform-namespaces
      expression: >-
        object.metadata.namespace in ['istio-system', 'kube-system', 'longhorn-system', 'metallb-system']
---
# Node exporter needs host-level access for node telemetry and cannot meet the
# generic container-hardening policy. Limit this exception to its exact label.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: prometheus-node-exporter-container-hardening
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: require-container-hardening
      kind: ValidatingPolicy
  matchConditions:
    - name: monitoring-namespace
      expression: object.metadata.namespace == 'monitoring'
    - name: node-exporter-label
      expression: >-
        object.metadata.?labels.orValue({})[?'app.kubernetes.io/name'].orValue('') == 'prometheus-node-exporter'
---
# The tailscale gateway is a subnet router and exit node. It needs NET_ADMIN
# and root to configure nftables and interfaces, so it cannot drop ALL
# capabilities or forbid privilege escalation. Hardening it would break the
# VPN. Limit this exception to the operator-managed gateway pods.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: tailscale-gateway-container-hardening
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: require-container-hardening
      kind: ValidatingPolicy
  matchConditions:
    - name: tailscale-namespace
      expression: object.metadata.namespace == 'tailscale'
    - name: gateway-labels
      expression: >-
        object.metadata.?labels.orValue({})[?'tailscale.com/parent-resource'].orValue('') == 'gateway-vip' &&
        object.metadata.?labels.orValue({})[?'tailscale.com/parent-resource-type'].orValue('') == 'connector'
---
# Falco runs a per-node eBPF driver and cannot drop ALL caps or forbid
# privilege escalation. Least-privileged caps still breach the generic
# hardening policy. Limit this exception to the falco namespace.
# Note: sidekick pods in this namespace are covered too. Tighten with a
# label selector when Falco proves noisy.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: falco-container-hardening
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: require-container-hardening
      kind: ValidatingPolicy
  matchConditions:
    - name: falco-namespace
      expression: object.metadata.namespace == 'falco'

{{- if .Values.clusterSecretStorePolicy.enabled }}
{{- $storeName := .Values.clusterSecretStorePolicy.storeName }}
{{- $allowedNamespaces := keys .Values.clusterSecretStorePolicy.allowedNamespaces | sortAlpha }}
{{- range $namespace, $keys := .Values.clusterSecretStorePolicy.allowedNamespaces }}
  {{- if not $keys }}
    {{- fail (printf "clusterSecretStorePolicy.allowedNamespaces.%s must include at least one allowed key" $namespace) }}
  {{- end }}
{{- end }}
# CEL migration of the legacy ClusterPolicy of the same name. The three
# rules become three validations; per-rule failureAction Enforce becomes
# validationActions Deny. Background stays off: the legacy policy ran
# admission only.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-onepassword-cluster-secret-store
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - external-secrets.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - externalsecrets
  variables:
    - name: namespaceAllowed
      expression: >-
        object.metadata.namespace in [{{- range $i, $ns := $allowedNamespaces }}{{ if $i }}, {{ end }}{{ $ns | quote }}{{ end }}]
  validations:
    - expression: >-
        !(object.spec.?secretStoreRef.?kind.orValue('') == 'ClusterSecretStore' &&
        object.spec.?secretStoreRef.?name.orValue('') == {{ $storeName | quote }} &&
        !variables.namespaceAllowed)
      message: ExternalSecrets may only use the shared 1Password ClusterSecretStore from approved namespaces.
    - expression: >-
        object.spec.?data.orValue([]).all(entry,
        !(entry.?sourceRef.?storeRef.?kind.orValue('') == 'ClusterSecretStore' &&
        entry.?sourceRef.?storeRef.?name.orValue('') == {{ $storeName | quote }}) ||
        variables.namespaceAllowed)
      message: ExternalSecret data entries may only use the shared 1Password ClusterSecretStore from approved namespaces.
    - expression: >-
        object.spec.?dataFrom.orValue([]).all(entry,
        !(entry.?sourceRef.?storeRef.?kind.orValue('') == 'ClusterSecretStore' &&
        entry.?sourceRef.?storeRef.?name.orValue('') == {{ $storeName | quote }}) ||
        variables.namespaceAllowed)
      message: ExternalSecret dataFrom entries may only use the shared 1Password ClusterSecretStore from approved namespaces.
{{- range $namespace, $keys := .Values.clusterSecretStorePolicy.allowedNamespaces }}
---
# CEL migration of the legacy ClusterPolicy restrict-onepassword-keys-{{ $namespace }}.
# Its four rules become four validations; per-rule failureAction Enforce
# becomes validationActions Deny. Background stays off.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-onepassword-keys-{{ $namespace }}
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - external-secrets.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - externalsecrets
  matchConditions:
    - name: in-scope-namespace
      expression: object.metadata.namespace == {{ $namespace | quote }}
  variables:
    - name: topLevelStore
      expression: >-
        object.spec.?secretStoreRef.?kind.orValue('') == 'ClusterSecretStore' &&
        object.spec.?secretStoreRef.?name.orValue('') == {{ $storeName | quote }}
    - name: allowedKeys
      expression: >-
        [{{- range $i, $key := $keys }}{{ if $i }}, {{ end }}{{ $key | quote }}{{ end }}]
  validations:
    # Entries with no per-entry storeRef inherit the top-level shared ClusterSecretStore.
    - expression: >-
        !variables.topLevelStore ||
        object.spec.?data.orValue([]).all(entry,
        entry.?sourceRef.?storeRef.?name.orValue('') != '' ||
        entry.?remoteRef.?key.orValue('') in variables.allowedKeys)
      message: ExternalSecret data entries using the shared 1Password ClusterSecretStore must read approved item keys.
    # dataFrom entries with extract.key also inherit the top-level shared store unless they override storeRef.
    - expression: >-
        !variables.topLevelStore ||
        object.spec.?dataFrom.orValue([]).all(entry,
        entry.?sourceRef.?storeRef.?name.orValue('') != '' ||
        (!has(entry.find) && entry.?extract.?key.orValue('') in variables.allowedKeys))
      message: ExternalSecret dataFrom entries using the shared 1Password ClusterSecretStore must read approved item keys.
    # Per-entry storeRef overrides can explicitly target the shared ClusterSecretStore.
    - expression: >-
        object.spec.?data.orValue([]).all(entry,
        !(entry.?sourceRef.?storeRef.?kind.orValue('') == 'ClusterSecretStore' &&
        entry.?sourceRef.?storeRef.?name.orValue('') == {{ $storeName | quote }}) ||
        entry.?remoteRef.?key.orValue('') in variables.allowedKeys)
      message: ExternalSecret data entries using the shared 1Password ClusterSecretStore must read approved item keys.
    - expression: >-
        object.spec.?dataFrom.orValue([]).all(entry,
        !(entry.?sourceRef.?storeRef.?kind.orValue('') == 'ClusterSecretStore' &&
        entry.?sourceRef.?storeRef.?name.orValue('') == {{ $storeName | quote }}) ||
        entry.?extract.?key.orValue('') in variables.allowedKeys)
      message: ExternalSecret dataFrom entries using the shared 1Password ClusterSecretStore must read approved item keys.
{{- end }}
{{- end }}

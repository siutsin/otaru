# CEL migration of the legacy PolicyException in this file. It references
# only disallow-latest-image-tag: the legacy exception covered just the
# latest-tag rule, and the migration splits that rule into its own policy
# so the exception stays that narrow.
#
# Upstream Firecrawl publishes no x.y.z tag for the Playwright service. The
# only multi-arch tag is `latest`. The chart pins the index digest. Remove
# this exception when upstream publishes a version tag.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: firecrawl-playwright-latest-tag
  namespace: {{ .Values.namespace }}
spec:
  policyRefs:
    - name: disallow-latest-image-tag
      kind: ValidatingPolicy
  matchConditions:
    - name: firecrawl-namespace
      expression: object.metadata.namespace == 'firecrawl'
    - name: playwright-label
      expression: >-
        object.metadata.?labels.orValue({})[?'app.kubernetes.io/name'].orValue('') == 'playwright'

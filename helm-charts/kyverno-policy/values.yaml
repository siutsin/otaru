name: kyverno-policy
namespace: kyverno

clusterSecretStorePolicy:
  enabled: true
  storeName: onepassword-secret-store
  allowedNamespaces:
    argocd:
      - argocd-secret
      - heartbeats
      - openclaw
      - Otaru - GitHub Private
    blocky:
      - blocky
      - heartbeats
    changedetection:
      - changedetection
    cloudflare-tunnel:
      - cloudflare-tunnel-credentials
    external-secrets:
      - 1Password Token
    gateway:
      - cloudflare-acme-verification-secret
      - heartbeats
    hydra:
      - b2-secret-cloudnative-pg
      - Ory
    umami:
      - Umami
      - b2-secret-cloudnative-pg
      - heartbeats
    home-assistant:
      - heartbeats
    jung2bot:
      - jung2bot
    longhorn-system:
      - b2-secret
      - longhorn-crypto
    monitoring:
      - grafana
      - heartbeats
      - monitoring
    openclaw:
      - openclaw
    teslamate:
      - b2-secret-cloudnative-pg
      - heartbeats
      - teslamate
    unifi-mcp:
      - unifi-mcp

workloadResourcesPolicy:
  enabled: true
  excludedNamespaces:
    - kube-node-lease
    - kube-public
    - kube-system
    - kyverno

meshAuthorizationPolicy:
  enabled: true
  failureAction: Audit
  namespaceSelector:
    matchLabels:
      istio.io/dataplane-mode: ambient

barmanObjectStorePolicy:
  enabled: true
  allowedNamespaces:
    hydra:
      objectStores:
        - b2-backup
      credentialSecrets:
        - b2-backup-credentials
    teslamate:
      objectStores:
        - b2-backup
      credentialSecrets:
        - b2-backup-credentials
    umami:
      objectStores:
        - b2-backup
      credentialSecrets:
        - b2-backup-credentials

requireImageTagPolicy:
  enabled: true
  excludedNamespaces:
    - kube-node-lease
    - kube-public
    - kube-system
    - kyverno

requireContainerHardeningPolicy:
  enabled: true
  excludedNamespaces:
    - longhorn-system
    - istio-system
    - metallb-system
    - kube-system

# 2026-07-25: audit-only policy added after the missing-PDB
# eviction-storm pattern caused real outages for umami, home-assistant,
# and prometheus-server on the same day (see documentation/gotcha.md).
# Excluded namespaces are the same system-managed/dynamic components
# already established as out of scope for hand-written PDB fixes
# (helm-charts/*/templates -- Longhorn CSI/UI/driver-deployer are
# created directly by longhorn-manager, not by any chart here).
# Audit mode first: this reports violations without blocking anything,
# so the initial run against ~30+ pre-existing gaps does not need every
# exclusion tuned up front.
requirePodDisruptionBudgetPolicy:
  enabled: true
  excludedNamespaces:
    - longhorn-system
    - kube-system
    - kube-node-lease
    - kube-public
    - kyverno

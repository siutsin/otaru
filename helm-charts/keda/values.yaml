_shared:
  preferredPodAntiAffinity: &preferredPodAntiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

keda:
  resources:
    # KRR 2026-07-18 dead end: the vendored chart's own 1-core CPU limit stays --
    # a plain values.yaml `null` does not remove a subchart-default key on merge
    # (confirmed via `helm template`). This file never sets limits.cpu.
    operator:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 10m
        memory: 159Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 173Mi
        ephemeral-storage: 64Mi
    metricServer:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 17m
        memory: 139Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 152Mi
        ephemeral-storage: 64Mi
    webhooks:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 10m
        memory: 36Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 59Mi
        ephemeral-storage: 64Mi
  operator:
    affinity:
      <<: *preferredPodAntiAffinity
  metricsServer:
    affinity:
      <<: *preferredPodAntiAffinity
  webhooks:
    affinity:
      <<: *preferredPodAntiAffinity
  affinity:
    <<: *preferredPodAntiAffinity
  podDisruptionBudget:
    # metricServer and webhooks have no native podDisruptionBudget support
    # in this chart version -- hand-written PDBs for those two live in
    # templates/metrics-server-pdb.yaml and templates/webhooks-pdb.yaml.
    operator:
      minAvailable: 1

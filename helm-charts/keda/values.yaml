_shared:
  preferredPodAntiAffinity: &preferredPodAntiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

keda:
  image:
    keda:
      registry: dhi.io
      repository: keda
      tag: 2.21.0@sha256:7b607bf215f17c8c79b9fc9169795fcf72e5f895f39a181d18e3b2621e066186
    metricsApiServer:
      registry: dhi.io
      repository: keda-metrics-apiserver
      tag: 2.21.0@sha256:85851c7cf5e2b1a5bb83ffc0ff3506b2881fae8c7f623e84260e8db1d4c979a0
    webhooks:
      registry: dhi.io
      repository: keda-admission-webhooks
      tag: 2.21.0@sha256:906e90316363e1216b0de9ae40520fad6a21f3985fecf58c2cfaae6d2db6a831
  resources:
    # KRR 2026-07-18 dead end: the vendored chart's own 1-core CPU limit stays --
    # a plain values.yaml `null` does not remove a subchart-default key on merge
    # (confirmed via `helm template`). This file never sets limits.cpu.
    operator:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      # KRR 2026-09-27: 30d p50 49.4MiB (14d 40.1), max 143.7MiB — request 159MiB
      # never approached in 30d; lower to ceil(p50/0.9)=55MiB, limit 173MiB unchanged.
      requests:
        cpu: 10m
        memory: 55Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 173Mi
        ephemeral-storage: 64Mi
    metricServer:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      # KRR 2026-09-27: 30d p50 51.2MiB (14d 49.0), max 126.1MiB — request 139MiB
      # never approached in 30d; lower to ceil(p50/0.9)=57MiB, limit 152MiB unchanged.
      requests:
        cpu: 17m
        memory: 57Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 152Mi
        ephemeral-storage: 64Mi
    webhooks:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 10m
        memory: 36Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 59Mi
        ephemeral-storage: 64Mi
  operator:
    affinity:
      <<: *preferredPodAntiAffinity
  metricsServer:
    affinity:
      <<: *preferredPodAntiAffinity
  webhooks:
    affinity:
      <<: *preferredPodAntiAffinity
  affinity:
    <<: *preferredPodAntiAffinity
  podDisruptionBudget:
    # metricServer and webhooks have no native podDisruptionBudget support
    # in this chart version -- hand-written PDBs for those two live in
    # templates/metrics-server-pdb.yaml and templates/webhooks-pdb.yaml.
    operator:
      minAvailable: 1

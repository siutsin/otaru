name: searxng
namespace: searxng

gateway:
  name: gateway
  namespace: gateway

authentication:
  enabled: true
  issuer: https://auth.siutsin.com/
  jwksUri: https://auth.siutsin.com/.well-known/jwks.json
  allowedSubjects:
    - muse
  requiredScopes:
    - mcp

image:
  # 2026-10-26: tag 2026.10.25-54ca1d9cf. The digest is the multi-arch index
  # (linux/amd64 and linux/arm64). GRANIAN_PORT is 8080. The image sets no
  # USER. Dist files are owned by uid 977.
  repository: docker.io/searxng/searxng
  tag: 2026.10.25-54ca1d9cf@sha256:23482d8ecf7ddf66029479468ea04c1bb11d2b65785a17a7e629e2ffd13296ca
port: 8080
resources:
  # 2026-10-09: first deploy, no 30d series. Unmeasured.
  # 2026-10-14: measured now — 30d p50 ~84.8Mi, spike ~132.7Mi vs 256Mi;
  # request -> 95Mi, limit -> 160Mi (ceil(spike*1.2)).
  requests:
    cpu: 100m
    memory: 95Mi
    ephemeralStorage: 256Mi
  limits:
    memory: 160Mi
    ephemeralStorage: 256Mi

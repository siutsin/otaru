{{- $gateway := .Values.gateway | default dict -}}
{{- $gatewayName := $gateway.name | default "gateway" -}}
{{- $gatewayNamespace := $gateway.namespace | default "gateway" -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Kyverno admits the Service only when this policy already exists.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  action: ALLOW
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.name }}
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/hermes/sa/hermes
      to:
        - operation:
            ports:
              - {{ .Values.port | quote }}
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $gatewayNamespace }}/sa/{{ $gatewayName }}
            {{- if .Values.authentication.enabled }}
            requestPrincipals:
              - "*"
            {{- end }}
      to:
        - operation:
            ports:
              - {{ .Values.port | quote }}
      {{- if .Values.authentication.enabled }}
      when:
        - key: request.auth.claims[sub]
          values:
            {{- toYaml .Values.authentication.allowedSubjects | nindent 12 }}
      {{- end }}

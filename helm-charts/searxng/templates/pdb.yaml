apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Kyverno admits the Deployment only when this budget already exists.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # 2026-10-09: one replica. maxUnavailable 1 lets the descheduler evict
  # the only pod. minAvailable 1 keeps disruptionsAllowed at 0.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}

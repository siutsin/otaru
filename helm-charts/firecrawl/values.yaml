name: firecrawl
namespace: firecrawl
clusterName: firecrawl-20261009-0001

gateway:
  name: gateway
  namespace: gateway

authentication:
  enabled: true
  issuer: https://auth.siutsin.com/
  jwksUri: https://auth.siutsin.com/.well-known/jwks.json
  allowedSubjects:
    - muse
  requiredScopes:
    - mcp

api:
  image:
    repository: ghcr.io/firecrawl/firecrawl
    tag: 2.11.606@sha256:aa5afc0b3057013fbd4ece94979ef911121705d9c86cb634936d9993690fa665
  port: 3002
  resources:
    # 2026-10-09: first deploy, no 30d series. Unmeasured. One NuQ worker
    # shares this pod. Request was equal to limit until the 2026-10-11 bump.
    # KRR 2026-10-11: 30d spike ~1947.3Mi vs 2Gi limit (95.1% — OOM risk); limit -> 2337Mi (ceil(spike*1.2)). Request stays 2Gi (scheduling unchanged).
    requests:
      cpu: 100m
      memory: 2Gi
      ephemeralStorage: 256Mi
    limits:
      memory: 2337Mi
      ephemeralStorage: 256Mi

playwright:
  image:
    # 2026-10-09: upstream publishes no x.y.z tag. `latest` is the only
    # multi-arch tag. The digest is the index. Kyverno excepts this pod.
    repository: ghcr.io/firecrawl/playwright-service
    tag: latest@sha256:6b54a9733fe6863c2dc225bf8e284db996ef59f6efd5d1e760f0664c09c1f856
  port: 3000
  resources:
    # 2026-10-09: first deploy, no 30d series. Unmeasured. 1Gi ephemeral
    # leaves room for Chromium files under /tmp.
    # 2026-10-14: measured now — 30d p50 ~204Mi, spike ~260Mi vs 2Gi;
    # request -> 228Mi, limit -> 313Mi (ceil(spike*1.2)).
    requests:
      cpu: 200m
      memory: 228Mi
      ephemeralStorage: 1Gi
    limits:
      memory: 313Mi
      ephemeralStorage: 1Gi

valkey:
  image:
    repository: dhi.io/valkey
    tag: 9.1.2@sha256:88c9f6749db5757ecd2270fbb000840bad1f3a002662ad034c86e1809f2b46b1
  port: 6379
  resources:
    # 2026-10-09: first deploy, no 30d series. Unmeasured. Request equals limit.
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeralStorage: 128Mi
    limits:
      memory: 128Mi
      ephemeralStorage: 128Mi

rabbitmq:
  image:
    # 2026-10-09: multi-arch index digest of the upstream compose image.
    repository: docker.io/library/rabbitmq
    tag: 4-management@sha256:c200fd496482cda18c412be4e6f244830e1e75949b8cf5f0e887cea9ea456109
  resources:
    # 2026-10-09: first deploy, no 30d series. Unmeasured. Limit above
    # request: queue depth can push memory past idle (~150-200Mi).
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeralStorage: 256Mi
    limits:
      memory: 512Mi
      ephemeralStorage: 512Mi

nuq:
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: 18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  resources:
    # 2026-10-09: first deploy, no 30d series. Unmeasured. Request equals limit.
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeralStorage: 128Mi
    limits:
      memory: 128Mi
      ephemeralStorage: 128Mi
  jobs:
    - name: nuq-scrape-cleanup
      schedule: "*/5 * * * *"
      file: nuq-scrape-cleanup.sql
    - name: nuq-scrape-lock-reaper
      schedule: "* * * * *"
      file: nuq-scrape-lock-reaper.sql

apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: playwright
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: playwright
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playwright
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playwright
          image: {{ .Values.playwright.image.repository }}:{{ .Values.playwright.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            # The image sets PORT to an empty string, which makes the process listen on 3003.
            - name: PORT
              value: {{ .Values.playwright.port | quote }}
            # Two pages stay inside the first-deploy 2Gi budget.
            - name: MAX_CONCURRENT_PAGES
              value: "2"
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: {{ .Values.playwright.port }}
              protocol: TCP
          # /health launches a browser page on every call. The process listens
          # only after the browser starts, so a TCP probe is enough.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.playwright.resources.requests.cpu }}
              memory: {{ .Values.playwright.resources.requests.memory }}
              ephemeral-storage: {{ .Values.playwright.resources.requests.ephemeralStorage }}
            limits:
              memory: {{ .Values.playwright.resources.limits.memory }}
              ephemeral-storage: {{ .Values.playwright.resources.limits.ephemeralStorage }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: playwright
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: playwright
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: playwright
  ports:
    - name: http
      port: {{ .Values.playwright.port }}
      targetPort: http
      protocol: TCP

{{- range $suffix := list "r" "ro" "rw" }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $.Values.clusterName }}-{{ $suffix }}
  namespace: {{ $.Values.namespace }}
spec:
  action: ALLOW
  targetRefs:
    - group: ""
      kind: Service
      name: {{ $.Values.clusterName }}-{{ $suffix }}
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $.Values.namespace }}/sa/{{ $.Values.name }}
      to:
        - operation:
            ports:
              - "5432"
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # The generated database password refreshes every 24h.
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: USE_DB_AUTHENTICATION
              value: "false"
            - name: REDIS_URL
              value: redis://valkey.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.valkey.port }}
            - name: REDIS_RATE_LIMIT_URL
              value: redis://valkey.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.valkey.port }}
            # One worker keeps the first-deploy 2Gi budget.
            - name: NUQ_WORKER_COUNT
              value: "1"
            - name: HOME
              value: /tmp
            - name: PLAYWRIGHT_MICROSERVICE_URL
              value: http://playwright.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.playwright.port }}/scrape
            - name: POSTGRES_HOST
              value: {{ .Values.clusterName }}-rw.{{ .Values.namespace }}.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: firecrawl
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clusterName }}
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clusterName }}
                  key: DATABASE_PASS
            - name: NUQ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clusterName }}
                  key: DATABASE_URL
            - name: NUQ_DATABASE_URL_LISTEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clusterName }}
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          # The harness exits after 60s when Postgres is late. This probe
          # covers a slow first boot. A late database still causes a restart.
          startupProbe:
            httpGet:
              path: /v0/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /v0/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
              ephemeral-storage: {{ .Values.api.resources.requests.ephemeralStorage }}
            limits:
              memory: {{ .Values.api.resources.limits.memory }}
              ephemeral-storage: {{ .Values.api.resources.limits.ephemeralStorage }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ca
              mountPath: /etc/secrets/ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ca
          secret:
            secretName: {{ .Values.clusterName }}-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP

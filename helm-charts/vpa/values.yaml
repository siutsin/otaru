namespace: vpa

vertical-pod-autoscaler:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  admissionController:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 100Mi
        ephemeral-storage: 64Mi
    mutatingWebhookConfiguration:
      failurePolicy: Ignore  # explicit chart default: never block pod creation
    certGen:
      enabled: false
    registerWebhook: false
    tls:
      create: false
    certManager:
      enabled: true
      createSelfSignedIssuer:
        enabled: true
      # 2026-07-27: chart default (duration: 168h, renewBefore: 24h) means
      # the leaf cert is always within the CertificateExpiringSoon alert's
      # 7-day window for its entire life, firing every renewal cycle.
      duration: 2160h
      renewBefore: 360h
  recommender:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 128Mi
        ephemeral-storage: 64Mi
  updater:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 100Mi
        ephemeral-storage: 64Mi

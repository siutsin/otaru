namespace: vpa

vertical-pod-autoscaler:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  admissionController:
    replicas: 1
    resources:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 58Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 67Mi
        ephemeral-storage: 64Mi
    mutatingWebhookConfiguration:
      failurePolicy: Ignore  # explicit chart default: never block pod creation
    certGen:
      enabled: false
    registerWebhook: false
    tls:
      create: false
    certManager:
      enabled: true
      createSelfSignedIssuer:
        enabled: true
      # 2026-07-27: chart defaults (duration 168h, renewBefore 24h) keep the
      # leaf cert inside the 7-day CertificateExpiringSoon alert window for
      # its whole life, firing every renewal cycle. 2160h/360h escapes it.
      duration: 2160h
      renewBefore: 360h
  recommender:
    replicas: 1
    # 2026-08-22: compiled-in defaults (--pod-recommendation-min-memory-mb=250,
    # --pod-recommendation-min-cpu-millicores=25) are a global floor that
    # overrides each VPA's own tuned minAllowed. Idle workloads (cyberchef,
    # jsoncrack, excalidraw, reloader, k8s-cleaner: usage 4-29Mi) were
    # clamped to ~250Mi despite a 32Mi minAllowed. Both flags set near zero
    # so each VPA's own minAllowed/maxAllowed rules.
    extraArgs:
      - --pod-recommendation-min-memory-mb=1
      - --pod-recommendation-min-cpu-millicores=1
    resources:
      # 2026-09-23: right-sized on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 78Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 92Mi
        ephemeral-storage: 64Mi
  updater:
    replicas: 1
    resources:
      # 2026-09-23: right-sized on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 73Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 87Mi
        ephemeral-storage: 64Mi

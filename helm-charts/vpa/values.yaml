namespace: vpa

vertical-pod-autoscaler:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  admissionController:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 100Mi
        ephemeral-storage: 64Mi
    mutatingWebhookConfiguration:
      failurePolicy: Ignore  # explicit chart default: never block pod creation
    certGen:
      enabled: false
    registerWebhook: false
    tls:
      create: false
    certManager:
      enabled: true
      createSelfSignedIssuer:
        enabled: true
      # 2026-07-27: chart default (duration: 168h, renewBefore: 24h) means
      # the leaf cert is always within the CertificateExpiringSoon alert's
      # 7-day window for its entire life, firing every renewal cycle.
      duration: 2160h
      renewBefore: 360h
  recommender:
    replicas: 1
    # 2026-08-22: the recommender's compiled-in defaults
    # (--pod-recommendation-min-memory-mb=250,
    # --pod-recommendation-min-cpu-millicores=25) are a global floor that
    # overrides every VPA's own tuned per-workload minAllowed. Idle
    # workloads (cyberchef, jsoncrack, excalidraw, reloader, k8s-cleaner --
    # real usage 4-29Mi) were all being clamped up to ~250Mi regardless of
    # their own minAllowed (32Mi). Set both flags near zero so each VPA's
    # own minAllowed/maxAllowed does the real work instead of this
    # one-size-fits-all default.
    extraArgs:
      - --pod-recommendation-min-memory-mb=1
      - --pod-recommendation-min-cpu-millicores=1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 128Mi
        ephemeral-storage: 64Mi
  updater:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 100Mi
        ephemeral-storage: 64Mi

labels:
  istio.io/dataplane-mode: ambient
  istio.io/use-waypoint: waypoint
  istio.io/use-waypoint-namespace: istio-waypoints
  istio.io/ingress-use-waypoint: "true"

namespaces:
  # Intentional: managed workload namespaces are enrolled in ambient mesh so
  # mTLS can be observed in PERMISSIVE mode before tightening enforcement.
  - name: argocd
  - name: blocky
  - name: browserless
  - name: cert-manager
  - name: changedetection
  - name: cloudflare-tunnel
  - name: cnpg-system
  - name: cyberchef
  - name: default
  - name: descheduler
  - name: excalidraw
  - name: external-secrets
  - name: falco
    ambient: false
  - name: firecrawl
  - name: hermes
  - name: home-assistant
  - name: httpbin
  - name: hydra
  - name: inference
  # This namespace is the mesh control plane and dataplane itself (istiod and ztunnel).
  - name: istio-system
    ambient: false
  - name: jellyfin
  - name: jsoncrack
  - name: jung2bot
  - name: jung2bot-dev
  - name: k8s-cleaner
  # The aggregated external metrics API calls the KEDA adapter direct at the pod IP, and that call fails through ambient.
  - name: keda
    ambient: false
  - name: kiali
  - name: kubernetes-mcp-server
  - name: kyverno
  # The admission webhook broke when this namespace was enrolled, and volume attaches failed.
  - name: longhorn-system
    ambient: false
  - name: monitoring
  - name: onepassword
  - name: playground
  - name: reloader
  - name: searxng
  # Connector and TUN pods build network paths with netfilter in the pod network namespace instead of using the network.
  - name: tailscale
    ambient: false
  - name: teslamate
  - name: trivy-operator
  - name: umami
  - name: unifi-mcp
  - name: vpa

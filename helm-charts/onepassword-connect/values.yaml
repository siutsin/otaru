vpa:
  enabled: true

_shared:
  # 2026-08-03: ephemeral-storage 64Mi -> 96Mi. 14d peak hit ~49.9Mi (78% of the old limit); live pod at 70.95%.
  # No evictions, but headroom was thin. VPA manages memory, not ephemeral-storage.
  resources: &resources
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 96Mi
    limits:
      memory: 64Mi
      ephemeral-storage: 96Mi
  preferredPodAntiAffinity: &preferredPodAntiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

connect:
  commonLabels:
    # Bootstrap dependency for External Secrets: bypass the namespace waypoint so secret sync works before mesh policy is ready.
    istio.io/use-waypoint: none
  connect:
    serviceAnnotations:
      mesh.otaru.io/non-ambient-endpoints: "true"
    podLabels:
      # Bootstrap secret backend: keep local API/sync peer traffic outside ambient interception.
      istio.io/dataplane-mode: none
    api:
      resources: *resources
    sync:
      resources: *resources
    affinity:
      <<: *preferredPodAntiAffinity
  operator:
    affinity:
      <<: *preferredPodAntiAffinity

vpa:
  enabled: true

_shared:
  # 2026-08-03: ephemeral-storage bumped 64Mi -> 96Mi. 14d peak across pod
  # history reached ~49.9Mi (78% of the old 64Mi limit); the live pod was
  # at 70.95%. No eviction history, but headroom was thin. Memory/cpu
  # unaffected -- VPA (enabled below) manages memory live and does not
  # control ephemeral-storage.
  resources: &resources
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 96Mi
    limits:
      memory: 64Mi
      ephemeral-storage: 96Mi
  preferredPodAntiAffinity: &preferredPodAntiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

connect:
  commonLabels:
    # External Secrets talks to 1Password Connect as a bootstrap dependency; bypass the namespace waypoint so secret sync works before mesh policy is ready.
    istio.io/use-waypoint: none
  connect:
    serviceAnnotations:
      mesh.otaru.io/non-ambient-endpoints: "true"
    podLabels:
      # 1Password Connect is a bootstrap secret backend; keep its local API/sync peer traffic outside ambient interception.
      istio.io/dataplane-mode: none
    api:
      resources: *resources
    sync:
      resources: *resources
    affinity:
      <<: *preferredPodAntiAffinity
  operator:
    affinity:
      <<: *preferredPodAntiAffinity

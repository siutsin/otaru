{{- if .Values.vpa.enabled }}
{{- $namespace := .Release.Namespace | default "onepassword" -}}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: onepassword-connect
  namespace: {{ $namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onepassword-connect
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      # 2026-10-23: memory floors sit above observed spike usage; the old 16Mi floor let the
      # target drop under live usage and kubelet rejected the in-place resize (ResizeError).
      - containerName: connect-api
        controlledResources: [memory]
        controlledValues: RequestsAndLimits
        minAllowed:
          memory: 80Mi
        maxAllowed:
          memory: 128Mi
      - containerName: connect-api
        controlledResources: [cpu]
        controlledValues: RequestsOnly  # this repo sets no cpu limits
        minAllowed:
          cpu: 1m
        maxAllowed:
          cpu: 50m
      - containerName: connect-sync
        controlledResources: [memory]
        controlledValues: RequestsAndLimits
        minAllowed:
          memory: 64Mi
        maxAllowed:
          memory: 128Mi
      - containerName: connect-sync
        controlledResources: [cpu]
        controlledValues: RequestsOnly  # this repo sets no cpu limits
        minAllowed:
          cpu: 1m
        maxAllowed:
          cpu: 50m
{{- end }}

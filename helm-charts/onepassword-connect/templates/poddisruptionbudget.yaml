{{- $namespace := .Release.Namespace | default "onepassword" -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: onepassword-connect
  namespace: {{ $namespace }}
spec:
  # 2026-07-26: repo-wide PDB audit; vendored chart has no native podDisruptionBudget option.
  minAvailable: 1
  selector:
    matchLabels:
      app: onepassword-connect

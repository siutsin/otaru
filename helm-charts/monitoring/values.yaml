alloy:
  image:
    repository: grafana/alloy
    # The digest goes in its own field, not in the tag: the chart builds
    # the app version label from the tag, and @sha256 makes it invalid.
    tag: v1.21.1
    digest: sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
  # 2026-10-13: Kyverno denied the Deployment because the chart default for
  # the reloader sidecar sets requests only; add limits and ephemeral-storage.
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 50Mi
        ephemeral-storage: 64Mi
  # Traces-only OTLP gateway: it needs no Kubernetes API access.
  rbac:
    create: false
  controller:
    type: deployment
    replicas: 1
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
  alloy:
    clustering:
      enabled: false
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      # 2026-10-13: initial sizing for a new workload, no baseline yet.
      # Right-size from Prometheus after a week of traces.
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 64Mi
    configMap:
      create: true
      content: |
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }

          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            traces = [otelcol.processor.transform.redact.input]
          }
        }

        // Strip query strings before storage: some services pass keys as
        // URL query parameters, and spans carry full URLs.
        otelcol.processor.transform "redact" {
          error_mode = "ignore"

          trace_statements {
            context = "span"
            statements = [
              "delete_key(attributes, \"url.query\")",
              "set(attributes[\"http.url\"], Split(attributes[\"http.url\"], \"?\")[0]) where attributes[\"http.url\"] != nil",
              "set(attributes[\"url.full\"], Split(attributes[\"url.full\"], \"?\")[0]) where attributes[\"url.full\"] != nil",
            ]
          }

          output {
            traces = [otelcol.processor.batch.default.input]
          }
        }

        otelcol.processor.batch "default" {
          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "monitoring-tempo.monitoring.svc.cluster.local:4317"

            tls {
              insecure = true
            }
          }
        }

tempo:
  tempo:
    repository: grafana/tempo
    tag: 3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    reportingEnabled: false
    retention: 168h
    resources:
      # 2026-10-13: initial sizing for a new workload, no baseline yet.
      # Right-size from Prometheus after a week of traces.
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 1Gi
        ephemeral-storage: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  persistence:
    enabled: true
    storageClassName: longhorn-crypto-global

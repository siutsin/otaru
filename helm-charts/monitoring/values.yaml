grafana:
  # 2026-07-25: no PDB existed, found during a repo-wide audit after
  # the same gap caused real outages for umami, home-assistant, and
  # prometheus-server the same day (see documentation/gotcha.md).
  podDisruptionBudget:
    minAvailable: 1
  # 2026-10-10: image 12.3.1 -> 12.3.6 for 8 trivy critical CVEs, incl.
  # CVE-2026-27876. Chart 10.5.15 is the latest release and still bundles
  # 12.3.1, so pin the image directly.
  image:
    repository: grafana/grafana
    tag: 13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
  resources:
    # Keep memory at 512Mi: dashboard use pushed Grafana against the 128Mi limit and caused probe failures.
    # ephemeral-storage 2026-07-06: 14d peak ~50Mi vs 64Mi limit (80.6% via ephemeral_storage_container_limit_percentage) -- bumped to 128Mi.
    # ephemeral-storage 2026-10-22: Grafana 13.2.4 startup writes (fresh SQLite
    # database, Bleve unified-storage index, bundled plugin extracts) pass 128Mi;
    # the kubelet evicted every pod within ~90s -- raised to 1Gi.
    # 2026-09-22: relax req==limit (user-approved). Steady use ~96Mi; keep
    # the 512Mi limit for dashboard bursts. Request 348Mi (2026-09-23: right-sized).
    requests:
      cpu: 50m
      memory: 348Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 512Mi
      ephemeral-storage: 1Gi
  downloadDashboards:
    resources: *smallResources
  initChownData:
    resources: *smallResources
  admin:
    existingSecret: grafana
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        # uid matches hardcoded dashboard targets (PBFA97CFB590B2093).
        # timeInterval must match the Prometheus scrape_interval (1m); at the
        # 15s default $__rate_interval collapses to ~1m and rate()/increase()
        # get <2 samples, so Activity/heatmap panels show "No data".
        - name: Prometheus
          type: prometheus
          uid: PBFA97CFB590B2093
          url: http://monitoring-prometheus-server.monitoring.svc.cluster.local
          isDefault: true
          jsonData:
            timeInterval: 1m
            httpMethod: POST
        - name: Loki
          type: loki
          uid: P8E80F9AEF21F6940
          url: http://monitoring-loki.monitoring.svc.cluster.local:3100
          jsonData:
            derivedFields:
              - name: TraceID
                matcherType: regex
                matcherRegex: '"trace_id":"([a-f0-9]+)"'
                url: '$${__value.raw}'
                datasourceUid: tempo
        - name: Tempo
          type: tempo
          uid: tempo
          url: http://monitoring-tempo.monitoring.svc.cluster.local:3200
          jsonData:
            tracesToLogsV2:
              datasourceUid: P8E80F9AEF21F6940
              spanStartTimeShift: -1h
              spanEndTimeShift: 1h
              filterByTraceID: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: ''
          allowUiUpdates: false
          options:
            path: /var/lib/grafana/dashboards

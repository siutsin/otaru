name: monitoring
namespace: monitoring

vpa:
  # 2026-09-23: recommendations only (updateMode Off in templates/vpa.yaml).
  # Stateful monitoring workloads must not be auto-evicted on resize;
  # recommendations feed the manual sizing PRs.
  enabled: true

# Longhorn Volume CR for the dynamically provisioned Prometheus PVC (name = bound PV).
# Lookup: kubectl -n monitoring get pvc monitoring-prometheus-server -o jsonpath='{.spec.volumeName}'
prometheusLonghornVolume:
  enabled: true
  name: pvc-429394f8-4469-42bd-913a-9952629d36d1
  numberOfReplicas: 2

# Lookup: kubectl -n monitoring get pvc storage-monitoring-loki-0 -o jsonpath='{.spec.volumeName}'
lokiLonghornVolume:
  enabled: true
  name: pvc-40c3f449-86c7-4d7f-83ec-0912076a2d7b
  numberOfReplicas: 2

_shared:
  smallResources: &smallResources
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi

httpRoutes:
  prometheus:
    service:
      name: monitoring-prometheus-server
      port: 80
  loki:
    service:
      name: monitoring-loki
      port: 3100
  grafana:
    service:
      name: monitoring-grafana
      port: 80

prometheus:
  scrapeConfigFiles:
    - /etc/prometheus/secrets/blackbox/blackbox-scrape-config.yml
  extraScrapeConfigs: |
    - job_name: k8s-ephemeral-storage-metrics
      static_configs:
        - targets:
            - k8s-ephemeral-storage-metrics.monitoring.svc.cluster.local:9100
    - job_name: loki
      static_configs:
        - targets:
            - monitoring-loki.monitoring.svc.cluster.local:3100
    - job_name: alloy
      static_configs:
        - targets:
            - monitoring-alloy.monitoring.svc.cluster.local:12345
    - job_name: tempo
      static_configs:
        - targets:
            - monitoring-tempo.monitoring.svc.cluster.local:3200
    # Endpoints discovery scrapes the pod directly, because the
    # metrics grant sits on the zot workload, not the Service.
    - job_name: zot
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - zot
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          regex: zot
          action: keep
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
  configmapReload:
    prometheus:
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
          ephemeral-storage: 64Mi
        limits:
          # 2026-10-10: 30d spike ~41.6Mi vs 45Mi limit (92.4% - OOM risk); limit -> 50Mi (ceil(spike*1.2)).
          # KRR 2026-10-12: 30d spike ~47.8Mi vs 50Mi limit (95.6% - OOM risk); limit -> 58Mi (ceil(spike*1.2)).
          memory: 58Mi
          ephemeral-storage: 64Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  server:
    image:
      repository: dhi.io/prometheus
      tag: 3.15.0@sha256:839c37b75b190fa24215bf9498bee570fd4276978aa13de44ceaf5108d1a8cde
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: blackbox-scrape-config
    # 2026-07-25: no PDB, so the descheduler evicted the sole
    # prometheus-server replica for HighNodeUtilization ~every 5 min for
    # over an hour (raspberrypi-03), never loading its TSDB -- live 503s.
    # Same fix as umami (#2917), home-assistant (#2918), and the
    # changedetection/teslamate/unifi-mcp bundle (#2919); the
    # subchart exposes PDB natively.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    resources:
      # KRR 2026-07-05: live peak ~3.16Gi working set; prior 3Gi bump (#2309) was still ~40Mi short.
      # KRR 2026-07-22: CPU CRITICAL -- 14d peak only ~155m against the 800m
      # request (series count grew, not compute cost); reduced to 200m.
      # KRR 2026-07-22 (reverted): bumped memory to 3840Mi for the WARNING
      # (14d peak ~3675Mi vs 3264Mi), but no node had that much free
      # requested-memory (nuc-00, least-committed, had ~3536Mi) --
      # FailedScheduling took prometheus down. Reverted to 3264Mi; real
      # headroom deferred to a later cycle.
      # KRR 2026-07-31: completing the deferred upsize (14d peak ~3730Mi).
      # Pod had relocated to raspberrypi-00 (~867Mi free, ~466Mi needed)
      # after overcommit/VPA changes freed headroom. Bumped to 3730Mi.
      # 2026-09-22: relax req==limit (user-approved). Steady use ~2092Mi;
      # 2026-09-23: right-size on 30d baseline; request 2652Mi, limit 4335Mi
      # (limit raised for retention growth).
      # 2026-10-08: 30d spike ~3974Mi vs 4335Mi limit (91.7% — OOM risk); limit -> 4770Mi (ceil(spike*1.2)).
      # KRR 2026-10-11: 30d spike ~4202.1Mi vs 4770Mi limit (88.1% — OOM risk, still climbing after the 2026-10-08 bump); limit -> 5043Mi (ceil(spike*1.2)). Request stays 2652Mi.
      requests:
        cpu: 200m
        memory: 2652Mi
        ephemeral-storage: 256Mi
      limits:
        memory: 5043Mi
        ephemeral-storage: 256Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    persistentVolume:
      size: 100Gi
      labels:
        recurring-job-group.longhorn.io/backup: enabled
        recurring-job-group.longhorn.io/trim: enabled
    # Live 2026-07-05: ~8.3GiB on disk at 7d retention (~1.2GiB/day). 30d ≈ 36GiB TSDB; 100GB cap matches PVC budget.
    retentionSize: 100GB
    retention: 30d
    extraSecretMounts:
      - name: blackbox-scrape-config
        mountPath: /etc/prometheus/secrets/blackbox
        secretName: blackbox-scrape-config
        readOnly: true
  alertmanager:
    enabled: true
    image:
      repository: dhi.io/alertmanager
      tag: 0.34.1@sha256:d2e254cd3d9848a14369fc020176d6a5776d1b52d67191fc764888f54ff91c20
    # 2026-07-25: no PDB existed, found during a repo-wide audit after
    # the same gap caused real outages for umami, home-assistant, and
    # prometheus-server the same day (see documentation/gotcha.md).
    podDisruptionBudget:
      minAvailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 35Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 39Mi
        ephemeral-storage: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    persistence:
      enabled: true
      size: 1Gi
    config:
      enabled: false
    # 2026-09-30: alertmanager subchart 2.0.0 (prometheus chart 29.33.0)
    # enables the config reloader by default. It watches /etc/alertmanager,
    # which does not exist here (config comes from the secret mount below),
    # so the sidecar exited 1 and crash-looped. It also has no
    # resources, which Kyverno flags. Restore the previous behaviour.
    configmapReload:
      enabled: false
    # Stakater Reloader restarts Alertmanager when the mounted secret or
    # templates ConfigMap changes, replacing the disabled sidecar.
    statefulSet:
      annotations:
        reloader.stakater.com/auto: "true"
    extraArgs:
      config.file: /etc/secrets/alertmanager/alertmanager.yml
    extraSecretMounts:
      - name: alertmanager-config
        mountPath: /etc/secrets/alertmanager
        secretName: alertmanager-telegram-config
        readOnly: true
    extraVolumes:
      - name: alertmanager-telegram-templates
        configMap:
          name: alertmanager-telegram-templates
    extraVolumeMounts:
      - name: alertmanager-telegram-templates
        mountPath: /etc/alertmanager/templates
        readOnly: true
  kube-state-metrics:
    image:
      # The subchart prints registry/repository:tag; registry defaults to
      # registry.k8s.io, so both must be set.
      registry: dhi.io
      repository: kube-state-metrics
      tag: 2.20.0@sha256:2e38c4477b3b8cd8b666d04814e05579dac29fadffcfeec309ef1fe911abd6c3
    # 2026-07-25: no PDB existed, found during a repo-wide audit after
    # the same gap caused real outages for umami, home-assistant, and
    # prometheus-server the same day (see documentation/gotcha.md).
    podDisruptionBudget:
      minAvailable: 1
    resources:
      # 2026-10-06: 30d p50 ~48Mi, spike ~93Mi; request 88Mi -> 54Mi, limit 112Mi unchanged.
      requests:
        cpu: 50m
        memory: 54Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 112Mi
        ephemeral-storage: 64Mi
  prometheus-node-exporter:
    # Required: image.tag carries a digest suffix, which is not valid semver
    # for the chart's version-gated args.
    version: "1.12.1"
    image:
      registry: dhi.io
      repository: node-exporter
      tag: 1.12.1@sha256:2bf73eace0e49be4c1c61f14e349b738fdd182fb63560b1e7ed6c7c6885236d8
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
        ephemeral-storage: 64Mi
      limits:
        # 2026-10-09: 30d spike ~31.5Mi vs 32Mi limit (98.4% — OOM risk); limit -> 38Mi (ceil(spike*1.2)).
        memory: 38Mi
        ephemeral-storage: 64Mi
  prometheus-pushgateway:
    image:
      repository: dhi.io/pushgateway
      tag: 1.11.4@sha256:34a2f94f817343520b5a377f56f4845a151bd7bab067f2007b819298e120f391
    # 2026-07-25: no PDB existed, found during a repo-wide audit after
    # the same gap caused real outages for umami, home-assistant, and
    # prometheus-server the same day (see documentation/gotcha.md).
    podDisruptionBudget:
      minAvailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 32Mi
        ephemeral-storage: 64Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  serverFiles:
    recording_rules.yml:
      groups:
        - name: workload-resource-usage
          interval: 30s
          rules:
            - record: namespace:workload_cpu_usage_cores:rate5m
              expr: |
                sum by (namespace) (
                  rate(container_cpu_usage_seconds_total{job="kubernetes-nodes-cadvisor", pod!="", container!="", container!="POD"}[5m])
                )
            - record: namespace:workload_memory_working_set_bytes:sum
              expr: |
                sum by (namespace) (
                  container_memory_working_set_bytes{job="kubernetes-nodes-cadvisor", pod!="", container!="", container!="POD"}
                )
            - record: pod:workload_cpu_usage_cores:rate5m
              expr: |
                sum by (namespace, pod) (
                  rate(container_cpu_usage_seconds_total{job="kubernetes-nodes-cadvisor", pod!="", container!="", container!="POD"}[5m])
                )
            - record: pod:workload_memory_working_set_bytes:sum
              expr: |
                sum by (namespace, pod) (
                  container_memory_working_set_bytes{job="kubernetes-nodes-cadvisor", pod!="", container!="", container!="POD"}
                )
        # ONZACK Standard Cluster Monitoring (grafana.com/dashboards/17404) recording rules.
        # Source: github.com/onzack/grafana-dashboards prometheus/recording-rules.
        # otaru adaptations: unlabeled nodes get role=worker; node-exporter job is kubernetes-service-endpoints.
        - name: onzack-cluster-common
          rules:
            - record: instance:kube_node_role
              expr: |
                (
                  topk by (node) (1,
                    max by (node, role) (
                      (kube_node_role{role="control-plane"} * 2)
                      OR
                      (kube_node_role{role!="control-plane"} * 1)
                    )
                    /
                    max by (node, role) (
                      (kube_node_role{role="control-plane"} * 2)
                      OR
                      (kube_node_role{role!="control-plane"} * 1)
                    )
                    * on(node) group_left(instance)
                    label_replace(node_uname_info, "node", "$1", "nodename", "(.*)")
                  )
                )
                OR
                (
                  label_replace(
                    (
                      group by (node) (kube_node_info)
                      unless on (node) group by (node) (kube_node_role)
                    )
                    * on(node) group_left(instance)
                    label_replace(node_uname_info, "node", "$1", "nodename", "(.*)"),
                    "role", "worker", "", ""
                  )
                )
        - name: onzack-cluster-cpu
          rules:
            - record: node_cpu_seconds_total:sum_rate5m
              expr: sum by (cpu,instance,node,role) (rate(node_cpu_seconds_total{mode!="idle"}[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: kube_node_status_capacity:cpu:sum
              expr: sum by (node,role) (kube_node_status_capacity{resource="cpu"} * on(node) group_left(role) instance:kube_node_role)
            - record: role:kube_node_status_capacity:cpu:avg
              expr: avg by (role) (kube_node_status_capacity{resource="cpu"} * on(node) group_left(role) instance:kube_node_role)
            - record: kube_node_status_allocatable:cpu:sum
              expr: sum by (node,role) (kube_node_status_allocatable{resource="cpu"} * on(node) group_left(role) instance:kube_node_role)
            - record: role:kube_node_status_allocatable:cpu:avg
              expr: avg by (role) (kube_node_status_allocatable{resource="cpu"} * on(node) group_left(role) instance:kube_node_role)
        - name: onzack-cluster-memory
          rules:
            - record: node_memory_MemUsed_bytes:sum
              expr: |
                sum by (instance,node,role) (
                  (
                    node_memory_MemTotal_bytes{job=~"kubernetes-service-endpoints|node-exporter"}
                    - node_memory_MemAvailable_bytes{job=~"kubernetes-service-endpoints|node-exporter"}
                  ) * on(instance) group_left(node,role) instance:kube_node_role
                )
            - record: kube_node_status_capacity:memory:sum
              expr: sum by (node,role) (kube_node_status_capacity{resource="memory"} * on(node) group_left(role) instance:kube_node_role)
            - record: role:kube_node_status_capacity:memory:avg
              expr: avg by (role) (kube_node_status_capacity{resource="memory"} * on(node) group_left(role) instance:kube_node_role)
            - record: kube_node_status_allocatable:memory:sum
              expr: sum by (node,role) (kube_node_status_allocatable{resource="memory"} * on(node) group_left(role) instance:kube_node_role)
            - record: role:kube_node_status_allocatable:memory:avg
              expr: avg by (role) (kube_node_status_allocatable{resource="memory"} * on(node) group_left(role) instance:kube_node_role)
        - name: onzack-cluster-storage
          rules:
            - record: node_disk_read_bytes_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_disk_read_bytes_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_disk_reads_completed_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_disk_reads_completed_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_disk_read_time_seconds_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_disk_read_time_seconds_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_disk_written_bytes_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_disk_written_bytes_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_disk_writes_completed_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_disk_writes_completed_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_disk_write_time_seconds_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_disk_write_time_seconds_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
        - name: onzack-cluster-network
          rules:
            - record: node_network_receive_bytes_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_network_receive_bytes_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_network_receive_packets_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_network_receive_packets_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_network_receive_drop_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_network_receive_drop_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_network_transmit_bytes_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_network_transmit_bytes_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_network_transmit_packets_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_network_transmit_packets_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
            - record: node_network_transmit_drop_total:sum_rate5m
              expr: sum by (instance,node,role) (rate(node_network_transmit_drop_total[5m]) * on(instance) group_left(node,role) instance:kube_node_role)
        - name: onzack-cluster-container
          rules:
            # cAdvisor on this cluster labels the node as `instance` (hostname), not `node`.
            # Map instance→node before joining instance:kube_node_role on(node).
            - record: container_cpu_usage_seconds_total:sum_rate5m:namespace
              expr: |
                sum by (namespace,node,role) (
                  label_replace(
                    rate(container_cpu_usage_seconds_total{container!="", container!="POD"}[5m]),
                    "node", "$1", "instance", "(.*)"
                  )
                  * on(pod, namespace) group_left() (kube_pod_status_phase{phase="Running"}==1)
                  * on(node) group_left(role) instance:kube_node_role
                )
            - record: container_memory_working_set_bytes:sum:namespace
              expr: |
                sum by (namespace,node,role) (
                  label_replace(
                    container_memory_working_set_bytes{container!="", container!="POD"},
                    "node", "$1", "instance", "(.*)"
                  )
                  * on(pod, namespace) group_left() (kube_pod_status_phase{phase="Running"}==1)
                  * on(node) group_left(role) instance:kube_node_role
                )
            - record: kube_pod_container_resource_requests:cpu:running:namespace
              expr: |
                sum by (namespace,node,role) (
                  kube_pod_container_resource_requests{resource="cpu"}
                  * on(pod, namespace) group_left() (kube_pod_status_phase{phase="Running"}==1)
                  * on(node) group_left(role) instance:kube_node_role
                )
            - record: kube_pod_container_resource_limits:cpu:running:namespace
              expr: |
                sum by (namespace,node,role) (
                  kube_pod_container_resource_limits{resource="cpu"}
                  * on(pod, namespace) group_left() (kube_pod_status_phase{phase="Running"}==1)
                  * on(node) group_left(role) instance:kube_node_role
                )
            - record: kube_pod_container_resource_requests:memory:running:namespace
              expr: |
                sum by (namespace,node,role) (
                  kube_pod_container_resource_requests{resource="memory"}
                  * on(pod, namespace) group_left() (kube_pod_status_phase{phase="Running"}==1)
                  * on(node) group_left(role) instance:kube_node_role
                )
            - record: kube_pod_container_resource_limits:memory:running:namespace
              expr: |
                sum by (namespace,node,role) (
                  kube_pod_container_resource_limits{resource="memory"}
                  * on(pod, namespace) group_left() (kube_pod_status_phase{phase="Running"}==1)
                  * on(node) group_left(role) instance:kube_node_role
                )
    alerting_rules.yml:
      groups:
        - name: cluster-health
          rules:
            - alert: DeploymentUnavailable
              expr: kube_deployment_status_replicas_unavailable > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                title: Deployment has unavailable replicas
                summary: "{{ $labels.deployment }} in {{ $labels.namespace }}"
                description: "{{ $value | humanize }} replica(s) have been unavailable for over 10 minutes. Check pod status and events."
            - alert: PodNotReady
              expr: kube_pod_status_ready{condition="true"} == 0 and on(namespace, pod) kube_pod_status_phase{phase="Running"} == 1
              for: 15m
              labels:
                severity: warning
              annotations:
                title: Pod stuck not ready
                summary: "{{ $labels.pod }} in {{ $labels.namespace }}"
                description: "The pod is running but failing readiness checks for over 15 minutes. Check container logs and probe settings."
            - alert: ScrapeTargetDown
              expr: up == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                title: Metrics scrape failing
                summary: "{{ $labels.job }} — {{ $labels.instance }}"
                description: "Prometheus has been unable to collect metrics from this target for over 10 minutes."
            - alert: NodeNotReady
              expr: kube_node_status_condition{condition="Ready",status="true"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                title: Cluster node not ready
                summary: "{{ $labels.node }}"
                description: "This node has been NotReady for over 5 minutes. Workloads on it may be evicted."
            - alert: CertificateExpiringSoon
              expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 24 * 3600
              for: 1h
              labels:
                severity: warning
              annotations:
                title: TLS certificate expiring soon
                summary: "{{ $labels.name }} in {{ $labels.namespace }}"
                description: "This certificate expires in less than 7 days. Plan renewal before it lapses."
            - alert: BlackboxProbeFailed
              expr: probe_success{job="blackbox-https"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                title: External endpoint health check failing
                summary: "{{ $labels.instance }}"
                description: "The HTTPS health probe has failed for over 5 minutes. Check the service, ingress, and TLS."
            # 2026-10-13: fluent-bit shipped zero lines for 3.5 days after an image swap and
            # nothing noticed — no loki_* series were scraped. Normal flow is ~80 lines/s
            # around the clock; the loki canary alone is ~6/s, so 20/s separates them.
            - alert: LokiIngestionStopped
              expr: sum(rate(loki_distributor_lines_received_total[30m])) < 20 or absent(loki_distributor_lines_received_total)
              for: 30m
              labels:
                severity: critical
              annotations:
                title: Log ingestion into Loki has stopped
                summary: "Loki is receiving almost no log lines"
                description: "Ingestion has been below 20 lines/s for over 30 minutes. Check the fluent-bit DaemonSet and the Loki pods."
            # Floor tuned from real data (2026-10-13): the quiet-period rate
            # is ~4 spans/s, so the first floor of 15 fired on a healthy
            # pipeline. 1 span/s still catches a full stop, with absent().
            - alert: TempoIngestionStopped
              expr: sum(rate(tempo_distributor_spans_received_total[30m])) < 1 or absent(tempo_distributor_spans_received_total)
              for: 30m
              labels:
                severity: critical
              annotations:
                title: Trace ingestion into Tempo has stopped
                summary: "Tempo is receiving almost no spans"
                description: "Ingestion has been below 1 span/s for over 30 minutes. Check the Alloy collector and the Tempo pods."
        - name: falco
          rules:
            - alert: FalcoRuleFired
              expr: sum by (rule_name) (increase(falcosecurity_falco_rules_matches_total[10m])) > 0
              labels:
                severity: warning
              annotations:
                title: Falco rule fired
                summary: "{{ $labels.rule_name }}"
                description: "The Falco rule {{ $labels.rule_name }} matched in the last 10 minutes. Search Loki for the rule name to find the pod and command."
        - name: zot
          rules:
            - alert: ZotPVCUsageHigh
              expr: kubelet_volume_stats_used_bytes{namespace="zot"} / kubelet_volume_stats_capacity_bytes{namespace="zot"} > 0.75
              for: 15m
              labels:
                severity: warning
              annotations:
                title: Zot registry volume above 75 percent full
                summary: "{{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }}"
                description: "The zot registry volume has been above 75 percent full for over 15 minutes. Check retention and volume growth."
            - alert: ZotPVCUsageCritical
              expr: kubelet_volume_stats_used_bytes{namespace="zot"} / kubelet_volume_stats_capacity_bytes{namespace="zot"} > 0.85
              for: 15m
              labels:
                severity: critical
              annotations:
                title: Zot registry volume above 85 percent full
                summary: "{{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }}"
                description: "The zot registry volume has been above 85 percent full for over 15 minutes. Expand the volume or tighten retention."
            # Guards: the 7-day offset term is empty until a full 7 days of
            # samples exist, and the 1-day term keeps a one-off step from
            # refiring as it ages through the window while usage is flat.
            - alert: ZotPVCStorageGrowth
              expr: |
                (
                  predict_linear(kubelet_volume_stats_used_bytes{namespace="zot"}[7d], 14 * 24 * 3600)
                  >
                  kubelet_volume_stats_capacity_bytes{namespace="zot"}
                )
                and on (namespace, persistentvolumeclaim)
                (
                  (kubelet_volume_stats_used_bytes{namespace="zot"} - kubelet_volume_stats_used_bytes{namespace="zot"} offset 7d) > 0
                )
                and on (namespace, persistentvolumeclaim)
                (
                  (kubelet_volume_stats_used_bytes{namespace="zot"} - kubelet_volume_stats_used_bytes{namespace="zot"} offset 1d) > 0
                )
              for: 1h
              labels:
                severity: warning
              annotations:
                title: Zot registry volume fills within 14 days at the current growth rate
                summary: "{{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }}"
                description: "The 7-day fit predicts a full zot registry volume within 14 days, and used bytes grew over both the last 7 days and the last day. Expand the volume or tighten retention."
            - alert: ZotDown
              expr: absent(up{job="zot", namespace="zot", service="zot"})
              for: 5m
              labels:
                severity: critical
              annotations:
                title: Zot registry scrape target missing
                summary: "zot in zot"
                description: "Prometheus has no scrape target for the zot service. Check the zot StatefulSet and service."
            # 2026-10-20: the gateway-wide 5xx ratio over 7 days is ~0.0073
            # percent, so 5 percent sits far above baseline. The rate floor
            # keeps low-traffic noise from firing the ratio.
            - alert: ZotErrorRateHigh
              expr: |
                (
                  sum(rate(zot_http_requests_total{namespace="zot", code=~"5.."}[10m]))
                  /
                  sum(rate(zot_http_requests_total{namespace="zot"}[10m]))
                ) > 0.05
                and
                sum(rate(zot_http_requests_total{namespace="zot"}[10m])) > 0.01
              for: 10m
              labels:
                severity: warning
              annotations:
                title: Zot registry error rate high
                summary: "zot in zot"
                description: "Over 5 percent of zot registry requests returned a 5xx response in the last 10 minutes. Check the zot pod logs."
            # 2026-10-20: the gateway exposes denied requests per listener
            # only, with no per-route label, and the baseline is ~2 denials
            # in 30 days across the whole gateway. Containerd falls back to
            # upstream when the route denies a pull, so denials here would
            # otherwise hide as a silent cache bypass.
            - alert: ZotRouteRequestsDenied
              expr: |
                sum(increase(envoy_http_rbac_denied{envoy_http_conn_manager_prefix="https-10443"}[15m])) >= 5
                or
                absent(envoy_http_rbac_denied{envoy_http_conn_manager_prefix="https-10443"})
              for: 5m
              labels:
                severity: warning
              annotations:
                title: Gateway denied requests above baseline
                summary: "internal gateway listener"
                description: "The internal gateway denied at least 5 requests in 15 minutes, or the denied-request series is missing. Check the zot route SecurityPolicy client CIDRs first."


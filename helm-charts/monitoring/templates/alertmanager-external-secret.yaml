apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-config
  namespace: {{ .Values.namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-secret-store
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        alertmanager.yml: |
          global:
            resolve_timeout: 5m
          templates:
            - '/etc/alertmanager/templates/*.tmpl'
          route:
            receiver: telegram
            group_by:
              - alertname
              - namespace
              - severity
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
          # A kernel OOM kill supersedes the low-memory warning on the
          # same node; both alerts describe the same memory incident.
          inhibit_rules:
            - source_matchers:
                - alertname = "NodeOOMKill"
              target_matchers:
                - alertname = "NodeMemoryAvailableLow"
              equal:
                - node
            # A NotReady node also explains its low-memory warning; the
            # node label keeps failures on other nodes visible.
            - source_matchers:
                - alertname = "NodeNotReady"
              target_matchers:
                - alertname = "NodeMemoryAvailableLow"
              equal:
                - node
            # A NotReady node explains a failed scrape of its own node
            # exporter; the service match leaves other scrape alerts alone.
            - source_matchers:
                - alertname = "NodeNotReady"
              target_matchers:
                - alertname = "ScrapeTargetDown"
                - service = "monitoring-prometheus-node-exporter"
              equal:
                - node
            # The critical Zot volume alert is the high alert at a higher
            # threshold; matching the claim prevents a duplicate warning.
            - source_matchers:
                - alertname = "ZotPVCUsageCritical"
              target_matchers:
                - alertname = "ZotPVCUsageHigh"
              equal:
                - namespace
                - persistentvolumeclaim
          receivers:
            - name: telegram
              telegram_configs:
                - bot_token: '{{`{{ .telegram_bot_token }}`}}'
                  chat_id: {{`{{ .telegram_chat_id }}`}}
                  message: '{{`{{ "{{" }} template "otaru.telegram.message" . {{ "}}" }}`}}'
                  send_resolved: true
                  parse_mode: HTML
  data:
    - secretKey: telegram_bot_token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        key: monitoring
        metadataPolicy: None
        property: ALERTMANAGER_TELEGRAM_BOT_TOKEN
    - secretKey: telegram_chat_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        key: monitoring
        metadataPolicy: None
        property: ALERTMANAGER_TELEGRAM_CHAT_ID

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-k8s-ephemeral-storage-metrics
  namespace: {{ .Release.Namespace }}
spec:
  # 2026-07-25: vendored k8s-ephemeral-storage-metrics has no native
  # podDisruptionBudget support (found during a repo-wide audit after the
  # same gap caused real outages for umami, home-assistant, and
  # prometheus-server -- see documentation/gotcha.md). Added in the parent
  # chart; patching the subchart would be overwritten by `helm dependency build`.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-ephemeral-storage-metrics
      app.kubernetes.io/instance: {{ .Release.Name }}

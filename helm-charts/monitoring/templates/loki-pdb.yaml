apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-loki
  namespace: {{ .Release.Namespace }}
spec:
  # 2026-07-25: vendored loki (grafana/loki) has no native podDisruptionBudget
  # support for any component. Found during a repo-wide audit after the same
  # gap caused real outages for umami, home-assistant, and prometheus-server
  # (see documentation/gotcha.md). Added in the parent chart; patching the
  # subchart would be overwritten by `helm dependency build`.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: single-binary

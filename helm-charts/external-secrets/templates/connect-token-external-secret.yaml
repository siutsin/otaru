{{- if .Values.integrations.clusterSecretStore }}
# Self-referential: ESO uses the current token in this Secret to
# authenticate to Connect, then overwrites it with the 1Password value.
# If the token is revoked, leaked, or expires externally, re-seed it manually
# (bootstrap docs: documentation/secrets.md, ansible/playbooks/k3s/004-bootstrap.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-connect-token
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-secret-store
  target:
    creationPolicy: Owner
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
        key: "1Password Token"
        metadataPolicy: None
        property: credential
      secretKey: token
{{- end }}

_shared:
  # 2026-09-23: each controller sized from its own 30d Prometheus baseline;
  # split from the old shared anchor. Right-size formula:
  # request=ceil(p50/0.9), limit=ceil(spike*1.2).
  operatorResources: &operatorResources
    requests:
      cpu: 50m
      memory: 67Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 133Mi
      ephemeral-storage: 64Mi
  webhookResources: &webhookResources
    # KRR 2026-09-27: 30d p50 35.4MiB (14d 35.4), max 131.9MiB — request 141MiB
    # never approached in 30d; lower to ceil(p50/0.9)=40MiB, limit 154MiB unchanged.
    # 2026-10-08: 30d spike ~148Mi vs 154Mi limit (96.4% — OOM risk); limit -> 179Mi (ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 40Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 179Mi
      ephemeral-storage: 64Mi
  certControllerResources: &certControllerResources
    requests:
      cpu: 50m
      memory: 92Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 147Mi
      ephemeral-storage: 64Mi
  preferredPodAntiAffinity: &preferredPodAntiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

integrations:
  clusterSecretStore: true

external-secrets:
  affinity:
    <<: *preferredPodAntiAffinity
  resources: *operatorResources
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  webhook:
    # 2026-07-12: one replica left zero redundancy for the validating
    # webhook during cluster-wide pod restarts ("no endpoints available").
    # Two replicas plus anti-affinity survives a single pod/node outage.
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    affinity:
      <<: *preferredPodAntiAffinity
    resources: *webhookResources
  certController:
    affinity:
      <<: *preferredPodAntiAffinity
    resources: *certControllerResources
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  global:
    affinity:
      <<: *preferredPodAntiAffinity

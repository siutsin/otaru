_shared:
  # 2026-09-23: the three controllers size on their own 30d Prometheus
  # baselines, split from the old shared anchor.
  operatorResources: &operatorResources
    # 2026-09-23: right-size (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 67Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 133Mi
      ephemeral-storage: 64Mi
  webhookResources: &webhookResources
    # 2026-09-23: right-size (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 141Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 154Mi
      ephemeral-storage: 64Mi
  certControllerResources: &certControllerResources
    # 2026-09-23: right-size (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 92Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 147Mi
      ephemeral-storage: 64Mi
  preferredPodAntiAffinity: &preferredPodAntiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

integrations:
  clusterSecretStore: true

external-secrets:
  affinity:
    <<: *preferredPodAntiAffinity
  resources: *operatorResources
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  webhook:
    # 2026-07-12: ArgoCD ExternalSecret syncs failed with "no endpoints
    # available for service external-secrets-webhook" during a night of
    # cluster-wide pod restarts -- a single replica has zero redundancy for
    # a validating webhook that gates every ExternalSecret apply. The
    # anti-affinity above already spreads replicas across nodes, so a
    # second replica gives real resilience against a single pod/node
    # disruption.
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    affinity:
      <<: *preferredPodAntiAffinity
    resources: *webhookResources
  certController:
    affinity:
      <<: *preferredPodAntiAffinity
    resources: *certControllerResources
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  global:
    affinity:
      <<: *preferredPodAntiAffinity

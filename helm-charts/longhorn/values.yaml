name: longhorn
namespace: longhorn-system

longhorn:
  longhornManager:
    serviceAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9500"
    # KRR 2026-07-10: peak ~115m cpu / 403Mi mem over 14d; was unset.
    # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    resources:
      requests:
        cpu: 150m
        memory: 250Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 528Mi
        ephemeral-storage: 64Mi
  preUpgradeChecker:
    jobEnabled: false
  persistence:
    defaultClass: false
    # No PVC references this class -- everything uses longhorn-crypto-global.
    createStorageClass: false
  defaultSettings:
    allowCollectingLonghornUsageMetrics: false
    defaultReplicaCount: 2
    replicaSoftAntiAffinity: false
    replicaAutoBalance: best-effort
    storageReservedPercentageForDefaultDisk: "0"
    snapshotMaxCount: "250"
    autoCleanupSnapshotWhenDeleteBackup: true
    # Kyverno require-workload-resources (background scan) flagged these
    # system-managed CSI components as missing memory and ephemeral-storage
    # requests/limits. longhorn-manager creates them directly, so this
    # Longhorn Setting (JSON keyed by component name) is the only supported
    # way to size them. No KRR data yet, so lightweight sidecars reuse the
    # gateway chart's shutdown-manager size; longhorn-csi-plugin (does actual
    # mount/format work) gets more.
    # 2026-07-11 incident: longhorn-csi-plugin OOMKilled (exit 137) through
    # seven bumps, 64Mi -> 2Gi. Dead end: Longhorn has no setting to throttle
    # concurrent mounts (only replica-rebuild, backup, engine-upgrade
    # concurrency limits) and no per-volume memory formula (upstream issues
    # longhorn/longhorn#12225 and #6645). Actual mechanism: every jellyfin
    # PVC uses LUKS with the argon2i KDF; `cryptsetup luksDump` shows
    # `Memory: 66264` (~65MiB) per unlock, so 13 concurrent unlocks cost
    # ~845MiB on one node. Measured floor, not a guess -- limit set to 4Gi.
    # Requests decoupled from limits on purpose: nodes already run at 91-99%
    # memory requests committed, so reserving 512Mi as a request on every
    # node (DaemonSet x 5) blocked scheduling elsewhere (teslamate CNPG
    # replica: "0/5 nodes available: 5 Insufficient memory"). Steady-state is
    # ~11-22Mi, so a limit-only ceiling costs nothing in steady-state
    # reservation. Confirmed with the user; departs from this repo's usual
    # requests-equal-limits convention.
    # right-sizing 2026-08-06: ephemeral-storage 32Mi -> 48Mi on the
    # longhorn-csi-plugin DaemonSet pod's three containers. Prometheus showed
    # ~23.55Mi peak over 14d on raspberrypi-03 (73% of the old 32Mi limit);
    # the exporter reports pod-level usage only, so the true per-container
    # split is unknown -- bumped conservatively.
    systemManagedCSIComponentsResourceLimits: >-
      {"csi-attacher":{"requests":{"cpu":"10m","memory":"32Mi","ephemeral-storage":"32Mi"},"limits":{"memory":"32Mi","ephemeral-storage":"32Mi"}},
      "csi-provisioner":{"requests":{"cpu":"10m","memory":"32Mi","ephemeral-storage":"32Mi"},"limits":{"memory":"32Mi","ephemeral-storage":"32Mi"}},
      "csi-resizer":{"requests":{"cpu":"10m","memory":"32Mi","ephemeral-storage":"32Mi"},"limits":{"memory":"32Mi","ephemeral-storage":"32Mi"}},
      "csi-snapshotter":{"requests":{"cpu":"10m","memory":"32Mi","ephemeral-storage":"32Mi"},"limits":{"memory":"32Mi","ephemeral-storage":"32Mi"}},
      "longhorn-csi-plugin":{"requests":{"cpu":"25m","memory":"64Mi","ephemeral-storage":"48Mi"},"limits":{"memory":"4Gi","ephemeral-storage":"48Mi"}},
      "node-driver-registrar":{"requests":{"cpu":"10m","memory":"32Mi","ephemeral-storage":"48Mi"},"limits":{"memory":"32Mi","ephemeral-storage":"48Mi"}},
      "longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi","ephemeral-storage":"48Mi"},"limits":{"memory":"32Mi","ephemeral-storage":"48Mi"}}}
  defaultBackupStore:
    backupTarget: ~
    backupTargetCredentialSecret: b2-secret

encryption:
  secretName: longhorn-crypto

backup:
  secretName: b2-secret

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  maxReplicas: {{ .Values.autoscaling.max }}
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 70
          type: Utilization
      type: Resource
    - resource:
        name: memory
        # 2026-07-30: fixed AverageValue so the memory-only VPA can adjust the
        # request without moving this trigger. 90Mi matches the old 70%-of-128Mi target.
        target:
          type: AverageValue
          averageValue: 90Mi
      type: Resource
  minReplicas: {{ .Values.autoscaling.min }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}

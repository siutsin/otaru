name: jsoncrack
namespace: jsoncrack

# VPA 2026-07-30: memory-only. 7d usage was 5-9Mi vs a 128Mi request, no incident history.
# CPU stays with the HPA (min=max=1, so it never scales out).
# Memory trigger moved to AverageValue (see hpa.yaml) to decouple it from the VPA-adjusted request -- blocky's HPA needed the same fix.
vpa:
  enabled: true

deployment:
  image:
    repository: ghcr.io/siutsin/images/jsoncrack
    tag: v5.0.0-beta.1-202603220524@sha256:3d02240d763308a6aed3420fb61ead942184990f2b80fbda0ba2e11a9f757a88
  ports:
    http: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 100Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 100Mi

service:
  port: 8080
  targetPort: 8080

autoscaling:
  min: 1
  max: 1

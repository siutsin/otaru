vpa:
  enabled: true

descheduler:
  kind: Deployment
  resources:
    # KRR 2026-07-05: live peak ~100Mi working set; 256Mi request was never approached.
    # KRR 2026-07-18: 14d peak ~10m CPU / ~100Mi memory (both GOOD, safe
    # downsize). KRR also flags the 500m CPU limit as unnecessary, but it is
    # inherited from the vendored chart's own default (this file never sets
    # it) and a plain values.yaml `null` does not remove a subchart-default
    # key on merge (confirmed via `helm template`) -- left as is rather than
    # fighting the chart with a hackier override.
    requests:
      cpu: 10m
      memory: 100Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 100Mi
      ephemeral-storage: 64Mi
  deschedulerPolicy:
    profiles:
      - name: default
        pluginConfig:
          - name: DefaultEvictor
            args:
              podProtections:
                defaultDisabled:
                  - PodsWithLocalStorage
          - name: RemovePodsHavingTooManyRestarts
            args:
              podRestartThreshold: 100
              includingInitContainers: true
          # Added 2026-07-14: repave Deployment-owned pods every 2 days so
          # they periodically pick up node patches and don't accumulate
          # slow memory creep. Scoped to ReplicaSet-owned pods only (a
          # Deployment-managed pod's immediate ownerReference kind is
          # ReplicaSet, not Deployment) so CronJob/Job pods, StatefulSets
          # (CNPG, Longhorn), and DaemonSets are never touched by this.
          - name: PodLifeTime
            args:
              maxPodLifeTimeSeconds: 172800 # 2 days
              states:
                - Running
              ownerKinds:
                include:
                  - ReplicaSet
          - name: LowNodeUtilization
            args:
              thresholds:
                cpu: 20
                memory: 20
                pods: 20
              targetThresholds:
                cpu: 50
                memory: 50
                pods: 50
        plugins:
          balance:
            enabled:
              - LowNodeUtilization
          deschedule:
            enabled:
              - RemovePodsHavingTooManyRestarts
              - PodLifeTime
      # Added 2026-07-13: LowNodeUtilization is a no-op when every node sits
      # above its 50% targetThreshold at once (our steady state -- all 5
      # nodes run 83-97% memory requests), since it needs an already-
      # underutilized node to land evicted pods on. HighNodeUtilization
      # solves the actual problem this cluster hits: combined free memory
      # exists (~2-3GiB) but is spread too thin across all 5 nodes for a
      # single multi-container pod's request to fit anywhere (confirmed
      # live: teslamate-verify-pitr's 2Gi combined request failed to
      # schedule despite nuc-00 alone showing ~1GiB free). This
      # consolidates lightly-loaded nodes' pods onto busier ones, growing
      # contiguous free space on whichever node is currently least
      # utilized (usually nuc-00) instead of leaving slack scattered.
      # HighNodeUtilization and LowNodeUtilization cannot share one
      # profile (opposite goals), hence the separate profile here.
      - name: consolidate
        pluginConfig:
          - name: DefaultEvictor
            args:
              podProtections:
                defaultDisabled:
                  - PodsWithLocalStorage
              # matchExpressions are ANDed: a pod must match every entry
              # to be eligible for eviction under this profile.
              # 2026-07-20: blocky (DNS-critical) -- evicted every ~5 min from raspberrypi-00, the only node under 90%; rescheduled straight back.
              # evict:"false" annotation tried first: checks presence not value (#1659), no effect; labelSelector is an allow-list, so this is the mechanism.
              # 2026-08-26: teslamate-verify-pg-dump -- evicted mid-run 5/5, backoffLimit exhausted; short-lived batch Job.
              # 2026-08-27: teslamate-verify-pitr -- same loop as pg-dump, evicted mid-restore.
              # 2026-09-06: cnpg.io/podRole=instance (teslamate, umami, hydra) -- evicted every ~5 min 19:05-20:15 UTC; rescheduled straight back, thrashing volume detach/attach.
              # 2026-09-08: openclaw -- evicted every ~5 min for 40+ min; single replica stuck in Init on Multi-Attach, app down.
              # 2026-09-15: envoy -- evicted every ~5 min for 1h+ (12 evictions); gateway VIP, churn costs more than the packing it buys.
              # 2026-09-22: Longhorn CSI control-plane -- evicted every ~5 min for 30+ min (28 events); churn on storage control plane costs more than the packing it buys.
              # 2026-09-22: jung2bot -- evicted every ~5 min; 100m/64Mi frees ~0.8%, never under the 90% threshold.
              # 2026-09-24: httpbin -- evicted every ~5 min for 60+ min (12 events); 100m/61Mi frees ~1%, never under threshold.
              # 2026-09-25: argocd-server -- evicted every ~5 min for 60+ min (12 events); 100m/117Mi frees ~1%, never under threshold.
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: NotIn
                    values:
                      - blocky
                      - openclaw
                      - teslamate-verify-pg-dump
                      - teslamate-verify-pitr
                      - envoy
                      - jung2bot
                      - httpbin
                      - argocd-server
                  - key: app
                    operator: NotIn
                    values:
                      - csi-attacher
                      - csi-provisioner
                      - csi-resizer
                      - csi-snapshotter
                  - key: cnpg.io/podRole
                    operator: NotIn
                    values:
                      - instance
          - name: HighNodeUtilization
            args:
              thresholds:
                cpu: 100
                memory: 90
                pods: 100
        plugins:
          balance:
            enabled:
              - HighNodeUtilization
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname

{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: descheduler
  namespace: descheduler
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: descheduler
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: descheduler
        controlledResources: [memory]
        controlledValues: RequestsAndLimits
        minAllowed:
          # VPA repeatedly attempted a 47Mi in-place downsize while the Pod used ~74Mi,
          # producing ResizeError events. Keep the established 100Mi KRR guardrail.
          # The matching Deployment request and limit are both 100Mi.
          memory: 100Mi
        maxAllowed:
          memory: 128Mi
      - containerName: descheduler
        controlledResources: [cpu]
        controlledValues: RequestsOnly  # this repo sets no cpu limits
        minAllowed:
          cpu: 1m
        maxAllowed:
          cpu: 50m
{{- end }}

{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: descheduler
  namespace: descheduler
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: descheduler
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        controlledResources: [memory]
        controlledValues: RequestsAndLimits
        minAllowed:
          memory: 16Mi
        maxAllowed:
          memory: 128Mi
{{- end }}

namespace: metallb-system

metallb:
  _speakerResources: &speakerResources
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi
  _speakerMainResources: &speakerMainResources
    # 2026-09-23: right-size the main speaker container on 30d Prometheus
    # baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)); sidecars keep
    # the shared anchor at 128/128.
    # 2026-10-08: 30d spike ~92Mi vs 94Mi limit (98.2% — OOM risk); limit -> 111Mi (ceil(spike*1.2)).
    requests:
      cpu: 50m
      memory: 66Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 111Mi
      ephemeral-storage: 64Mi
  # No BGP peers configured (L2Advertisement only) -- BGP backend unused.
  frrk8s:
    enabled: false
  speaker:
    resources: *speakerMainResources
    frr:
      resources: *speakerResources
    reloader:
      resources: *speakerResources
    frrMetrics:
      resources: *speakerResources
    initContainers:
      cpFrrFiles:
        resources: *speakerResources
      cpReloader:
        resources: *speakerResources
      cpMetrics:
        resources: *speakerResources
  controller:
    resources:
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      # 2026-10-08: 30d spike ~151Mi vs 153Mi limit (98.5% — OOM risk); limit -> 181Mi (ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 136Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 181Mi
        ephemeral-storage: 64Mi

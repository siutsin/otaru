apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  # 2026-07-24: no PDB let the descheduler evict the sole replica four times
  # for HighNodeUtilization in 25 minutes on nuc-00 (12:20, 12:25, 12:30,
  # 12:45 UTC); each restart's startup probe was still failing when the next
  # eviction hit -- a real ~25min outage. Same single-replica pattern as
  # helm-charts/umami/templates/pdb.yaml and helm-charts/jung2bot/templates/pdb.yaml.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}

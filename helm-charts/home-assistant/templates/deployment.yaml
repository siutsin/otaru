{{- $version := regexReplaceAll "@sha256:.*$" .Values.deployment.image.tag "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/version: {{ $version | quote }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/version: {{ $version | quote }}
    spec:
      {{- if .Values.deployment.affinity }}
      affinity: {{ toYaml .Values.deployment.affinity | nindent 8 }}
      {{- end }}
      initContainers:
        - name: seed-config-includes
          image: "{{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}"
          command:
            - /bin/sh
            - -ec
          args:
            - |
              for f in automations.yaml scripts.yaml scenes.yaml; do
                if [ ! -e "/config/$f" ]; then
                  printf '%s\n' '[]' > "/config/$f"
                fi
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            # One-shot write of missing include files. Memory request equals
            # limit. No CPU limit.
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 32Mi
              ephemeral-storage: 32Mi
          volumeMounts:
            - mountPath: /config
              name: config
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}"
          # No runAsNonRoot: the image's s6-overlay init needs root (verified
          # locally: it fails as non-root with "unable to setgid to root" /
          # "unable to mkdir /run/s6"). allowPrivilegeEscalation false and dropped
          # capabilities stay on top of root; confirmed the container still starts
          # and serves HTTP.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # https://www.home-assistant.io/installation/linux#optimizations
            - name: DISABLE_JEMALLOC
              value: "true"
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: coap
              containerPort: 5683
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 10
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /config/configuration.yaml
              name: configuration
              subPath: configuration.yaml
          resources:
            # 2026-10-29: after a restart the pod was OOMKilled (exit 137) four times in a
            # row on ai-00. Startup needs ~385Mi (python3 anon ~314Mi + file ~70Mi), above
            # the old 320Mi limit, so it only stayed up once VPA resized it in place.
            # Sizing script, 30d: p50 327Mi, max 403Mi, so request = ceil(327/0.9) = 364Mi
            # and limit = ceil(403*1.2) = 484Mi. The limit is what covers the ~385Mi startup
            # peak. VPA still tunes both within 128Mi to 512Mi.
            requests:
              cpu: "50m"
              memory: "364Mi"
              ephemeral-storage: "100Mi"
            limits:
              memory: "484Mi"
              ephemeral-storage: "100Mi"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config-pvc
        - name: configuration
          configMap:
            name: configuration

{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Values.name }}
        controlledResources: [memory]
        controlledValues: RequestsAndLimits
        minAllowed:
          memory: 128Mi
        maxAllowed:
          # 2026-09-23: recommender uncappedTarget ~363Mi (lowerBound ~309Mi,
          # close to the 320Mi limit) -- usage outgrew the July KRR sizing.
          memory: 512Mi
      - containerName: {{ .Values.name }}
        controlledResources: [cpu]
        controlledValues: RequestsOnly  # this repo sets no cpu limits
        minAllowed:
          cpu: 10m
        maxAllowed:
          cpu: 100m
{{- end }}

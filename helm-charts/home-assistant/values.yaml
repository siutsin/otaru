name: home-assistant
namespace: home-assistant

# VPA 2026-07-30: onboarded after a steady-state check (7d avg/max ~223/234Mi,
# no incident history, no periodic-spike shape, no OOM history).
vpa:
  enabled: true

ip: 192.168.10.51

deployment:
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: home-assistant
            topologyKey: kubernetes.io/hostname
  image:
    repository: ghcr.io/home-assistant/home-assistant
    tag: 2026.10.3@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f

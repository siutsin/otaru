name: home-assistant
namespace: home-assistant

# VPA 2026-07-30: onboarded after a steady-state check (7d avg/max ~223/234Mi,
# no incident history, no periodic-spike shape, no OOM history).
vpa:
  enabled: true

ip: 192.168.10.51

deployment:
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: home-assistant
            topologyKey: kubernetes.io/hostname
  image:
    repository: ghcr.io/home-assistant/home-assistant
    tag: 2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4

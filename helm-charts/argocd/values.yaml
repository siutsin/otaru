namespace: argocd
integrations:
  externalSecrets: true

argo-cd:
  global:
    addPrometheusAnnotations: true
  _shared:
    controllerResources: &controllerResources
      # Limit 2Gi: sync spikes queue many repo comparisons on the one
      # controller pod, so extra replicas do not cut its peak memory.
      #
      # 2026-07-30 (overcommit): request 1280Mi, ~40% above the 7d/14d
      # working-set peak of ~909Mi. Wider margin because this pod runs
      # replicas: 1: an eviction stalls GitOps reconciliation for all
      # Applications until it reschedules and rebuilds its full watch cache.
      # Limit stays 2Gi so OOM-kill protection on a real sync-spike is
      # unchanged (governed by the limit, not the request).
      # 2026-09-23: right-size request on 30d Prometheus baseline (request=ceil(p50/0.9)); limit stays 2Gi.
      requests:
        cpu: 250m
        memory: 736Mi
        ephemeral-storage: 256Mi
      limits:
        memory: 2Gi
        ephemeral-storage: 256Mi
    # 2026-09-23: server and applicationset-controller are split out of the
    # old shared anchor and sized on their own 30d Prometheus baselines.
    serverResources: &serverResources
      # 2026-09-23: right-size (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 100m
        memory: 117Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 149Mi
        ephemeral-storage: 128Mi
    applicationsetControllerResources: &applicationsetControllerResources
      # 2026-09-23: right-size (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 100m
        memory: 109Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 153Mi
        ephemeral-storage: 128Mi
    redisResources: &redisResources
      # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 67Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 100Mi
        ephemeral-storage: 64Mi
    readinessProbe: &readinessProbe
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    livenessProbe: &livenessProbe
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    singletonPdb: &singletonPdb
      enabled: true
      minAvailable: 1
    haPdb: &haPdb
      enabled: true
      maxUnavailable: 1
  configs:
    cm:
      url: https://argocd.internal.siutsin.com/argocd/
    secret:
      createSecret: false
    params:
      # Keep repo-server concurrency bounded; Helm renders can spike memory during cold-cache bursts.
      reposerver.parallelism.limit: 2
      # Allow cold-cache manifest generation queues to drain before controllers mark comparison as Unknown.
      controller.repo.server.timeout.seconds: 180
      # Ambient HBONE encrypts east-west traffic; app-layer TLS on repo-server:8081 conflicts
      # with waypoint interception and caused handshake EOF when argocd-repo-server-tls existed.
      reposerver.disable.tls: true
      controller.repo.server.plaintext: true
      server.repo.server.plaintext: true
      applicationsetcontroller.repo.server.plaintext: true
      server.repo.server.timeout.seconds: 180
      applicationsetcontroller.repo.server.timeout.seconds: 180
      server.insecure: true
      server.basehref: /argocd/
      server.rootpath: /argocd
    cmp:
      create: true
      plugins:
        jsonnet-with-secret:
          discover:
            fileName: manifest.jsonnet
          generate:
            command:
              - jsonnet
            args:
              - --yaml-stream
              - manifest.jsonnet
              - --ext-str
              - AWS_ACCOUNT_ID
              - --ext-str
              - CNPG_BACKUP_BUCKET
              - --ext-str
              - CNPG_BACKUP_ENDPOINT
              - --ext-str
              - LONGHORN_BACKUP_TARGET
              - --ext-str
              - HOME_ASSISTANT_VOLUME_FROM_BACKUP
              - --ext-str
              - OPENCLAW_CONTROL_UI_HOSTNAME
  dex:
    enabled: false
  notifications:
    enabled: false
  controller:
    replicas: 1
    metrics:
      enabled: true
    resources: *controllerResources
    readinessProbe: *readinessProbe
    pdb: *singletonPdb
  server:
    metrics:
      enabled: true
    autoscaling:
      enabled: true
      minReplicas: 2
    resources: *serverResources
    readinessProbe: *readinessProbe
    livenessProbe: *livenessProbe
    pdb: *haPdb
  applicationSet:
    metrics:
      enabled: true
    resources: *applicationsetControllerResources
    readinessProbe:
      <<: *readinessProbe
      enabled: true
    livenessProbe:
      <<: *livenessProbe
      enabled: true
    pdb: *singletonPdb
  redis:
    resources: *redisResources
    pdb: *singletonPdb
    secretInit:
      enabled: false
  repoServer:
    # 2026-08-13: argo-cd 10.2.3+ defaults --client-ca-path to a non-empty
    # path (/app/config/reposerver/mtls/client-ca.crt) even with no mTLS
    # secret, and repo-server rejects it together with --disable-tls
    # outright (argoproj/argo-cd#26715): CrashLoopBackOff on every pod.
    # Tried and failed: ARGOCD_REPO_SERVER_CLIENT_CA_PATH="" env var does
    # NOT work and caused a live CrashLoopBackOff after merge --
    # util/env.StringFromEnv drops empty values, so "" silently falls back
    # to the non-empty default (upstream's own
    # argocd-cmd-params-cm.yaml example has the same bug). Only an explicit
    # CLI flag works, since pflag treats a passed argument as authoritative.
    extraArgs:
      - --client-ca-path=
    metrics:
      enabled: true
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      metrics:
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
    # KRR 2026-07-12: 14d peak 380Mi vs 768Mi request/limit (WARNING, ~2x
    # headroom); downsized to 512Mi, ~35% margin over peak for cold-cache
    # render spikes (see reposerver.parallelism.limit above).
    # KRR 2026-07-18: PR #2842 removed the arm64 nodeSelector (mispinned
    # digest fixed), so applied the 1678m CPU rec: nuc-00 at 47% CPU
    # requests (2115m free of 4000m), RollingUpdate surge peaks ~3563m/4000m
    # (89%).
    # 2026-07-18 hotfix: 1678m stopped fitting within hours (nuc-00 free CPU
    # fell to ~363m; pod Pending 80+ min on FailedScheduling). Reduced to
    # 700m, fits on raspberrypi-00/01/03 (~800-965m free each).
    # 2026-09-22: relaxed req==limit (user-approved). Request 170Mi (spiky,
    # live ~88Mi; 14d KRR peak 380Mi covered by the 512Mi limit).
    # 2026-09-23: right-sized on 30d Prometheus baseline (request=ceil(p50/0.9)).
    resources:
      requests:
        cpu: 700m
        memory: 170Mi
        ephemeral-storage: 512Mi
      limits:
        memory: 512Mi
        ephemeral-storage: 512Mi
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    pdb: *singletonPdb
    containerSecurityContext:
      runAsUser: 999
    rbac:
      - apiGroups:
          - ""
        resources:
          - secrets
        verbs:
          - get
        resourceNames:
          - argocd-jsonnet-secret
    initContainers:
      - name: wait-for-secret
        image: alpine/kubectl:1.36.4@sha256:a2cd8ee034cbe04d651e565b3373299b31921de5c2af86490559e21b3e197808
        command:
          - /bin/sh
          - -c
          - |
            echo "Waiting for secret argocd-jsonnet-secret..."
            until kubectl get secret argocd-jsonnet-secret -n argocd; do
              echo "Secret not found, retrying in 5 seconds..."
              sleep 5
            done
            echo "Secret argocd-jsonnet-secret found!"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsUser: 1000
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 64Mi
            ephemeral-storage: 64Mi
    extraContainers:
      - name: jsonnet-with-secret
        env:
          - name: AWS_ACCOUNT_ID
            valueFrom:
              secretKeyRef:
                name: argocd-jsonnet-secret
                key: AWS_ACCOUNT_ID
          - name: CNPG_BACKUP_BUCKET
            valueFrom:
              secretKeyRef:
                name: argocd-jsonnet-secret
                key: CNPG_BACKUP_BUCKET
          - name: CNPG_BACKUP_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: argocd-jsonnet-secret
                key: CNPG_BACKUP_ENDPOINT
          - name: LONGHORN_BACKUP_TARGET
            valueFrom:
              secretKeyRef:
                name: argocd-jsonnet-secret
                key: LONGHORN_BACKUP_TARGET
          - name: HOME_ASSISTANT_VOLUME_FROM_BACKUP
            valueFrom:
              secretKeyRef:
                name: argocd-jsonnet-secret
                key: HOME_ASSISTANT_VOLUME_FROM_BACKUP
          - name: OPENCLAW_CONTROL_UI_HOSTNAME
            valueFrom:
              secretKeyRef:
                name: argocd-jsonnet-secret
                key: OPENCLAW_CONTROL_UI_HOSTNAME
        command:
          - /var/run/argocd/argocd-cmp-server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 999
        image: ghcr.io/siutsin/images/go-jsonnet:v0.22.0@sha256:a038fd5585c30591a0c06f815a0888f32c6f6606a72bb5331f8e208177586206
        resources:
          # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
          requests:
            cpu: 100m
            memory: 75Mi
            # 2026-07-06: 14d pod peak ~286Mi exceeded the 256Mi limit (96.6%);
            # bumped to 512Mi for headroom.
            ephemeral-storage: 512Mi
          limits:
            memory: 117Mi
            ephemeral-storage: 512Mi
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: jsonnet-with-secret.yaml
            name: argocd-cmp-cm
          - mountPath: /tmp
            name: cmp-tmp
    volumes:
      - name: argocd-cmp-cm
        configMap:
          name: argocd-cmp-cm
      - name: cmp-tmp
        emptyDir: {}

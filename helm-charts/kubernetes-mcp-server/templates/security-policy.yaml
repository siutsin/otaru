{{- if .Values.authentication.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Values.name }}-authentication
  namespace: {{ .Values.namespace }}
spec:
  # Envoy Gateway can bypass a Service-attached ambient waypoint; enforce JWTs
  # on the HTTPRoute. Istio AuthorizationPolicy stays defence-in-depth.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.name }}-internal
  jwt:
    providers:
      - name: hydra
        issuer: {{ .Values.authentication.issuer | quote }}
        remoteJWKS:
          cacheDuration: 300s
          uri: {{ .Values.authentication.jwksUri | quote }}
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-mcp-client
        action: Allow
        principal:
          jwt:
            provider: hydra
            scopes:
              {{- toYaml .Values.authentication.requiredScopes | nindent 14 }}
            claims:
              - name: sub
                valueType: String
                values:
                  {{- toYaml .Values.authentication.allowedSubjects | nindent 18 }}
{{- end }}

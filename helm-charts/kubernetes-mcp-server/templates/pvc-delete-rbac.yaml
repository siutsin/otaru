{{- range .Values.pvcDeleteNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-pvc-delete
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-pvc-delete
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-server
    namespace: kubernetes-mcp-server
roleRef:
  kind: Role
  name: mcp-pvc-delete
  apiGroup: rbac.authorization.k8s.io
{{- end }}

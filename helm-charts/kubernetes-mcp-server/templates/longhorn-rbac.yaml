{{- range .Values.longhornNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-longhorn-patch
  namespace: {{ . }}
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "engines"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-longhorn-patch
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-server
    namespace: kubernetes-mcp-server
roleRef:
  kind: Role
  name: mcp-longhorn-patch
  apiGroup: rbac.authorization.k8s.io
{{- end }}

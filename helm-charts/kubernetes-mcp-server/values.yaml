name: k8s-mcp
namespace: kubernetes-mcp-server

vpa:
  enabled: true

authentication:
  enabled: true
  issuer: https://auth.siutsin.com/
  jwksUri: https://auth.siutsin.com/.well-known/jwks.json
  allowedSubjects:
    - otaru-mcp
    - muse
  requiredScopes:
    - mcp

kubernetes-mcp-server:
  # Two replicas across nodes (preferred podAntiAffinity below): the
  # self-healing loop calls this MCP server every 30 minutes, so a single
  # pod was a downtime window on every restart or node failure.
  replicaCount: 2
  image:
    registry: quay.io
    repository: containers/kubernetes_mcp_server
    version: v0.0.63@sha256:9317449ed47916a297f71b955eab57402064de852bf1fb007c4e0705754de2b3
  ingress:
    enabled: false
  service:
    port: 8080
  fullnameOverride: kubernetes-mcp-server
  # Edge JWT authenticates MCP callers; the pod SA is used for cluster work.
  config:
    cluster_auth_mode: kubeconfig
    cluster_provider_strategy: in-cluster
    # Stateless HTTP: no per-pod session state, so 2 replicas behind the
    # gateway cannot break a client batch.
    stateless: true
  # Read-mostly agent SA; write limited to workloads and Argo Applications.
  rbac:
    create: true
    extraClusterRoles:
      - name: agent
        rules:
          - apiGroups: ["*"]
            resources: ["*"]
            verbs: ["get", "list", "watch"]
          - nonResourceURLs: ["*"]
            verbs: ["get"]
          - apiGroups: [""]
            resources: ["pods", "pods/log", "pods/status", "pods/eviction"]
            verbs: ["delete", "create", "patch", "update"]
          - apiGroups: ["apps"]
            resources:
              - deployments
              - deployments/scale
              - statefulsets
              - statefulsets/scale
              - daemonsets
              - replicasets
            verbs: ["patch", "update", "delete"]
          - apiGroups: ["batch"]
            resources: ["jobs", "cronjobs"]
            verbs: ["create", "patch", "update", "delete"]
          - apiGroups: ["argoproj.io"]
            resources: ["applications"]
            verbs: ["patch", "update"]
    extraClusterRoleBindings:
      - name: agent
        roleRef:
          name: agent
  # KRR 2026-07-18: 14d peak ~10m CPU / ~100Mi memory (both GOOD, safe downsize).
  # The 100m CPU limit is a vendored-chart default; a values.yaml null does not
  # remove a subchart-default key on merge (confirmed via helm template) -- left as is.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 100Mi
      ephemeral-storage: 64Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-mcp-server
            topologyKey: kubernetes.io/hostname

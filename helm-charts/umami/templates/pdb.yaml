apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  # 2026-07-24: minAvailable 0 let the descheduler evict the sole replica
  # (twice within an hour on nuc-00), ~30s downtime each time for DB checks.
  # 1 replica: keep minAvailable 1 like jung2bot's single-replica pattern.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}

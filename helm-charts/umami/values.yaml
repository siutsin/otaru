name: umami
namespace: umami

# VPA 2026-07-30: onboarded after a steady-state usage check (7d avg/max
# ~221/250Mi against a 320Mi request, ratio ~1.13, no incident history).
vpa:
  enabled: true

image:
  repository: ghcr.io/umami-software/umami
  tag: postgresql-latest@sha256:8edfe4beaef13f9d1300619fa264ef250a3688df9cc54d24ca830ca31cb475ec
  pullPolicy: IfNotPresent

database:
  secretName: umami-20260614-0001
  caSecretName: umami-20260614-0001-ca

appSecret:
  externalSecret:
    refreshInterval: 24h
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-secret-store
    remoteRef:
      key: Umami
      property: APP_SECRET

service:
  port: 3000
  targetPort: 3000

deployment:
  replicas: 1
  resources:
    # 2026-09-22 (user-approved): relax req==limit. Spiky: live ~187Mi, 14d
    # peak 313Mi covered by the 320Mi limit; request 224Mi.
    # KRR 2026-09-24: CPU over-provisioned (30d max ~101m vs 359m request, set
    # for a one-off July spike that has not recurred). Downsized 359m -> 150m.
    requests:
      cpu: 150m
      memory: 224Mi
      ephemeral-storage: 256Mi
    limits:
      memory: 320Mi
      ephemeral-storage: 256Mi

routes:
  collect:
    hostname: analytics.siutsin.com

gateway:
  name: gateway
  namespace: gateway

env:
  TZ: Europe/London

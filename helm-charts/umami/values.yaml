name: umami
namespace: umami

# VPA 2026-07-30: onboarded after a steady-state usage check (7d avg/max
# ~221/250Mi against a 320Mi request, ratio ~1.13, no incident history).
vpa:
  enabled: true

image:
  repository: ghcr.io/umami-software/umami
  tag: postgresql-latest@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
  pullPolicy: IfNotPresent

database:
  secretName: umami-20260614-0001
  caSecretName: umami-20260614-0001-ca

appSecret:
  externalSecret:
    refreshInterval: 24h
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-secret-store
    remoteRef:
      key: Umami
      property: APP_SECRET

service:
  port: 3000
  targetPort: 3000

deployment:
  replicas: 1
  resources:
    # 2026-09-22 (user-approved): relax req==limit. Spiky: live ~187Mi, 14d
    # peak 313Mi covered by the 320Mi limit; request 224Mi.
    # KRR 2026-09-24: CPU over-provisioned (30d max ~101m vs 359m request, set
    # for a one-off July spike that has not recurred). Downsized 359m -> 150m.
    requests:
      cpu: 150m
      memory: 224Mi
      ephemeral-storage: 256Mi
    limits:
      memory: 320Mi
      ephemeral-storage: 256Mi

routes:
  collect:
    hostname: analytics.siutsin.com

gateway:
  name: gateway
  namespace: gateway

env:
  TZ: Europe/London

# 2026-10-24: daily restore verification for the CNPG backups, mirroring
# teslamate-verify-pitr. The job restores the newest completed base backup
# into an ephemeral cluster, fails unless website_event has rows, then pins
# the verified set under cnpg-floor/ outside the 30-day CNPG retention and
# keeps the newest 3 sets (one set is about 0.05 GiB for this cluster).
backup:
  verifyPitr:
    schedule: "0 15 * * *"
    activeDeadlineSeconds: 7200 # 2 hours
    timeoutSeconds: 3600 # 1 hour
    verificationQuery: "SELECT count(*) FROM website_event;"
    restore:
      storage:
        size: 2Gi
        storageClass: longhorn-crypto-global
  floor:
    keepLast: 3
    bucket: github-otaru-cloudnative-pg-backup
    endpoint: s3.eu-central-003.backblazeb2.com
  # 7 days (teslamate used 10 minutes until 2026-10-24): the verified count
  # lives only in the job log, so a short TTL deletes the evidence.
  ttlSecondsAfterFinished: 604800
  backoffLimit: 4
  concurrencyPolicy: Forbid
  database:
    clusterName: umami-20260614-0001
    name: umami
    owner: app
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
    serverName: umami-20260614-0001-pg18

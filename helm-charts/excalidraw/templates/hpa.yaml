---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  maxReplicas: 5
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 70
          type: Utilization
      type: Resource
    - resource:
        name: memory
        # 2026-07-30: switched from Utilization (% of request) to a fixed
        # AverageValue so the memory-only VPA added alongside this HPA can
        # adjust the request without moving this trigger point. 90Mi keeps
        # roughly the same absolute trigger as the previous 70%-of-128Mi
        # (~90Mi) target.
        target:
          type: AverageValue
          averageValue: 90Mi
      type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}

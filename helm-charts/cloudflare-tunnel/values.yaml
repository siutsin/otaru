name: cloudflare-tunnel
namespace: cloudflare-tunnel

# VPA 2026-07-30: onboarded after a steady-state check (7d usage 17-45Mi vs 128Mi request, no incident history).
vpa:
  enabled: true

image:
  repository: cloudflare/cloudflared
  tag: "2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4"

replicaCount: 2

resources:
  requests:
    cpu: 10m
    memory: 128Mi
    ephemeral-storage: 64Mi
  limits:
    memory: 128Mi
    ephemeral-storage: 64Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              pod: cloudflared
          topologyKey: kubernetes.io/hostname



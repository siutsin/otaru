name: cloudflare-tunnel
namespace: cloudflare-tunnel

# VPA 2026-07-30: onboarded after a steady-state check (7d usage 17-45Mi vs 128Mi request, no incident history).
vpa:
  enabled: true

image:
  repository: cloudflare/cloudflared
  tag: "2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07"

replicaCount: 2

resources:
  requests:
    cpu: 10m
    memory: 128Mi
    ephemeral-storage: 64Mi
  limits:
    memory: 128Mi
    ephemeral-storage: 64Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              pod: cloudflared
          topologyKey: kubernetes.io/hostname



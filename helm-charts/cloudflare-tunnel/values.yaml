name: cloudflare-tunnel
namespace: cloudflare-tunnel

# VPA 2026-07-30: onboarded after a steady-state check (7d usage 17-45Mi vs 128Mi request, no incident history).
vpa:
  enabled: true

image:
  repository: cloudflare/cloudflared
  tag: "2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6"

replicaCount: 2

resources:
  requests:
    cpu: 10m
    memory: 128Mi
    ephemeral-storage: 64Mi
  limits:
    memory: 128Mi
    ephemeral-storage: 64Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              pod: cloudflared
          topologyKey: kubernetes.io/hostname



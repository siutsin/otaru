name: cloudflare-tunnel
namespace: cloudflare-tunnel

# VPA 2026-07-30: onboarded after a steady-state check (7d usage 17-45Mi vs 128Mi request, no incident history).
vpa:
  enabled: true

image:
  repository: cloudflare/cloudflared
  tag: "2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39"

replicaCount: 2

resources:
  requests:
    cpu: 10m
    memory: 128Mi
    ephemeral-storage: 64Mi
  limits:
    memory: 128Mi
    ephemeral-storage: 64Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              pod: cloudflared
          topologyKey: kubernetes.io/hostname



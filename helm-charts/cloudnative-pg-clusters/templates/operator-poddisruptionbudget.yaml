apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudnative-pg
  namespace: {{ .Values.namespace }}
spec:
  # 2026-07-26: repo-wide PDB audit. The cnpg operator (single replica)
  # has no podDisruptionBudget option in its upstream chart, which is
  # applied directly from cloudnative-pg.io via ArgoCD (argocd/manifest.jsonnet),
  # not vendored here, so there is no local template to patch. This chart
  # targets the same cnpg-system namespace and syncs after the operator
  # (wave 06 vs wave 03), so the PDB lives here instead of a new chart.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
      app.kubernetes.io/instance: cloudnative-pg

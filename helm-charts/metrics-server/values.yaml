metrics-server:
  image:
    repository: dhi.io/metrics-server
    tag: 0.9.1@sha256:996c1c6ae9a94f592e8d570cdc27040e5e475bd6c28fa08691973df34e5a11f4
  podLabels:
    # metrics-server is scraped directly by the Kubernetes API aggregation path; keep its Pod IP outside ambient interception.
    istio.io/dataplane-mode: none
  service:
    annotations:
      mesh.otaru.io/non-ambient-endpoints: "true"
  resources:
    requests:
      cpu: 50m
      memory: 95Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 110Mi
      ephemeral-storage: 64Mi
  replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: metrics-server
            topologyKey: kubernetes.io/hostname

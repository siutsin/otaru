metrics-server:
  image:
    repository: dhi.io/metrics-server
    tag: 0.9.0@sha256:84d32c4d4bf9f32a42a5b3b49c91302b1a70d20bf29e01f9100146c94d3e9c0d
  podLabels:
    # metrics-server is scraped directly by the Kubernetes API aggregation path; keep its Pod IP outside ambient interception.
    istio.io/dataplane-mode: none
  service:
    annotations:
      mesh.otaru.io/non-ambient-endpoints: "true"
  resources:
    requests:
      cpu: 50m
      memory: 95Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 110Mi
      ephemeral-storage: 64Mi
  replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: metrics-server
            topologyKey: kubernetes.io/hostname

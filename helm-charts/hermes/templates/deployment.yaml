{{- $version := regexReplaceAll "@sha256:.*$" .Values.image.tag "" -}}
{{- $dataDir := .Values.persistence.mountPath -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/version: {{ $version | quote }}
spec:
  replicas: 1
  # RWO: a second pod cannot mount the claim.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/version: {{ $version | quote }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # config.yaml comes from Git. Hermes keeps its own state on the volume.
        - name: init-config
          image: {{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}
          imagePullPolicy: {{ .Values.initContainer.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              cp /config/config.yaml "$DATA_DIR/config.yaml"
              chown 10000:10000 "$DATA_DIR" "$DATA_DIR/config.yaml"
          env:
            - name: DATA_DIR
              value: {{ $dataDir | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: {{ .Values.initContainer.resources.requests.cpu }}
              memory: {{ .Values.initContainer.resources.requests.memory }}
              ephemeral-storage: {{ .Values.initContainer.resources.requests.ephemeralStorage }}
            limits:
              memory: {{ .Values.initContainer.resources.limits.memory }}
              ephemeral-storage: {{ .Values.initContainer.resources.limits.ephemeralStorage }}
          volumeMounts:
            - name: data
              mountPath: {{ $dataDir | quote }}
            - name: config
              mountPath: /config
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - gateway
            - run
          env:
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: {{ .Values.apiPort | quote }}
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PORT
              value: {{ .Values.dashboardPort | quote }}
            - name: SEARXNG_URL
              value: {{ .Values.web.searxngUrl | quote }}
            - name: FIRECRAWL_API_URL
              value: {{ .Values.web.firecrawlApiUrl | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          # The image starts as root and drops to UID 10000 under s6-overlay. It needs a writable root filesystem.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.apiPort }}
              protocol: TCP
            - name: dashboard
              containerPort: {{ .Values.dashboardPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
              ephemeral-storage: {{ .Values.resources.requests.ephemeralStorage }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              ephemeral-storage: {{ .Values.resources.limits.ephemeralStorage }}
          volumeMounts:
            - name: data
              mountPath: {{ $dataDir | quote }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
        - name: config
          configMap:
            name: {{ .Values.name }}-config

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    model:
      default: default
      provider: custom
      base_url: {{ .Values.inference.baseUrl }}
      context_length: {{ .Values.inference.contextLength }}
    web:
      # web_search keeps Hermes' default keyless backends, which send queries to free outside services (Exa, Parallel, Firecrawl or Keenable).
      # DuckDuckGo needs the ddgs package, which this image does not include.
      # Firecrawl's keyless endpoint returned 403 Forbidden for a GitHub page and a 403 does not fail over, so extract starts at Keenable and tries Firecrawl last.
      extract_backend: keenable
      # The server processes about 23 prompt tokens/s, so 15000 characters (the default) of one page would add about 3 minutes. 6000 adds about 1 minute.
      extract_char_limit: 6000
    tools:
      tool_search:
        # A deferred tool costs only its name and one-line description until the model asks for it.
        # The server processes about 23 prompt tokens/s, so every 1k characters of tool schema adds about 10s to a cold prompt.
        # An explicit list replaces the Hermes default, so the default entries come first.
        defer:
          - computer_use
          - session_search
          - image_generate
          - todo_list
          - process_manage
          - cronjob_manage
          - drive_preview
          - gui_tour
          - desktop_preview
          - annotate_preview
          - show_tip
          - desktop_project
          - close_terminal
          - apply_layout
          - read_terminal
          - read_window_below
          - focus_pane
          # Large and rarely used: subagents (4.7k characters), speech (1.9k), Browser Use (3.5k) and its password vault (4.4k), skill editing (3.7k) and Python scripting (2.6k).
          - delegate_task
          - text_to_speech
          - browser_exec
          - browser_vault_enter_code
          - browser_vault_fill
          - browser_vault_list
          - browser_vault_save_login
          - browser_vault_unlock
          - skill_manage
          - execute_code
    terminal:
      backend: local
    dashboard:
      trusted_proxies:
        {{- toYaml .Values.trustedProxies | nindent 8 }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    model:
      default: default
      provider: custom
      base_url: {{ .Values.inference.baseUrl }}
      context_length: {{ .Values.inference.contextLength }}
    agent:
      disabled_toolsets:
        - web
    terminal:
      backend: local
    dashboard:
      trusted_proxies:
        {{- toYaml .Values.trustedProxies | nindent 8 }}

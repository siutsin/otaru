apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}-internal
  namespace: {{ .Values.namespace }}
spec:
  hostnames:
    - {{ .Values.route.hostname }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: gateway
  rules:
    # The dashboard streams over websockets. The 15s default would cut them.
    - timeouts:
        request: 1h
        backendRequest: 1h
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.name }}
          port: {{ .Values.dashboardPort }}
          weight: 1

externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-secret-store
  remoteRef:
    key: tailscale-operator

# Advertise the server VLAN, which holds the node, VIP, and management
# addresses. Never advertise pod or Service CIDRs. The tailnet policy decides
# which addresses and ports each client can reach.
connector:
  enabled: true
  name: gateway-vip
  hostnamePrefix: otaru-gateway
  advertiseRoutes:
    - 192.168.10.0/24
  # The gateway-vip connector is both subnet router and exit node.
  # Two replicas for HA, spread across nodes by the ProxyClass below.
  exitNode: true
  replicas: 2
  proxyClass: exit-node-ha
  # Pod resources for the gateway StatefulSet. The operator generates the pods,
  # so ProxyClass is the only supported way to set resources on them.
  # Fixes require-container-resource-requests-and-limits (audit).
  # 2026-10-03: initial values from live usage (tailscale ~45Mi/18m, init tiny).
  # No 30d history yet -- the right-sizing loop will refine them.
  podResources:
    tailscaleContainer:
      # 2026-10-08: 30d spike ~124Mi vs 128Mi limit (97.0% — OOM risk); limit -> 149Mi (ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 32Mi
      limits:
        memory: 149Mi
        ephemeral-storage: 64Mi
    tailscaleInitContainer:
      requests:
        cpu: 10m
        memory: 16Mi
        ephemeral-storage: 16Mi
      limits:
        memory: 32Mi
        ephemeral-storage: 32Mi

tailscale-operator:
  # Keep oauth.clientId empty. The chart would render a Secret from Helm values; ExternalSecret creates operator-oauth instead.
  oauth:
    clientId: ""
    clientSecret: ""
  installCRDs: true
  annotations:
    reloader.stakater.com/auto: "true"
  apiServerProxyConfig:
    mode: "false"
  operatorConfig:
    image:
      repository: tailscale/k8s-operator
      tag: v1.102.4@sha256:3c8958c42fb3c46068e8553e11b944f2133b4671d4f36c86adc11f206746bf34
      pullPolicy: IfNotPresent
    resources:
      # 2026-09-23: right-sized on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)). No CPU limit. Operator creates Connector TUN proxies at runtime.
      # KRR 2026-09-26: 30d max 61.9Mi vs 69Mi limit (~90%, zero OOMKills) --
      # spike crept past the 2026-09-23 baseline, so bump limit 69Mi -> 75Mi
      # (ceil(spike*1.2)). Request 43Mi unchanged (p50 41.7Mi).
      # 2026-10-08: 30d spike ~70Mi vs 75Mi limit (92.7% — OOM risk); limit -> 84Mi (ceil(spike*1.2)).
      requests:
        cpu: 50m
        memory: 43Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 84Mi
        ephemeral-storage: 64Mi
    securityContext:
      # Satisfies require-container-hardening (audit). Drops all capabilities and forbids privilege escalation.
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  proxyConfig:
    image:
      repository: tailscale/tailscale
      tag: v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065

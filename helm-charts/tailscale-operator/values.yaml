externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-secret-store
  remoteRef:
    key: tailscale-operator

# Only advertise the Envoy Gateway MetalLB VIP so tailnet clients reach existing HTTPRoutes. Never advertise pod, Service, or LAN CIDRs.
connector:
  enabled: true
  name: gateway-vip
  hostnamePrefix: otaru-gateway
  advertiseRoutes:
    - 192.168.10.51/32
  # Renders spec.exitNode on the Connector. Default false: the gateway-vip
  # connector stays a subnet router until an exit-node connector is wanted.
  exitNode: false

tailscale-operator:
  # Keep oauth.clientId empty. The chart would render a Secret from Helm values; ExternalSecret creates operator-oauth instead.
  oauth:
    clientId: ""
    clientSecret: ""
  installCRDs: true
  annotations:
    reloader.stakater.com/auto: "true"
  apiServerProxyConfig:
    mode: "false"
  operatorConfig:
    image:
      repository: tailscale/k8s-operator
      tag: v1.102.4@sha256:3c8958c42fb3c46068e8553e11b944f2133b4671d4f36c86adc11f206746bf34
      pullPolicy: IfNotPresent
    resources:
      # 2026-09-23: right-sized on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)). No CPU limit. Operator creates Connector TUN proxies at runtime.
      # KRR 2026-09-26: 30d max 61.9Mi vs 69Mi limit (~90%, zero OOMKills) --
      # spike crept past the 2026-09-23 baseline, so bump limit 69Mi -> 75Mi
      # (ceil(spike*1.2)). Request 43Mi unchanged (p50 41.7Mi).
      requests:
        cpu: 50m
        memory: 43Mi
        ephemeral-storage: 64Mi
      limits:
        memory: 75Mi
        ephemeral-storage: 64Mi
    securityContext:
      # Satisfies require-container-hardening (audit). Drops all capabilities and forbids privilege escalation.
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  proxyConfig:
    image:
      repository: tailscale/tailscale
      tag: v1.102.4@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3

{{- if .Values.connector.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tailscale-proxy-secret-scope
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  admission: true
  background: true
  failurePolicy: Ignore
  rules:
    - name: narrow-proxy-role
      match:
        any:
          - resources:
              kinds:
                - Role
              namespaces:
                - {{ .Release.Namespace }}
              names:
                - proxies
      context:
        - name: tsSecrets
          apiCall:
            method: GET
            urlPath: /api/v1/namespaces/{{ .Release.Namespace }}/secrets
            jmesPath: "items[?starts_with(metadata.name, 'ts-')].metadata.name"
            default: []
      preconditions:
        all:
          - key: "{{ `{{ tsSecrets | length(@) }}` }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchesJson6902: |-
          - op: replace
            path: /rules
            value:
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["get", "update", "patch", "delete"]
                resourceNames: {{ `{{ to_json(tsSecrets) }}` }}
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["create"]
              - apiGroups: [""]
                resources: ["events"]
                verbs: ["get", "create", "patch"]
    - name: narrow-proxy-role-on-state-secret
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - {{ .Release.Namespace }}
              names:
                - ts-*
      context:
        - name: listed
          apiCall:
            method: GET
            urlPath: /api/v1/namespaces/{{ .Release.Namespace }}/secrets
            jmesPath: "items[?starts_with(metadata.name, 'ts-')].metadata.name"
            default: []
      preconditions:
        all:
          - key: "{{ `{{ listed | length(@) }}` }}"
            operator: GreaterThan
            value: 0
      mutate:
        targets:
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            name: proxies
            namespace: {{ .Release.Namespace | quote }}
        patchesJson6902: |-
          - op: replace
            path: /rules
            value:
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["get", "update", "patch", "delete"]
                resourceNames: {{ `{{ to_json(listed) }}` }}
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["create"]
              - apiGroups: [""]
                resources: ["events"]
                verbs: ["get", "create", "patch"]
          - op: add
            path: /rules/0/resourceNames/-
            value: "{{ `{{ request.object.metadata.name }}` }}"
    - name: narrow-proxy-role-on-first-state-secret
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - {{ .Release.Namespace }}
              names:
                - ts-*
      context:
        - name: listed
          apiCall:
            method: GET
            urlPath: /api/v1/namespaces/{{ .Release.Namespace }}/secrets
            jmesPath: "items[?starts_with(metadata.name, 'ts-')].metadata.name"
            default: []
      preconditions:
        all:
          - key: "{{ `{{ listed | length(@) }}` }}"
            operator: Equals
            value: 0
      mutate:
        targets:
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            name: proxies
            namespace: {{ .Release.Namespace | quote }}
        patchesJson6902: |-
          - op: replace
            path: /rules
            value:
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["get", "update", "patch", "delete"]
                resourceNames: ["{{ `{{ request.object.metadata.name }}` }}"]
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["create"]
              - apiGroups: [""]
                resources: ["events"]
                verbs: ["get", "create", "patch"]
{{- end }}

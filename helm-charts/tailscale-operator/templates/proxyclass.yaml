{{- if .Values.connector.proxyClass }}
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: {{ .Values.connector.proxyClass }}
spec:
  statefulSet:
    pod:
      annotations:
        # guard.sh stays in memory. The value is the rendered ConfigMap
        # hash, so a script or route change rolls the proxy Pods.
        otaru.io/exit-guard: {{ include "tailscale-operator.exitGuardConfigMap" . | sha256sum | quote }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  tailscale.com/parent-resource: {{ .Values.connector.name }}
                  tailscale.com/parent-resource-type: connector
              topologyKey: kubernetes.io/hostname
      {{- if .Values.connector.podResources }}
      tailscaleContainer:
        resources:
          {{- toYaml .Values.connector.podResources.tailscaleContainer | nindent 10 }}
      tailscaleInitContainer:
        resources:
          {{- toYaml .Values.connector.podResources.tailscaleInitContainer | nindent 10 }}
      {{- end }}
{{- end }}

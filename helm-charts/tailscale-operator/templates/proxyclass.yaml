{{- if .Values.connector.proxyClass }}
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: {{ .Values.connector.proxyClass }}
spec:
  statefulSet:
    pod:
      {{- if .Values.connector.exitNode }}
      # Exit-node clients use this pod resolver. ClusterFirst keeps the
      # cluster DNS server first because extra nameservers are appended.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - {{ index (splitList "/" (index .Values.connector.advertiseRoutes 0)) 0 | quote }}
        options:
          - name: ndots
            value: "1"
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  tailscale.com/parent-resource: {{ .Values.connector.name }}
                  tailscale.com/parent-resource-type: connector
              topologyKey: kubernetes.io/hostname
{{- end }}

name: browserless
namespace: browserless

gateway:
  name: gateway
  namespace: gateway

authentication:
  enabled: true
  issuer: https://auth.siutsin.com/
  jwksUri: https://auth.siutsin.com/.well-known/jwks.json
  allowedSubjects:
    - muse
  requiredScopes:
    - mcp

image:
  # The image USER is blessuser (uid 999), so the hardening matches it instead of forcing a different user.
  repository: ghcr.io/browserless/chromium
  tag: v2.57.2@sha256:7bc12b4978044715292cbe9da4bef8ffd09b4f702b35b84f78b2beaccd091ecd
  pullPolicy: IfNotPresent

port: 3000

env:
  # One user needs a session plus a spare slot; 120s because the 30s default kills slow agent flows, and finite so a stuck session cannot hold a slot forever.
  concurrent: "2"
  timeout: "120000"

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 4
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Chrome crashes under load with the 64 MB container default for /dev/shm; upstream docs recommend 2 GB.
shmSizeLimit: 2Gi

resources:
  # New workload, no usage history, so request = limit per the new-chart
  # rule. Values come from the upstream docs light tier (2 CPU, 4 GB)
  # scaled to two sessions, and the memory limit must also absorb the
  # 2 GiB /dev/shm volume, which Kubernetes charges to the pod. The
  # right-sizing pass revisits the values after 30 days of data.
  requests:
    cpu: 1000m
    memory: 4Gi
    ephemeralStorage: 1Gi
  limits:
    memory: 4Gi
    ephemeralStorage: 4Gi

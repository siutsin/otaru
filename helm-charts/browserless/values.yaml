name: browserless
namespace: browserless

gateway:
  name: gateway
  namespace: gateway

authentication:
  enabled: true
  issuer: https://auth.siutsin.com/
  jwksUri: https://auth.siutsin.com/.well-known/jwks.json
  allowedSubjects:
    - muse
  requiredScopes:
    - mcp

image:
  # The image USER is blessuser (uid 999), so the hardening matches it instead of forcing a different user.
  repository: ghcr.io/browserless/chromium
  tag: v2.60.0@sha256:a9c2dea3399449e1b1f47cf49d33ee249e8aa9bd9222567a0224d52f4bb24602
  pullPolicy: IfNotPresent

port: 3000

env:
  # One user needs a session plus a spare slot; 120s because the 30s default kills slow agent flows, and finite so a stuck session cannot hold a slot forever.
  concurrent: "2"
  timeout: "120000"

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 4
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Chrome crashes under load with the 64 MB container default for /dev/shm; upstream docs recommend 2 GB.
shmSizeLimit: 2Gi

resources:
  # KRR 2026-11-08: 30d p50 ~456.8Mi, spike ~2292.5Mi. Request 4Gi -> 508Mi
  # (ceil(p50/0.9)), limit 4Gi -> 2752Mi (ceil(spike*1.2)). The limit still
  # absorbs the 2 GiB /dev/shm volume charged to the pod.
  requests:
    cpu: 1000m
    memory: 508Mi
    ephemeralStorage: 1Gi
  limits:
    memory: 2752Mi
    ephemeralStorage: 4Gi

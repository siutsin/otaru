{{- $gateway := .Values.gateway | default dict -}}
{{- $gatewayName := $gateway.name | default "gateway" -}}
{{- $gatewayNamespace := $gateway.namespace | default "gateway" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}-internal
  namespace: {{ .Values.namespace }}
spec:
  hostnames:
    - {{ printf "%s.internal.siutsin.com" .Values.name }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
  rules:
    # No matches and no rewrite: the client connects to the native
    # browserless paths, so every path passes through unchanged.
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.name }}
          port: {{ .Values.port }}
          weight: 1

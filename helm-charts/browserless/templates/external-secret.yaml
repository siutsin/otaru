apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  length: 42
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Bump to rotate the token: the ExternalSecret reconciles, the generator re-mints, Reloader rolls the pod.
    browserless.siutsin.com/token-generation: "2"
spec:
  refreshInterval: "24h"
  target:
    name: {{ .Values.name }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.name }}

namespace: istio-system

oryHydra:
  issuer: https://auth.siutsin.com/
  jwksUri: https://auth.siutsin.com/.well-known/jwks.json

istiod:
  profile: ambient
  pilot:
    env:
      ENABLE_INGRESS_WAYPOINT_ROUTING: "true"
    resources:
      # KRR 2026-07-05: peak ~182Mi working set.
      # 2026-09-23: right-sized on 30d Prometheus baseline: request=ceil(p50/0.9), limit=ceil(spike*1.2).
      requests:
        cpu: 100m
        memory: 181Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 224Mi
        ephemeral-storage: 128Mi

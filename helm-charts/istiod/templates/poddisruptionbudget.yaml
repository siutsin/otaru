apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: istiod
  namespace: {{ .Values.namespace }}
spec:
  # 2026-07-26: upstream istio chart skips PDB at 1 replica
  # (kubernetes/kubernetes#93476: a zero-allowed-disruption PDB can deadlock a node drain).
  # Safe here: the LUKS reboot playbook drains with --disable-eviction,
  # bypassing the Eviction API and this PDB.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: istiod
      istio: pilot

apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: ory-hydra
  namespace: {{ .Values.namespace }}
spec:
  # Selector-free in the root namespace: registers the issuer for the whole mesh.
  # Validates a presented Ory token but does not require one;
  # AuthorizationPolicies decide where JWTs are mandatory.
  jwtRules:
    - issuer: {{ .Values.oryHydra.issuer | quote }}
      jwksUri: {{ .Values.oryHydra.jwksUri | quote }}

service:
  clusterIP: 10.43.0.10

deployment:
  replicas: 3
  image:
    repository: dhi.io/coredns
    tag: "1.14.7@sha256:472965d72e696aa7d893e99f6548349e900117e00b7da1ab6a7de39381769ce6"
  resources:
    # 2026-09-23: right-size on 30d Prometheus baseline (request=ceil(p50/0.9), limit=ceil(spike*1.2)).
    # 2026-10-08: 30d spike ~54Mi vs 58Mi limit (93.1% — OOM risk); limit -> 65Mi (ceil(spike*1.2)).
    requests:
      cpu: 100m
      memory: 38Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 65Mi
      ephemeral-storage: 64Mi

config:
  corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
        forward . /etc/resolv.conf
    }

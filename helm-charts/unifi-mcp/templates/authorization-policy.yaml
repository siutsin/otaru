{{- $gateway := .Values.gateway | default dict -}}
{{- $gatewayName := $gateway.name | default "gateway" -}}
{{- $gatewayNamespace := $gateway.namespace | default "gateway" -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  action: ALLOW
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.name }}
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $gatewayNamespace }}/sa/{{ $gatewayName }}
            {{- if .Values.authentication.enabled }}
            requestPrincipals:
              - "*"
            {{- end }}
      to:
        - operation:
            ports:
              {{- range $key, $c := .Values.containers }}
              {{- if $c.enabled }}
              - {{ $c.port | quote }}
              {{- end }}
              {{- end }}
      {{- if .Values.authentication.enabled }}
      when:
        - key: request.auth.claims[sub]
          values:
            {{- toYaml .Values.authentication.allowedSubjects | nindent 12 }}
      {{- end }}

namespace: jung2bot-dev

secret:
  remoteRef:
    key: jung2bot-dev

app:
  # Pinned here so dev and prod can diverge if needed; rollback is one line.
  image:
    tag: jung2bot-6.1.4@sha256:1db2e606671e5df5fddcf5df771080d11b99e47b6dc5f603c009efdd2ab75884
  env:
    chatIdTable: jung2bot-dev-chatIds
    eventQueueName: jung2bot-dev-event-queue
    logLevel: debug
    messageSaveQueueName: jung2bot-dev-message-save-queue.fifo
    messageTable: jung2bot-dev-messages
    # Must exceed the tables' provisioned read capacity of 1, or UpdateTable is
    # a no-op that the service reports as success.
    scaleUpReadCapacity: 2
    stage: dev
  autoscaling:
    min: 1
    cron: 2
    max: 4

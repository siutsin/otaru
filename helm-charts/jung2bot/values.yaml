name: jung2bot
namespace: jung2bot

# VPA 2026-07-30: onboarded memory-only after a steady-state usage check
# (7d avg/max ~95Mi against a 192Mi request, ratio ~1.0, no incident
# history). CPU is left to the existing KEDA ScaledObject. The
# ScaledObject's memory trigger was switched from Utilization to
# AverageValue (see templates/scaled-object.yaml) to decouple it from the
# request this VPA adjusts -- same fix blocky's HPA needed. Applies to
# both jung2bot and jung2bot-dev (same chart, dev values file override).
vpa:
  enabled: true

# Restricts onOffFromWork/onScaleUp to in-cluster callers instead of the
# public Gateway route. Off here until the dev-verified rollout lands here
# too in a follow-up change.
adminRoutesInternalOnly: false

secret:
  remoteRef:
    key: jung2bot

irsa:
  awsAccountId: ~

app:
  image:
    repository: ghcr.io/siutsin/telegram-jung2-bot
    tag: jung2bot-5.2.1@sha256:a75c29f70aa9b1c961386989c223b777b8c85502c50a9ac333349786102ed94d
  env:
    awsRegion: eu-west-1
    chatIdTable: jung2bot-prod-chatIds
    logLevel: info
    messageTable: jung2bot-prod-messages
    profile: default
    scaleUpReadCapacity: 600
    stage: prod
  autoscaling:
    min: 4
    max: 10

cron:
  image:
    repository: ghcr.io/siutsin/telegram-jung2-bot-cron
    tag: cron-1.1.1@sha256:b309fcbd4bf83452fb35d155b4bae264edb47bfbbce74b6cd7dc6032868122d0
  offWork:
    env:
      cronInterval: 15

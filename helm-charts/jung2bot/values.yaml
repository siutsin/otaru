name: jung2bot
namespace: jung2bot

# VPA 2026-07-30: onboarded memory-only (7d avg/max ~95Mi vs 192Mi request,
# ratio ~1.0, no incident history); CPU stays with the KEDA ScaledObject. The
# ScaledObject memory trigger switched Utilization -> AverageValue (see
# templates/scaled-object.yaml) so the VPA's request adjustments do not move
# the trigger -- same fix blocky's HPA needed. Applies to both jung2bot and
# jung2bot-dev (same chart, dev values file override).
vpa:
  enabled: true

secret:
  remoteRef:
    key: jung2bot

irsa:
  awsAccountId: ~

app:
  image:
    repository: ghcr.io/siutsin/telegram-jung2-bot
    tag: jung2bot-6.2.2@sha256:5ec46be9b90e8f9ac33cc68f807ff889a71923e2f5aa43a31fb31bc80cb56ed5
  env:
    awsRegion: eu-west-1
    chatIdTable: jung2bot-prod-chatIds
    logLevel: info
    messageSaveQueueFlushSeconds: 10
    eventQueueName: jung2bot-prod-event-queue
    messageSaveQueueName: jung2bot-prod-message-save-queue.fifo
    messageTable: jung2bot-prod-messages
    profile: default
    scaleUpReadCapacity: 600
    stage: prod
  # Temporary while the bot account is frozen (2026-11-04): prod has no
  # traffic to serve. Restore min 3 / cron 20 / max 40 when it recovers.
  # Dev is unaffected: value/dev.yaml pins its own autoscaling values.
  autoscaling:
    min: 1
    cron: 1
    max: 3

cron:
  offWork:
    env:
      cronInterval: 15

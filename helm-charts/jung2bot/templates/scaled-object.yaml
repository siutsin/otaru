apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
  minReplicaCount: {{ .Values.app.autoscaling.min }}
  maxReplicaCount: {{ .Values.app.autoscaling.max }}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
    - type: memory
      # 2026-07-30: switched from Utilization (% of request) to a fixed
      # AverageValue so the memory-only VPA added alongside this
      # ScaledObject can adjust the request without moving this trigger
      # point. 144Mi keeps the same absolute trigger as the previous
      # 75%-of-192Mi target.
      metricType: AverageValue
      metadata:
        value: "144Mi"
    - type: cron
      metadata:
        timezone: "Asia/Hong_Kong"
        start: "55 17 * * 1-5"  # Scale up at 5:55 PM, Monday to Friday, Hong Kong time
        end: "15 18 * * 1-5"    # Scale down at 6:15 PM, Monday to Friday, Hong Kong time
        desiredReplicas: {{ .Values.app.autoscaling.cron | quote }}
    # Visible queue depth. identityOwner operator uses keda-operator IRSA.
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ printf "https://sqs.%s.amazonaws.com/%v/%s" .Values.app.env.awsRegion .Values.irsa.awsAccountId .Values.app.env.eventQueueName | quote }}
        queueLength: "2"
        awsRegion: {{ .Values.app.env.awsRegion | quote }}
        scaleOnInFlight: "false"
        identityOwner: operator

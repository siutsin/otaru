{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Values.name }}
        controlledResources: [memory]
        controlledValues: RequestsAndLimits
        # 2026-08-25: VPA resized memory to 64Mi, then ~47Mi (its own target),
        # causing repeated OOMKilled (exit 137) on new KEDA scale-out pods and
        # stable long-running pods during a scale-out burst. Floor raised above
        # the VPA's own observed upperBound (~93Mi) so it cannot resize back
        # into the crash-looping range.
        minAllowed:
          memory: 128Mi
        maxAllowed:
          memory: 192Mi
{{- end }}

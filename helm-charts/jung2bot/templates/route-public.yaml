{{- $gateway := .Values.gateway | default dict -}}
{{- $gatewayName := $gateway.name | default "gateway" -}}
{{- $gatewayNamespace := $gateway.namespace | default "gateway" -}}
{{- $stagePrefix := printf "/jung2bot/%s" .Values.app.env.stage -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}-public
  namespace: {{ .Values.namespace }}
spec:
  hostnames:
    - "*.siutsin.com"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
  rules:
{{- if .Values.adminRoutesInternalOnly }}
    - matches:
        - path:
            type: Exact
            value: {{ $stagePrefix }}/
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.name }}
          port: 3000
          weight: 1
    - matches:
        - path:
            type: Exact
            value: {{ $stagePrefix }}/ping
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.name }}
          port: 3000
          weight: 1
{{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ $stagePrefix }}/
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.name }}
          port: 3000
          weight: 1
{{- end }}

{{- $gateway := .Values.gateway | default dict -}}
{{- $gatewayName := $gateway.name | default "gateway" -}}
{{- $gatewayNamespace := $gateway.namespace | default "gateway" -}}
{{- $stagePrefix := printf "/jung2bot/%s" .Values.app.env.stage -}}
{{- $monitoring := .Values.monitoring | default dict -}}
{{- $prometheusServiceAccount := $monitoring.prometheusServiceAccount | default "monitoring-prometheus-server" -}}
{{- $prometheusNamespace := $monitoring.namespace | default "monitoring" -}}
{{- $waypointPrincipal := "cluster.local/ns/istio-waypoints/sa/waypoint" -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $gatewayNamespace }}/sa/{{ $gatewayName }}
      to:
        - operation:
            ports:
              - "3000"
            paths:
              - {{ $stagePrefix }}/
              - {{ $stagePrefix }}/ping
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ .Values.namespace }}/sa/default
      to:
        - operation:
            ports:
              - "3000"
            paths:
              - {{ $stagePrefix }}/onOffFromWork
              - {{ $stagePrefix }}/onScaleUp
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $prometheusNamespace }}/sa/{{ $prometheusServiceAccount }}
              - {{ $waypointPrincipal }}
      to:
        - operation:
            methods:
              - GET
            ports:
              - "9090"
            paths:
              - /metrics
---
# Kyverno's require-mesh-authorization-policy checks for a workload-selector
# policy separately from the Service targetRefs one above: Prometheus scrapes
# the pod IP directly, which targetRefs policies don't cover. A
# selector-based policy makes ztunnel enforce L4 authorization on the pod
# for ALL traffic, not just the ports it lists, so port 3000 (gateway
# ingress and the onOffFromWork/onScaleUp cron calls) must be re-allowed
# here too -- L7 path restriction for those routes still comes from the
# targetRefs policy above. The waypoint's own identity must also be listed:
# traffic that reaches this pod via the waypoint (gateway ingress, cron
# calls -- anything routed through the Service) arrives at ztunnel as the
# waypoint's SPIFFE identity, not the original caller's, so omitting it
# here causes ztunnel to reject the waypoint's proxied connection outright
# (503 "upstream connect error", ztunnel log "policy rejection: allow
# policies exist, but none allowed" -- caused a live outage 2026-08-25).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}-workload
  namespace: {{ .Values.namespace }}
spec:
  action: ALLOW
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $gatewayNamespace }}/sa/{{ $gatewayName }}
              - cluster.local/ns/{{ .Values.namespace }}/sa/default
              - {{ $waypointPrincipal }}
      to:
        - operation:
            ports:
              - "3000"
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $prometheusNamespace }}/sa/{{ $prometheusServiceAccount }}
              - {{ $waypointPrincipal }}
      to:
        - operation:
            ports:
              - "9090"

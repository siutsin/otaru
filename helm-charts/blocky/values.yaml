name: blocky
namespace: blocky
ip: 192.168.10.51

app:
  timezone: Europe/London

deployment:
  image:
    repository: ghcr.io/0xerr0r/blocky
    tag: v0.28.1@sha256:e9af552da2b0849f9b3b48ae3169acb2696fdf0ddc65df52e4025c9deef04a60
  probeExec:
    command:
      - /app/blocky
      - healthcheck
  ports:
    http: 4000
  resources:
    # Memory sizing history (OOMKilled = exit 137):
    # 2026-07-20: 512Mi OOM after adding a second denylist group ("malware" =
    # HaGeZi TIF + URLhaus); concurrent import/parse of two groups spikes higher
    # than one. Raised to 768Mi.
    # 2026-07-21/22: OOM every ~4h -- blocky's default 4h denylist refresh, not a
    # leak (Prometheus: working set flat at ~290Mi between kills). Refresh spikes
    # higher than startup (550-670Mi) because the old ~290Mi list stays resident
    # while the new one downloads and parses: ~840-960Mi stacked peak > 768Mi.
    # Raised to 1280Mi.
    # Request/limit split (exception to this repo's requests==limits convention,
    # see CLAUDE.md): request 350Mi (just above ~290Mi steady state), limit
    # 1280Mi. Only the limit covers the few-seconds-per-~4h refresh spike;
    # requests==limits would reserve ~930Mi of unused node capacity per replica.
    # Paired with the HPA memory metric change (Utilization -> AverageValue in
    # hpa.yaml) so the low request does not pin HPA at 60%-of-request permanently.
    # 2026-09-20: both replicas OOM at 1280Mi 19s apart (12:06 UTC); 3d peaks hit
    # 1.05-1.23Gi on surviving pods. Raised to 1792Mi; request left at 350Mi
    # (superseded 2026-09-22).
    # 2026-09-22: 30d p50 576.7Mi (steady state doubled since July), 30d spike
    # 1696.5Mi. Request -> 641Mi (ceil 576.7/0.9); limit -> 2036Mi
    # (ceil 1696.5*1.2). The 350Mi exception assumed a ~290Mi steady state that no
    # longer holds, and 1792Mi left only ~95Mi headroom above the spike.
    requests:
      cpu: 100m
      memory: 641Mi
      ephemeral-storage: 100Mi
    limits:
      memory: 2036Mi
      ephemeral-storage: 100Mi

hpa:
  autoscaling:
    min: 2
    max: 3

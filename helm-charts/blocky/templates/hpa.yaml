apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
  minReplicas: {{ .Values.hpa.autoscaling.min }}
  maxReplicas: {{ .Values.hpa.autoscaling.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        # 2026-07-22: Utilization -> AverageValue. Request intentionally lowered to
        # 350Mi (limit covers the refresh spike, see values.yaml), so a 60%-of-350Mi
        # target would pin ordinary ~290Mi usage at max replicas permanently.
        # 500Mi kept the old 60%-of-768Mi (~461Mi) absolute trigger, decoupled
        # from the request value.
        # 2026-09-22: 30d p50 rose to 577Mi, pinning HPA at max (verified live:
        # desired 3, memory ~498Mi vs 500Mi target). Raised to 1222Mi (60% of the
        # 2036Mi limit) so normal usage holds 2 replicas; refresh spikes scale to 3.
        target:
          type: AverageValue
          averageValue: 1222Mi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  maxReplicas: 5
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 70
          type: Utilization
      type: Resource
    - resource:
        name: memory
        # 2026-07-30: Utilization -> AverageValue so the memory-only VPA can adjust the request without moving this trigger.
        # 70Mi keeps the same absolute trigger as the old 70%-of-100Mi target.
        target:
          type: AverageValue
          averageValue: 70Mi
      type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}

name: cyberchef
namespace: cyberchef

# VPA 2026-07-30: memory-only after a steady-state check (7d usage 7-9Mi vs 100Mi request, no incident history).
# CPU stays with the HPA; the HPA memory trigger switched from Utilization to AverageValue (see templates/hpa.yaml)
# so the VPA can adjust the request without moving the trigger.
vpa:
  enabled: true

deployment:
  image:
    repository: ghcr.io/gchq/cyberchef
    tag: 11.5.0@sha256:f04a39926344faf8e4cbbc8c92fb125d2b466f9be62db09aff23c7c406101a51

service:
  port: 8080
  targetPort: 8080
  # v11 moved the container port from 80 to 8080.

name: Release charts

on:
  push:
    branches:
      - master
    paths:
      - helm-charts/**
  workflow_dispatch:

permissions: { }

jobs:
  release:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.18
          install_args: --locked

      - name: Publish to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          failed=0
          mkdir -p /tmp/chart-check
          for chart_yaml in helm-charts/*/Chart.yaml; do
            # Only charts annotated siutsin.com/publish-oci: "true" are published.
            if [ "$(yq -r '.annotations["siutsin.com/publish-oci"] // ""' "$chart_yaml")" != "true" ]; then
              continue
            fi
            name="$(yq -r '.name' "$chart_yaml")"
            version="$(yq -r '.version' "$chart_yaml")"
            # Skip when the version is already on GHCR (chart-releaser skip_existing behaviour).
            if helm pull "oci://ghcr.io/siutsin/$name" --version "$version" --destination /tmp/chart-check > /dev/null 2>&1; then
              echo "$name $version is already published, skip"
              continue
            fi
            rm -rf /tmp/chart
            helm package "$(dirname "$chart_yaml")" --destination /tmp/chart
            pushed=0
            for attempt in 1 2 3; do
              if helm push "/tmp/chart/$name-$version.tgz" oci://ghcr.io/siutsin; then
                pushed=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 5
              fi
            done
            if [ "$pushed" -ne 1 ]; then
              echo "$name $version: helm push failed after 3 attempts"
              failed=1
            fi
          done
          exit "$failed"

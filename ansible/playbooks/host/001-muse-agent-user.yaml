---
- hosts: k3s_cluster
  become: true
  gather_facts: false

  # Read-only diagnostic account for the Muse AI assistant. Key login only.
  # `password: '*'` writes `*` to /etc/shadow: no password can match, yet the
  # account is not locked (a `!` lock can make sshd refuse key login).
  # Groups give journal and kernel log reads without sudo. There is no `sudo`
  # group and no kubeconfig access. Do not add `systemctl`, `journalctl` or
  # `ss` to the sudoers file: their sudo forms can spawn a root shell, delete
  # the journal or write files as root.
  # Every sudoers entry names its full argument list: an entry without one
  # lets sudo run the command with any arguments. The key line below carries
  # no-pty, no-agent-forwarding, no-X11-forwarding and no-user-rc. It does
  # not carry no-port-forwarding or the `restrict` shorthand that includes
  # it: raspberrypi-01 is the jump host for raspberrypi-00 and
  # raspberrypi-02, and an SSH jump opens a port forwarding channel.
  # The key line carries no `from=` list: the source address sshd sees
  # varies with the jump route (every source address seen during October
  # and November 2026 is another node's LAN address), and a wrong list
  # locks out the diagnostic path during an incident.
  vars:
    muse_sudo_commands:
      - /usr/bin/dmesg ""
      - /usr/local/bin/crictl ps ""
      - /usr/local/bin/crictl ps -a
      - /usr/local/bin/crictl ps -o json
      - /usr/local/bin/crictl ps -a -o json
      - /usr/local/bin/crictl images ""
      - /usr/local/bin/crictl images -o json
      - /usr/local/bin/crictl stats ""
      - /usr/local/bin/crictl stats -o json
      # Firewall state is root-only to read. These forms print it and cannot change it.
      - /usr/sbin/ufw status
      - /usr/sbin/ufw status numbered
      - /usr/sbin/ufw status verbose
      - /usr/sbin/nft list ruleset

  tasks:
    - name: Create the muse user
      user:
        name: muse
        comment: Muse agent
        shell: /bin/bash
        create_home: true
        groups: systemd-journal,adm
        append: false
        password: '*'
        update_password: always

    - name: Restrict the muse home directory
      file:
        path: /home/muse
        state: directory
        owner: muse
        group: muse
        mode: '0700'

    - name: Create the muse .ssh directory
      file:
        path: /home/muse/.ssh
        state: directory
        owner: muse
        group: muse
        mode: '0700'

    - name: Install the muse public key as the only authorised key
      copy:
        dest: /home/muse/.ssh/authorized_keys
        content: |
          no-pty,no-agent-forwarding,no-X11-forwarding,no-user-rc ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBur0F7+3iuOQ7yJ2ym9uY16cAny8kwfG3WgdYJNBB0R otaru-agent-nodes-2026-10-30
        owner: muse
        group: muse
        mode: '0600'

    - name: Allow muse a read-only set of privileged commands
      copy:
        dest: /etc/sudoers.d/muse-diag
        content: "muse ALL=(root) NOPASSWD: {{ muse_sudo_commands | join(', ') }}\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

---
- hosts: localhost
  connection: local

  tasks:
    - name: Get all namespaces
      command: kubectl get namespaces -o custom-columns=':metadata.name' --no-headers
      changed_when: false
      register: namespaces
      retries: 5
      delay: 10
      until: namespaces.rc == 0

    # One namespace at a time: restart, then wait. Restarting every namespace
    # at once lets the scheduler stack LUKS-backed pods (jellyfin, hermes, zot)
    # on one node. Each LUKS unlock costs ~65MiB in longhorn-csi-plugin, and the
    # mount storm OOMKilled it on raspberrypi-01 (2026-11-27, exit 137 at the
    # 4Gi limit, node at 99% CPU). A stuck rollout must not block the
    # remaining namespaces.
    - name: Restart deployments and statefulsets in other namespaces, one at a time
      shell: |
        kubectl rollout restart deployments,statefulsets -n {{ item }} &&
        kubectl rollout status deployments,statefulsets -n {{ item }} --timeout=5m
      loop: "{{ namespaces.stdout_lines }}"
      when: item not in ['kube-system', 'longhorn-system']
      changed_when: false
      failed_when: false
      register: deploy_sts_rollout_result

    - name: Collect namespaces where the deployment or statefulset rollout did not complete
      set_fact:
        stuck_workload_namespaces: "{{ deploy_sts_rollout_result.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    # This is the last play of the restart chain, so it carries the one
    # failure for every play.
    - name: Fail if any rollout did not complete
      fail:
        msg: >-
          Rollout did not complete.
          kube-system: {{ stuck_kube_system_namespaces | default([]) | join(', ') or 'none' }}.
          Longhorn: {{ stuck_longhorn_namespaces | default([]) | join(', ') or 'none' }}.
          Daemonsets: {{ stuck_ds_namespaces | default([]) | join(', ') or 'none' }}.
          Deployments/statefulsets: {{ stuck_workload_namespaces | join(', ') or 'none' }}.
      when: >-
        (stuck_kube_system_namespaces | default([]) | length > 0) or
        (stuck_longhorn_namespaces | default([]) | length > 0) or
        (stuck_ds_namespaces | default([]) | length > 0) or
        (stuck_workload_namespaces | length > 0)

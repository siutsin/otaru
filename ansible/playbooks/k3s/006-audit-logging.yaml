---
# Audit logging for the k3s apiserver.
# The audit flags are in the k3s service unit (--kube-apiserver-arg), written by
# 000-init-cluster.yaml and 002-nodes.yaml. A drop-in under config.yaml.d does
# not work: the unit already passes --kube-apiserver-arg on the command line,
# and that list replaces the one from the config file.
# This playbook makes sure the policy file and log file exist, removes the old
# drop-in, and checks each control-plane node. It restarts k3s one node at a
# time, raspberrypi-02 first and raspberrypi-00 last, so etcd keeps quorum, but
# only when the policy file changed.
- hosts: master
  become: true
  gather_facts: false
  serial: 1
  order: reverse_inventory

  tasks:
    - name: Check etcd health and control-plane readiness before the restart
      shell: |
        set -e
        [ "$(k3s kubectl get --raw=/readyz/etcd)" = "ok" ]
        [ "$(k3s kubectl get nodes -l node-role.kubernetes.io/control-plane=true --no-headers | awk '$2 == "Ready" { n++ } END { print n+0 }')" = "3" ]
      changed_when: false

    - name: Create the audit policy, log directory and log file
      include_tasks: audit-prerequisites.yaml

    - name: Remove the old audit drop-in, which k3s ignores
      file:
        path: /etc/rancher/k3s/config.yaml.d/audit.yaml
        state: absent

    - name: Restart k3s so it reads a changed audit policy
      systemd:
        name: k3s
        state: restarted
      when: audit_policy.changed

    - name: Check k3s is active
      command: systemctl is-active k3s
      register: k3s_active
      changed_when: false
      failed_when: k3s_active.stdout != 'active'

    - name: Check the apiserver has all five audit flags
      # k3s logs the full apiserver command line at start.
      shell: |
        journalctl -u k3s --no-pager | grep 'Running kube-apiserver' | tail -1 \
          | grep -oE -- '--audit-(log-path|policy-file|log-maxage|log-maxbackup|log-maxsize)=' | sort -u | wc -l
      register: audit_flags
      changed_when: false
      failed_when: audit_flags.stdout != '5'

    - name: Check all nodes are Ready
      shell: k3s kubectl get nodes --no-headers | awk '$2 == "Ready" { n++ } END { print n+0 }'
      register: nodes_ready
      changed_when: false
      failed_when: nodes_ready.stdout != '6'

    - name: Check etcd health
      command: k3s kubectl get --raw=/readyz/etcd
      register: etcd_ready
      changed_when: false
      failed_when: etcd_ready.stdout != 'ok'

    - name: Wait until Argo CD shows every Application Synced and Healthy
      # The external-secrets app reproducibly fails to sync the
      # clustersecretstores/secretstores CRDs ("metadata.annotations:
      # Too long"). That failure alone does not block the rollout
      # while both CRDs stay Established.
      shell: |
        set -e
        apps=$(k3s kubectl get applications -n argocd \
          -o 'jsonpath={range .items[*]}{.metadata.name} {.status.sync.status} {.status.health.status}{"\n"}{end}')
        bad=$(printf '%s\n' "$apps" | grep -v '^external-secrets ' | grep -v ' Synced Healthy$' || true)
        [ -z "$bad" ]
        es=$(printf '%s\n' "$apps" | grep '^external-secrets ' || true)
        [ -n "$es" ]
        if ! printf '%s\n' "$es" | grep -q ' Synced Healthy$'; then
          [ "$(printf '%s\n' "$es" | awk '{print $2}')" = "OutOfSync" ]
          established=$(k3s kubectl get crd \
            clustersecretstores.external-secrets.io secretstores.external-secrets.io \
            -o 'jsonpath={range .items[*]}{.status.conditions[?(@.type=="Established")].status}{"\n"}{end}' \
            | grep -c '^True$')
          [ "$established" = "2" ]
        fi
      register: argo_check
      until: argo_check.rc == 0
      retries: 30
      delay: 20
      changed_when: false

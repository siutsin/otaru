[settings]
lockfile_platforms = ["linux-x64", "macos-arm64"]
aqua.registries = ["aqua-registry.yaml"]

[tool_config]
locked = true

[tools]
"aqua:astral-sh/uv" = "0.13.10"
"aqua:cli/cli" = "2.105.0"
"aqua:direnv/direnv" = "2.38.2"
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"
"aqua:google/go-jsonnet" = "0.22.0"
"aqua:gruntwork-io/terragrunt" = "1.2.2"
"aqua:helm/helm" = "4.3.2"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2"
"aqua:mikefarah/yq" = "4.54.3"
"aqua:opentofu/opentofu" = "1.13.10"
"aqua:yonahd/kor" = "v0.6.9"
"aqua:zizmorcore/zizmor" = "1.33.1"
"conda:graphviz" = "14.1.2"
node = "24"
"npm:markdownlint-cli2" = "0.24.2"
# ansible-core 2.21.5 crashes on Python 3.15 (dataclasses has no _is_type).
# Remove uvx_args once a release supports 3.15.
"pipx:ansible-core" = { version = "2.22.0", uvx_args = "--python 3.14" }
"pipx:poetry" = "2.5.2"
python = "3.15.2"

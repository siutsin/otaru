[settings]
lockfile_platforms = ["linux-x64", "macos-arm64"]
aqua.registries = ["aqua-registry.yaml"]

[tool_config]
locked = true

[tools]
"aqua:astral-sh/uv" = "0.13.6"
"aqua:cli/cli" = "2.103.3"
"aqua:direnv/direnv" = "2.38.2"
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"
"aqua:google/go-jsonnet" = "0.22.0"
"aqua:gruntwork-io/terragrunt" = "1.2.1"
"aqua:helm/helm" = "4.3.1"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:opentofu/opentofu" = "1.13.2"
"aqua:yonahd/kor" = "v0.6.9"
"aqua:zizmorcore/zizmor" = "1.31.1"
"conda:graphviz" = "14.1.2"
node = "24"
"npm:markdownlint-cli2" = "0.24.0"
# ansible-core 2.21.5 crashes on Python 3.15 (dataclasses has no _is_type).
# Remove uvx_args once a release supports 3.15.
"pipx:ansible-core" = { version = "2.21.5", uvx_args = "--python 3.14" }
"pipx:poetry" = "2.5.1"
python = "3.15.2"
